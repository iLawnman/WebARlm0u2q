<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
/* ===== RESET & BASE ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  font-family: 'Segoe UI', 'Roboto Slab', Georgia, serif;
  background:#050505;
  color:#f0e6d2;
  overflow:hidden;
  -webkit-tap-highlight-color: transparent;
}

/* ===== VARIABLES ===== */
:root {
  --gold:#FFD700;
  --gold-dim:#B8860B;
  --pink:#FF69B4;
  --red:#E90E1B;
  --green:#00C851;
  --panel-bg:rgba(7,7,7,0.93);
  --panel-border:#6A550E;
  --text-main:#f0e6d2;
  --text-dim:#a09070;
  --shadow-gold:0 0 12px rgba(255,215,0,0.25);
}

/* ===== BACKGROUND ===== */
#bg-layer {
  position:fixed; inset:0; z-index:0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(60,30,0,0.3) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 80%, rgba(30,0,60,0.2) 0%, transparent 60%),
    linear-gradient(180deg, #0a0a0a 0%, #000 100%);
}
#bg-pattern {
  position:fixed; inset:0; z-index:0; opacity:0.06;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L35 25L60 30L35 35L30 60L25 35L0 30L25 25Z' fill='%23FFD700'/%3E%3C/svg%3E");
  background-size: 80px 80px;
  pointer-events:none;
}

/* ===== TIMER ===== */
#timer-wrap {
  position:fixed; top:0; left:0; width:100%; height:4px; z-index:100;
  background:rgba(255,255,255,0.05);
}
#timer-bar {
  height:100%; width:100%;
  background:linear-gradient(90deg, var(--gold), var(--red));
  transition:width 1s linear;
  box-shadow:0 0 8px var(--gold);
}

/* ===== MAIN GRID ===== */
#quest-root {
  position:relative; z-index:1;
  width:100%; height:100vh;
  display:grid;
  grid-template-areas:
    "header header header"
    "left   main   right"
    "footer footer footer";
  grid-template-columns: minmax(180px, 14%) 1fr minmax(180px, 14%);
  grid-template-rows: auto 1fr auto;
  gap:10px;
  padding:12px 14px 10px;
}
@media (max-width:900px) {
  #quest-root {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "main"
      "footer";
    padding:8px;
  }
  .side-panel { display:none !important; }
}

/* ===== HEADER / TITLE ===== */
#title-bar {
  grid-area:header;
  background:var(--panel-bg);
  border:1px solid var(--panel-border);
  border-radius:10px;
  padding:10px 18px;
  display:flex; align-items:center; justify-content:center; gap:16px;
  position:relative;
  box-shadow:var(--shadow-gold);
}
#title-bar::before, #title-bar::after {
  content:"❦"; color:var(--red); opacity:0.5; font-size:1.1rem;
}
#title-text {
  font-size:clamp(1rem, 2vw, 1.35rem);
  color:var(--gold);
  text-align:center;
  text-shadow:0 0 8px rgba(255,215,0,0.3);
  font-weight:600;
  letter-spacing:0.5px;
}
#quest-id-badge {
  position:absolute; right:12px; top:50%; transform:translateY(-50%);
  font-size:0.65rem; color:var(--text-dim); opacity:0.6;
  border:1px solid var(--panel-border); padding:2px 6px; border-radius:4px;
}

/* ===== SIDE PANELS ===== */
.side-panel {
  display:flex; flex-direction:column; gap:10px;
}
#left-panel { grid-area:left; }
#right-panel { grid-area:right; }

.help-card {
  background:var(--panel-bg);
  border:1px solid var(--panel-border);
  border-radius:8px;
  padding:12px;
  font-size:0.82rem;
  line-height:1.5;
  color:var(--pink);
  flex:1;
  display:flex; flex-direction:column; gap:6px;
}
.help-card h4 {
  color:var(--gold); font-size:0.78rem; text-transform:uppercase;
  letter-spacing:1px; border-bottom:1px solid var(--panel-border); padding-bottom:4px;
}
.help-card .help-icon { font-size:1.1rem; margin-right:4px; }

.panel-decor {
  height:60px; border:1px solid var(--panel-border); border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  color:var(--gold-dim); font-size:1.5rem; opacity:0.4;
}

/* ===== MAIN PANEL ===== */
#main-panel {
  grid-area:main;
  background:var(--panel-bg);
  border:2px solid var(--panel-border);
  border-radius:14px;
  padding:22px 26px;
  display:flex; flex-direction:column;
  gap:14px;
  position:relative;
  overflow-y:auto;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.5), var(--shadow-gold);
}

/* Corner decorations */
.corner {
  position:absolute; width:28px; height:28px;
  border-color:var(--gold-dim); opacity:0.35; pointer-events:none;
}
.corner.tl { top:10px; left:10px; border-top:2px solid; border-left:2px solid; border-radius:4px 0 0 0; }
.corner.tr { top:10px; right:10px; border-top:2px solid; border-right:2px solid; border-radius:0 4px 0 0; }
.corner.bl { bottom:10px; left:10px; border-bottom:2px solid; border-left:2px solid; border-radius:0 0 0 4px; }
.corner.br { bottom:10px; right:10px; border-bottom:2px solid; border-right:2px solid; border-radius:0 0 4px 0; }

/* Line decorations */
.deco-line {
  height:2px; background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  opacity:0.4; margin:4px 0;
}

/* Question narrative */
.narrative {
  font-style:italic; color:var(--text-dim); font-size:0.92rem;
  border-left:3px solid var(--gold-dim); padding-left:14px;
  line-height:1.6; white-space:pre-wrap;
}

/* Main text */
.main-text {
  font-size:clamp(0.95rem, 1.6vw, 1.15rem);
  line-height:1.65;
  color:var(--text-main);
  white-space:pre-wrap;
  flex:1;
}
.main-text strong { color:var(--gold); }
.main-text .colored { color:var(--red); }
.main-text .align-left { text-align:left; }

/* Answer picture / image area */
.answer-picture-area {
  display:flex; align-items:center; justify-content:center;
  min-height:80px; border:1px dashed var(--panel-border); border-radius:8px;
  color:var(--text-dim); font-size:0.85rem; margin:8px 0;
}

/* ===== FOOTER / BUTTONS ===== */
#footer-panel {
  grid-area:footer;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}

/* Carousel for Slide type */
.carousel-wrap {
  display:flex; align-items:center; justify-content:center; gap:12px;
  width:100%; max-width:700px;
}
.carousel-btn {
  width:44px; height:44px; border-radius:50%;
  border:2px solid var(--gold-dim); background:rgba(0,0,0,0.5);
  color:var(--gold); font-size:1.3rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.2s; flex-shrink:0;
}
.carousel-btn:hover { background:var(--gold); color:#000; }
.carousel-btn:disabled { opacity:0.3; cursor:not-allowed; }

.carousel-display {
  flex:1; min-height:90px;
  background:rgba(0,0,0,0.35);
  border:1px solid var(--panel-border); border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  padding:16px; text-align:center; font-size:1.1rem;
  color:var(--text-main); transition:all 0.3s;
}
.carousel-display.active-opt {
  border-color:var(--gold); box-shadow:0 0 12px rgba(255,215,0,0.2);
}

/* Button grid for Button type */
.btn-grid {
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
  width:100%;
}
.q-btn {
  background:linear-gradient(145deg, #141414, #0a0a0a);
  border:2px solid var(--panel-border); color:var(--gold);
  padding:12px 22px; border-radius:8px; cursor:pointer;
  font-family:inherit; font-size:1rem; min-width:100px;
  text-align:center; transition:all 0.2s;
}
.q-btn:hover { border-color:var(--gold); box-shadow:0 0 10px rgba(255,215,0,0.25); }
.q-btn.selected {
  background:var(--gold); color:#000; border-color:var(--gold);
  box-shadow:0 0 18px rgba(255,215,0,0.45); font-weight:700;
}
.q-btn.correct { border-color:var(--green); box-shadow:0 0 14px rgba(0,200,81,0.35); }
.q-btn.wrong { border-color:var(--red); box-shadow:0 0 14px rgba(233,14,27,0.35); }

/* Input field */
.input-wrap {
  display:flex; gap:10px; align-items:center; justify-content:center;
  flex-wrap:wrap;
}
.q-input {
  background:#0a0a0a; border:2px solid var(--panel-border); color:var(--gold);
  padding:12px 18px; border-radius:8px; font-size:1.15rem; text-align:center;
  min-width:220px; outline:none; font-family:inherit;
}
.q-input:focus { border-color:var(--gold); box-shadow:0 0 10px rgba(255,215,0,0.25); }
.q-input::placeholder { color:var(--text-dim); opacity:0.6; }

/* OK / Next button */
.action-btn {
  background:var(--red); color:#fff; border:none;
  padding:14px 48px; border-radius:8px; font-size:1.15rem;
  font-weight:700; cursor:pointer; text-transform:uppercase;
  letter-spacing:2px; transition:all 0.2s;
}
.action-btn:hover { background:#ff1a2e; box-shadow:0 0 20px rgba(233,14,27,0.45); }
.action-btn:disabled { opacity:0.4; cursor:not-allowed; }

/* Art / AntiArt screen */
.art-screen {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:20px; text-align:center; height:100%;
}
.art-screen h2 { color:var(--gold); font-size:2rem; text-shadow:0 0 16px rgba(255,215,0,0.3); }
.art-screen p { font-size:1.1rem; color:var(--text-dim); max-width:500px; line-height:1.6; }

/* ===== REACTION OVERLAY ===== */
#reaction-overlay {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,0.9);
  display:none; align-items:center; justify-content:center; flex-direction:column;
  padding:30px; text-align:center; backdrop-filter:blur(4px);
}
#reaction-overlay.active { display:flex; }
#reaction-sign { font-size:4.5rem; margin-bottom:16px; }
#reaction-text {
  font-size:clamp(1rem, 2vw, 1.25rem); color:var(--text-main);
  max-width:620px; line-height:1.7; white-space:pre-wrap;
}
#reaction-btn { margin-top:28px; }

/* ===== AR HINT ===== */
#ar-hint {
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
  background:rgba(7,7,7,0.9); border:1px solid var(--panel-border);
  color:var(--gold-dim); padding:6px 14px; border-radius:20px;
  font-size:0.72rem; z-index:50; letter-spacing:0.5px;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.fade-in { animation:fadeIn 0.45s ease-out both; }

@keyframes pulseGold {
  0%,100%{box-shadow:0 0 5px rgba(255,215,0,0.15)}
  50%{box-shadow:0 0 20px rgba(255,215,0,0.4)}
}
.pulse-gold { animation:pulseGold 2.5s infinite; }

@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
}
.shake { animation:shake 0.4s ease-in-out; }

/* Scrollbar */
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--panel-border); border-radius:3px; }

</style>

// ===== STATE =====
let currentQuest = null;
let selectedOptionIdx = -1;
let carouselIdx = 0;
let timerId = null;
let timeLeft = 0;
let inputValue = '';

// ===== UTILS =====
function $(id){ return document.getElementById(id); }
function stripTags(t){
  if(!t) return '';
  return t
    .replace(/<size=[^>]+>/gi,'')
    .replace(/<\/size>/gi,'')
    .replace(/<color=["']?#?[^"'>]+["']?>/gi,'<span class="colored">')
    .replace(/<\/color>/gi,'</span>')
    .replace(/<b>/gi,'<strong>').replace(/<\/b>/gi,'</strong>')
    .replace(/<i>/gi,'<em>').replace(/<\/i>/gi,'</em>')
    .replace(/<align=["']?left["']?>/gi,'<div class="align-left">')
    .replace(/<\/align>/gi,'</div>')
    .replace(/\t/g,'  ');
}

// ===== TIMER =====
function startTimer(seconds){
  clearInterval(timerId);
  if(!seconds || seconds<=0){ $('timer-bar').style.width='100%'; return; }
  timeLeft = seconds;
  const total = seconds;
  $('timer-bar').style.width = '100%';
  timerId = setInterval(()=>{
    timeLeft--;
    $('timer-bar').style.width = (timeLeft/total*100)+'%';
    if(timeLeft<=0){ clearInterval(timerId); handleTimeout(); }
  },1000);
}
function stopTimer(){ clearInterval(timerId); }
function handleTimeout(){
  showReaction('⏳','Время вышки! Придется попробовать снова.','',()=>location.reload());
}

// ===== REACTION OVERLAY =====
function showReaction(sign, text, btnText, callback){
  $('reaction-sign').textContent = sign || '✦';
  $('reaction-text').innerHTML = stripTags(text);
  $('reaction-btn').textContent = btnText || 'Дальше';
  $('reaction-overlay').classList.add('active');
  $('reaction-btn').onclick = ()=>{
    $('reaction-overlay').classList.remove('active');
    if(callback) callback();
  };
}

// ===== QUEST LOADING =====
function loadQuest(qid){
  const quest = QUEST_DATA.find(q=>q.id===qid);
  if(!quest){ console.error('Quest not found:',qid); return; }
  currentQuest = quest;
  selectedOptionIdx = -1;
  carouselIdx = 0;
  inputValue = '';

  const masterAns = quest.answers[0] ? ANSWER_DATA[quest.answers[0]] : null;

  // Title
  $('title-text').innerHTML = stripTags(masterAns?.title || quest.question.substring(0,70)+'...');
  $('quest-id-badge').textContent = quest.id;

  // Help panels
  $('help-up').querySelector('div').innerHTML = stripTags(masterAns?.helpUp || 'Когда найдено испытание, здесь отображается задание и всё, что с ним связано.');
  $('help-down').querySelector('div').innerHTML = stripTags(masterAns?.helpDown || 'Перед наведением на AR-цель осмотрись камерой вокруг, так дополненная реальность лучше размещается в пространстве.');
  $('right-help').querySelector('div').innerHTML = stripTags(masterAns?.question || '');

  // Narrative
  $('narrative').innerHTML = stripTags(quest.question);

  // AR hint
  $('ar-hint').textContent = 'Наведи камеру на AR-метку • Испытание ' + (quest.goalIndex+1) + ' из ' + QUEST_DATA.length;

  // Content
  renderTask();

  // Timer
  startTimer(quest.timer);

  // Animation
  const mp = $('main-panel');
  mp.classList.remove('fade-in');
  void mp.offsetWidth;
  mp.classList.add('fade-in');
}

function renderTask(){
  const task = currentQuest.task;
  const ansIds = currentQuest.answers;
  const master = ansIds[0] ? ANSWER_DATA[ansIds[0]] : null;
  const mainContent = $('main-content');
  const btnArea = $('buttons-area');
  const picArea = $('answer-picture-area');

  mainContent.innerHTML = '';
  btnArea.innerHTML = '';
  picArea.style.display = 'none';

  // Master main text
  if(master?.mainText){
    const div = document.createElement('div');
    div.className = 'main-text';
    div.innerHTML = stripTags(master.mainText);
    mainContent.appendChild(div);
  }

  // Answer picture placeholder
  if(master?.answerPicture){
    picArea.style.display = 'flex';
    picArea.innerHTML = '<span>🖼️ Задание: <strong>' + master.answerPicture + '</strong></span>';
  }

  if(task===1){
    const options = ansIds.slice(1);
    const masterType = master?.type || 'Slide';

    if(masterType==='Slide' && options.length>0){
      // Carousel
      const wrap = document.createElement('div');
      wrap.className = 'carousel-wrap';
      const leftBtn = document.createElement('button');
      leftBtn.className = 'carousel-btn'; leftBtn.innerHTML = '◀';
      const display = document.createElement('div');
      display.className = 'carousel-display';
      const rightBtn = document.createElement('button');
      rightBtn.className = 'carousel-btn'; rightBtn.innerHTML = '▶';

      function updateCarousel(){
        const opt = ANSWER_DATA[options[carouselIdx]];
        display.innerHTML = stripTags(opt?.mainText || '...');
        display.classList.toggle('active-opt', carouselIdx===selectedOptionIdx);
        leftBtn.disabled = carouselIdx===0;
        rightBtn.disabled = carouselIdx>=options.length-1;
      }
      leftBtn.onclick = ()=>{ if(carouselIdx>0){carouselIdx--; updateCarousel();} };
      rightBtn.onclick = ()=>{ if(carouselIdx<options.length-1){carouselIdx++; updateCarousel();} };
      display.onclick = ()=>{ selectedOptionIdx = carouselIdx; updateCarousel(); };
      updateCarousel();

      wrap.appendChild(leftBtn); wrap.appendChild(display); wrap.appendChild(rightBtn);
      btnArea.appendChild(wrap);

      const ok = document.createElement('button');
      ok.className = 'action-btn'; ok.textContent = 'ОК';
      ok.onclick = ()=> checkAnswer(options[selectedOptionIdx], selectedOptionIdx+1);
      btnArea.appendChild(ok);
    }
    else if(masterType==='Button' && options.length>0){
      const grid = document.createElement('div');
      grid.className = 'btn-grid';
      options.forEach((oid, idx)=>{
        const opt = ANSWER_DATA[oid];
        const btn = document.createElement('button');
        btn.className = 'q-btn';
        btn.innerHTML = stripTags(opt?.mainText || oid);
        btn.onclick = ()=> checkAnswer(oid, idx+1);
        grid.appendChild(btn);
      });
      btnArea.appendChild(grid);
    }
    else if(masterType==='InputField' && options.length>0){
      const wrap = document.createElement('div');
      wrap.className = 'input-wrap';
      const inp = document.createElement('input');
      inp.className = 'q-input';
      inp.placeholder = 'ВВЕДИТЕ ОТВЕТ';
      inp.type = 'text';
      inp.oninput = (e)=>{ inputValue = e.target.value; };
      inp.onkeydown = (e)=>{ if(e.key==='Enter') checkInput(); };
      const ok = document.createElement('button');
      ok.className = 'action-btn'; ok.textContent = 'ОК';
      ok.onclick = checkInput;
      wrap.appendChild(inp); wrap.appendChild(ok);
      btnArea.appendChild(wrap);
    }
    else {
      const grid = document.createElement('div');
      grid.className = 'btn-grid';
      options.forEach((oid, idx)=>{
        const opt = ANSWER_DATA[oid];
        const btn = document.createElement('button');
        btn.className = 'q-btn';
        btn.innerHTML = stripTags(opt?.mainText || oid);
        btn.onclick = ()=> checkAnswer(oid, idx+1);
        grid.appendChild(btn);
      });
      btnArea.appendChild(grid);
    }
  }
  else if(task===2){
    const art = document.createElement('div');
    art.className = 'art-screen';
    art.innerHTML = '<h2>✦ Артефакт</h2><p>' + stripTags(master?.mainText || 'Продолжай путь...') + '</p>';
    mainContent.appendChild(art);
    const next = document.createElement('button');
    next.className = 'action-btn pulse-gold';
    next.textContent = 'Продолжить';
    next.onclick = ()=> goTo(currentQuest.rightQuest || currentQuest.nextQuest);
    btnArea.appendChild(next);
  }
  else if(task===3){
    const art = document.createElement('div');
    art.className = 'art-screen';
    art.innerHTML = '<h2>⚠️ Тупик</h2><p>' + stripTags(master?.mainText || 'Ах, пусто... Нужно вернуться.') + '</p>';
    mainContent.appendChild(art);
    const next = document.createElement('button');
    next.className = 'action-btn';
    next.textContent = 'Вернуться';
    next.onclick = ()=> goTo(currentQuest.wrongQuest || currentQuest.nextQuest);
    btnArea.appendChild(next);
  }
}

function checkAnswer(answerId, optionIndex){
  if(optionIndex<1) return;
  const rightIndices = currentQuest.rightIndices;
  const isCorrect = rightIndices.length===0 || rightIndices.includes(optionIndex);

  if(isCorrect){
    showReaction(
      currentQuest.rightReactionSign || '✦',
      currentQuest.rightReaction || 'Верно! Продолжай в том же духе.',
      'Дальше',
      ()=> goTo(currentQuest.rightQuest)
    );
  } else {
    showReaction(
      currentQuest.wrongReactionSign || '✖',
      currentQuest.wrongReaction || 'Эх, неправильно. Попробуй ещё раз!',
      'Повторить',
      ()=>{}
    );
  }
}

function checkInput(){
  const ansIds = currentQuest.answers;
  const options = ansIds.slice(1);
  const val = inputValue.trim().toLowerCase();
  let isCorrect = false;

  options.forEach(oid=>{
    const opt = ANSWER_DATA[oid];
    const optText = (opt?.mainText || '').trim().toLowerCase();
    if(optText && optText===val){ isCorrect = true; }
  });

  if(currentQuest.rightIndices.length===0 && options.length>0 && !isCorrect){
    options.forEach(oid=>{
      const opt = ANSWER_DATA[oid];
      const optText = (opt?.mainText || '').trim().toLowerCase();
      if(optText && (val.includes(optText) || optText.includes(val))){ isCorrect = true; }
    });
  }

  if(isCorrect){
    showReaction(
      currentQuest.rightReactionSign || '✦',
      currentQuest.rightReaction || 'Верно! Продолжай в том же духе.',
      'Дальше',
      ()=> goTo(currentQuest.rightQuest)
    );
  } else {
    showReaction(
      currentQuest.wrongReactionSign || '✖',
      currentQuest.wrongReaction || 'Эх, неправильно. Подумай ещё!',
      'Повторить',
      ()=>{}
    );
  }
}

function goTo(qid){
  if(!qid){ console.warn('No next quest'); return; }
  stopTimer();
  loadQuest(qid);
}

// ===== INIT =====
window.addEventListener('DOMContentLoaded', ()=>{
  loadQuest('Start');
});
</script>
</body>
</html>
