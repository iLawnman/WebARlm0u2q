<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Mutator XR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        
        .slot {
            position: absolute;
            width: 120px; height: 120px;
            background: rgba(0,0,0,0.5);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }
        .slot.filled {
            border: 2px solid #4ade80;
        }
        .slot img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
        }
        .slot .label {
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            opacity: 0.7;
        }
        .slot .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
        }
        .slot.filled .placeholder { display: none; }
        .slot.filled img { display: block; }
        
        #slot-left { top: 20px; left: 20px; }
        #slot-right { top: 20px; right: 20px; }
        
        #hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.5);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        
        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #fbbf24;
            box-shadow: 0 0 60px rgba(251,191,36,0.3);
            display: none;
            background: #1a1a2e;
            pointer-events: none;
        }
        #result img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        #result .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: #fbbf24;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
        }
        
        #status {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #4ade80;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
            pointer-events: none;
        }
        
        @media (max-width: 600px) {
            .slot { width: 80px; height: 80px; }
            #result { width: 200px; height: 200px; }
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div id="slot-left" class="slot">
            <div class="placeholder">
                <div style="font-size:28px;">📷</div>
                <div class="label">Слот 1</div>
            </div>
            <img id="img-left" alt="slot1">
        </div>
        
        <div id="slot-right" class="slot">
            <div class="placeholder">
                <div style="font-size:28px;">📷</div>
                <div class="label">Слот 2</div>
            </div>
            <img id="img-right" alt="slot2">
        </div>
        
        <div id="hint">🔍 Наведите на животное</div>
        <div id="status">⏳ Загрузка...</div>
        <div id="result">
            <img id="result-img" alt="mutation">
            <div class="label">🧬 МУТАНТ</div>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
