<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2 Animal Mutator XR</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: 10;
        }
        
        .slot {
            position: absolute;
            width: 120px; height: 120px;
            background: rgba(0,0,0,0.5);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }
        .slot.filled {
            border: 2px solid #4ade80;
        }
        .slot img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
        }
        .slot .label {
            color: white;
            text-align: center;
            padding: 8px;
            font-size: 11px;
            opacity: 0.7;
        }
        .slot .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            flex-direction: column;
        }
        .slot.filled .placeholder { display: none; }
        .slot.filled img { display: block; }
        
        #slot-left { top: 20px; left: 20px; }
        #slot-right { top: 20px; right: 20px; }
        
        #hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.6);
            background: rgba(0,0,0,0.5);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
            pointer-events: none;
        }
        
        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #fbbf24;
            box-shadow: 0 0 60px rgba(251,191,36,0.3);
            display: none;
            background: #1a1a2e;
            pointer-events: none;
        }
        #result img {
            width: 100%; height: 100%;
            object-fit: cover;
        }
        #result .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: #fbbf24;
            padding: 8px;
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
        }
        
        #status {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: #4ade80;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 20;
        }
        
        /* DEBUG PANEL */
        #debug-toggle {
            position: fixed;
            left: 10px;
            bottom: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.8);
            color: #4ade80;
            border: 1px solid #4ade80;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
            pointer-events: all;
            transition: all 0.3s;
        }
        #debug-toggle:hover {
            background: #4ade80;
            color: #0a0a1a;
        }
        
        #debug-panel {
            position: fixed;
            left: 0;
            top: 0;
            width: 400px;
            max-width: 90vw;
            height: 100vh;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(10px);
            border-right: 2px solid #4ade80;
            z-index: 999;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            pointer-events: all;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        #debug-panel.open {
            transform: translateX(0);
        }
        
        #debug-header {
            padding: 12px 16px;
            background: rgba(74, 222, 128, 0.1);
            border-bottom: 1px solid rgba(74, 222, 128, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        #debug-header h3 {
            color: #4ade80;
            font-size: 14px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        #debug-header .close {
            color: #ef4444;
            cursor: pointer;
            font-size: 18px;
            padding: 0 8px;
        }
        #debug-header .close:hover {
            color: #ff6b6b;
        }
        
        #debug-controls {
            padding: 8px 16px;
            border-bottom: 1px solid rgba(74, 222, 128, 0.1);
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        #debug-controls button {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.3);
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            font-family: monospace;
            transition: all 0.2s;
        }
        #debug-controls button:hover {
            background: rgba(74, 222, 128, 0.3);
        }
        #debug-controls .clear-btn:hover {
            border-color: #ef4444;
            color: #ef4444;
        }
        
        #debug-logs {
            flex: 1;
            overflow-y: auto;
            padding: 8px 16px;
            color: #a0aec0;
            line-height: 1.6;
            font-size: 11px;
        }
        #debug-logs::-webkit-scrollbar {
            width: 4px;
        }
        #debug-logs::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
        }
        #debug-logs::-webkit-scrollbar-thumb {
            background: #4ade80;
            border-radius: 2px;
        }
        
        .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            display: flex;
            gap: 8px;
        }
        .log-time {
            color: #4a5568;
            flex-shrink: 0;
            min-width: 70px;
        }
        .log-level {
            flex-shrink: 0;
            min-width: 50px;
            font-weight: bold;
        }
        .log-level.info { color: #63b3ed; }
        .log-level.success { color: #4ade80; }
        .log-level.warn { color: #fbbf24; }
        .log-level.error { color: #ef4444; }
        .log-level.debug { color: #a78bfa; }
        .log-message {
            word-break: break-word;
            color: #e2e8f0;
        }
        
        .log-entry.highlight {
            background: rgba(74, 222, 128, 0.05);
            border-left: 2px solid #4ade80;
        }
        
        @media (max-width: 600px) {
            .slot { width: 80px; height: 80px; }
            #result { width: 200px; height: 200px; }
            #debug-panel { width: 100vw; max-width: 100vw; }
        }
    </style>
</head>
<body>
    <div id="ui-overlay">
        <div id="slot-left" class="slot">
            <div class="placeholder">
                <div style="font-size:28px;">📷</div>
                <div class="label">Слот 1</div>
            </div>
            <img id="img-left" alt="slot1">
        </div>
        
        <div id="slot-right" class="slot">
            <div class="placeholder">
                <div style="font-size:28px;">📷</div>
                <div class="label">Слот 2</div>
            </div>
            <img id="img-right" alt="slot2">
        </div>
        
        <div id="hint">🔍 Наведите на животное</div>
        <div id="status">⏳ Инициализация...</div>
        <div id="result">
            <img id="result-img" alt="mutation">
            <div class="label">🧬 МУТАНТ</div>
        </div>
    </div>
    
    <button id="debug-toggle">🐞 DEBUG</button>
    <div id="debug-panel">
        <div id="debug-header">
            <h3>🐞 DEBUG LOG</h3>
            <span class="close" id="debug-close">✕</span>
        </div>
        <div id="debug-controls">
            <button id="debug-clear" class="clear-btn">✕ Очистить</button>
            <button id="debug-scroll">📌 Авто-скролл</button>
            <button id="debug-test">🧪 Тест</button>
        </div>
        <div id="debug-logs"></div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
