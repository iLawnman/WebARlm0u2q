<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MediaPipe Object Detection</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    
    #container {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }
    
    #webcam {
      width: 100%;
      display: block;
      border-radius: 8px;
      transform: scaleX(-1);
    }
    
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
      transform: scaleX(-1);
    }
    
    #status {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.75);
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 13px;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 16px;
      text-align: center;
      background: rgba(0,0,0,0.85);
      padding: 20px 30px;
      border-radius: 12px;
      z-index: 20;
      display: none;
      min-width: 200px;
    }
    
    .loader {
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #4CAF50;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6b6b;
      font-size: 15px;
      text-align: center;
      background: rgba(0,0,0,0.92);
      padding: 20px 25px;
      border-radius: 12px;
      z-index: 30;
      display: none;
      max-width: 85%;
      border: 1px solid #ff6b6b;
      line-height: 1.5;
    }
    
    @media (max-width: 480px) {
      #status {
        font-size: 11px;
        padding: 7px 14px;
        bottom: 10px;
      }
      #loading {
        font-size: 14px;
        padding: 16px 20px;
        min-width: 150px;
      }
    }
    
    /* WEBLOG СТИЛИ */
    #weblog-container {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 320px;
      max-height: 70vh;
      z-index: 9999;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      pointer-events: none;
    }
    
    #weblog-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #4CAF50;
      font-size: 18px;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10001;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      user-select: none;
    }
    
    #weblog-toggle:hover {
      transform: scale(1.1);
      background: rgba(0, 0, 0, 0.85);
    }
    
    #weblog-toggle .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff4444;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    
    #weblog-panel {
      position: absolute;
      top: 45px;
      right: 0;
      width: 100%;
      max-height: calc(70vh - 55px);
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      overflow: hidden;
      display: none;
      pointer-events: auto;
      transition: all 0.3s ease;
    }
    
    #weblog-panel.open {
      display: block;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #weblog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.3);
    }
    
    #weblog-header span {
      color: #aaa;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    #weblog-clear {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 8px;
      border-radius: 4px;
      transition: color 0.3s;
      pointer-events: auto;
    }
    
    #weblog-clear:hover {
      color: #ff6b6b;
    }
    
    #weblog-content {
      padding: 6px 10px;
      overflow-y: auto;
      max-height: calc(70vh - 100px);
    }
    
    #weblog-content::-webkit-scrollbar {
      width: 4px;
    }
    
    #weblog-content::-webkit-scrollbar-track {
      background: transparent;
    }
    
    #weblog-content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }
    
    .log-entry {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      line-height: 1.4;
      word-break: break-all;
    }
    
    .log-entry .time {
      color: #666;
      margin-right: 8px;
      font-size: 9px;
    }
    
    .log-entry .level {
      display: inline-block;
      width: 14px;
      text-align: center;
      margin-right: 6px;
      font-weight: bold;
    }
    
    .log-entry .level.info { color: #4CAF50; }
    .log-entry .level.warn { color: #ffa726; }
    .log-entry .level.error { color: #ff6b6b; }
    .log-entry .level.debug { color: #42a5f5; }
    .log-entry .level.success { color: #66bb6a; }
    .log-entry .level.start { color: #ffd54f; }
    .log-entry .level.done { color: #81c784; }
    
    .log-entry .msg {
      color: #e0e0e0;
    }
    
    @media (max-width: 480px) {
      #weblog-container {
        width: 260px;
        top: 6px;
        right: 6px;
      }
      #weblog-toggle {
        width: 30px;
        height: 30px;
        font-size: 14px;
      }
      #weblog-content {
        font-size: 10px;
        max-height: calc(60vh - 90px);
      }
      #weblog-panel {
        max-height: calc(60vh - 45px);
      }
    }
  </style>
</head>
<body>

<div id="container">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <div id="status">⏳ Инициализация...</div>
  <div id="loading">
    <div class="loader"></div>
    Загрузка модели...
  </div>
  <div id="error"></div>
</div>

<!-- WEBLOG -->
<div id="weblog-container">
  <div id="weblog-toggle" title="Показать/скрыть лог">
    📋
    <span class="badge" id="log-badge">0</span>
  </div>
  <div id="weblog-panel">
    <div id="weblog-header">
      <span>📋 Лог событий</span>
      <button id="weblog-clear" title="Очистить лог">✕</button>
    </div>
    <div id="weblog-content"></div>
  </div>
</div>

<!-- ИСПРАВЛЕННЫЙ IMPORT MAP - используем .mjs -->
<script type="importmap">
{
  "imports": {
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm/vision_bundle.mjs"
  }
}
</script>

<script type="module">
// Импортируем из правильного файла .mjs
import { 
  ObjectDetector, 
  FilesetResolver 
} from '@mediapipe/tasks-vision';

// ==========================================
// WEBLOG
// ==========================================
class WebLog {
  constructor() {
    this.entries = [];
    this.maxEntries = 500;
    this.container = document.getElementById('weblog-content');
    this.badge = document.getElementById('log-badge');
    this.toggleBtn = document.getElementById('weblog-toggle');
    this.panel = document.getElementById('weblog-panel');
    this.clearBtn = document.getElementById('weblog-clear');
    this.isOpen = false;
    this.levelIcons = {
      info: 'ℹ️',
      warn: '⚠️',
      error: '❌',
      debug: '🔍',
      success: '✅',
      start: '🚀',
      done: '✔️'
    };
    
    this.initEvents();
    this.log('system', '📋 WebLog инициализирован', 'info');
  }
  
  initEvents() {
    this.toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      this.toggle();
    });
    
    this.clearBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      this.clear();
    });
    
    document.addEventListener('click', (e) => {
      if (this.isOpen && !this.container.closest('#weblog-container').contains(e.target)) {
        this.close();
      }
    });
  }
  
  toggle() {
    this.isOpen ? this.close() : this.open();
  }
  
  open() {
    this.isOpen = true;
    this.panel.classList.add('open');
    this.toggleBtn.textContent = '✕';
    this.toggleBtn.style.color = '#ff6b6b';
  }
  
  close() {
    this.isOpen = false;
    this.panel.classList.remove('open');
    this.toggleBtn.textContent = '📋';
    this.toggleBtn.style.color = '#4CAF50';
  }
  
  clear() {
    this.entries = [];
    this.container.innerHTML = '';
    this.updateBadge();
  }
  
  log(category, message, level = 'info', data = null) {
    const timestamp = new Date();
    const timeStr = timestamp.toLocaleTimeString('ru-RU', { 
      hour12: false, 
      hour: '2-digit', 
      minute: '2-digit', 
      second: '2-digit' 
    });
    
    const entry = {
      id: Date.now() + '_' + Math.random().toString(36).substr(2, 4),
      timestamp,
      timeStr,
      category,
      message,
      level,
      data
    };
    
    this.entries.push(entry);
    if (this.entries.length > this.maxEntries) {
      this.entries.shift();
    }
    
    this.renderEntry(entry);
    this.updateBadge();
    
    const consoleMethod = level === 'error' ? 'error' : 
                         level === 'warn' ? 'warn' : 
                         level === 'debug' ? 'debug' : 'log';
    console[consoleMethod](`[${timeStr}] [${category}] ${message}`, data || '');
    
    const content = this.container;
    if (content) {
      content.scrollTop = content.scrollHeight;
    }
  }
  
  renderEntry(entry) {
    const div = document.createElement('div');
    div.className = 'log-entry';
    div.dataset.id = entry.id;
    
    const icon = this.levelIcons[entry.level] || '📌';
    const levelClass = entry.level;
    
    div.innerHTML = `
      <span class="time">${entry.timeStr}</span>
      <span class="level ${levelClass}">${icon}</span>
      <span class="msg">${this.escapeHtml(entry.message)}</span>
    `;
    
    this.container.appendChild(div);
  }
  
  escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  updateBadge() {
    const count = this.entries.length;
    this.badge.textContent = count;
    this.badge.style.display = count > 0 ? 'flex' : 'none';
  }
  
  info(category, message, data) { this.log(category, message, 'info', data); }
  warn(category, message, data) { this.log(category, message, 'warn', data); }
  error(category, message, data) { this.log(category, message, 'error', data); }
  debug(category, message, data) { this.log(category, message, 'debug', data); }
  success(category, message, data) { this.log(category, message, 'success', data); }
  start(category, message, data) { this.log(category, message, 'start', data); }
  done(category, message, data) { this.log(category, message, 'done', data); }
}

const log = new WebLog();

// ==========================================
// ОСНОВНОЙ КОД
// ==========================================

const video = document.getElementById('webcam');
const canvas = document.getElementById('canvas');
const canvasCtx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');

// URL модели
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/1/efficientdet_lite0_uint8.tflite';
const MAX_DETECTIONS = 5;
const SCORE_THRESHOLD = 0.3;

// ИСПРАВЛЕННЫЙ URL WASM - используем правильный путь с .mjs
const WASM_URL = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm';

let objectDetector = null;
let isRunning = false;
let frameCount = 0;
let startTime = Date.now();

function showError(message) {
  errorEl.textContent = '❌ ' + message;
  errorEl.style.display = 'block';
  loadingEl.style.display = 'none';
  statusEl.textContent = '❌ Ошибка';
  log.error('app', 'Ошибка: ' + message);
}

// === КАМЕРА ===
async function initCamera() {
  log.start('camera', 'Инициализация камеры...');
  statusEl.textContent = '📷 Запрос доступа к камере...';
  
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });
    
    log.info('camera', 'Доступ к камере получен');
    
    video.srcObject = stream;
    await video.play();
    
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    
    log.success('camera', 'Камера запущена', { width: canvas.width, height: canvas.height });
    statusEl.textContent = '📷 Камера готова, загружаем модель...';
    return true;
  } catch (error) {
    log.error('camera', 'Ошибка: ' + error.message);
    showError('Доступ к камере: ' + error.message);
    return false;
  }
}

// === MEDIAPIPE - ИСПРАВЛЕННАЯ ВЕРСИЯ ===
async function initMediaPipe() {
  log.start('mediapipe', 'Инициализация MediaPipe...');
  loadingEl.style.display = 'block';
  statusEl.textContent = '⏳ Загрузка WASM и модели...';
  
  try {
    // Загрузка WASM
    log.info('mediapipe', 'Загрузка WASM из ' + WASM_URL);
    const visionStart = performance.now();
    
    const vision = await FilesetResolver.forVisionTasks(WASM_URL);
    
    const visionTime = (performance.now() - visionStart).toFixed(0);
    log.success('mediapipe', 'WASM загружен за ' + visionTime + 'ms');
    
    // Создание детектора
    log.info('mediapipe', 'Загрузка модели EfficientDet Lite0');
    const modelStart = performance.now();
    
    objectDetector = await ObjectDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: MODEL_URL,
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      maxResults: MAX_DETECTIONS,
      scoreThreshold: SCORE_THRESHOLD
    });
    
    const modelTime = (performance.now() - modelStart).toFixed(0);
    log.success('mediapipe', 'Модель загружена за ' + modelTime + 'ms');
    
    loadingEl.style.display = 'none';
    statusEl.textContent = '✅ Готово! Начинаем детекцию';
    log.done('mediapipe', 'MediaPipe полностью инициализирован');
    
    return true;
  } catch (error) {
    log.error('mediapipe', 'Ошибка: ' + (error.message || 'Неизвестная ошибка'));
    log.error('mediapipe', 'Stack: ' + (error.stack || 'Нет стека'));
    loadingEl.style.display = 'none';
    showError('Модель: ' + (error.message || 'Неизвестная ошибка'));
    return false;
  }
}

// === ОТРИСОВКА ===
function drawResults(results) {
  const width = canvas.width;
  const height = canvas.height;
  
  canvasCtx.clearRect(0, 0, width, height);
  canvasCtx.drawImage(video, 0, 0, width, height);
  
  if (!results || !results.detections || results.detections.length === 0) {
    return;
  }
  
  results.detections.forEach((detection, index) => {
    const bbox = detection.boundingBox;
    const categories = detection.categories;
    
    if (!bbox || !categories || categories.length === 0) return;
    
    const category = categories[0];
    const label = category.categoryName || 'Объект';
    const score = category.score || 0;
    const scorePercent = Math.round(score * 100);
    
    const x = bbox.originX * width;
    const y = bbox.originY * height;
    const w = bbox.width * width;
    const h = bbox.height * height;
    
    const hue = Math.min(120, Math.max(0, 120 * score));
    const color = `hsl(${hue}, 80%, 50%)`;
    const bgColor = `hsla(${hue}, 80%, 50%, 0.15)`;
    
    canvasCtx.strokeStyle = color;
    canvasCtx.lineWidth = 3;
    canvasCtx.shadowColor = 'rgba(0,0,0,0.5)';
    canvasCtx.shadowBlur = 8;
    canvasCtx.strokeRect(x, y, w, h);
    canvasCtx.shadowBlur = 0;
    
    canvasCtx.fillStyle = bgColor;
    canvasCtx.fillRect(x, y, w, h);
    
    const text = `${label} ${scorePercent}%`;
    const fontSize = Math.max(13, Math.min(18, w / 12));
    canvasCtx.font = `bold ${fontSize}px Arial`;
    const textMetrics = canvasCtx.measureText(text);
    const textWidth = textMetrics.width;
    const textHeight = fontSize + 10;
    const padding = 8;
    
    const textX = x;
    const textY = Math.max(0, y - textHeight - 5);
    const textBgWidth = textWidth + padding * 2;
    const textBgHeight = textHeight + padding;
    
    canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    canvasCtx.shadowBlur = 10;
    canvasCtx.shadowColor = 'rgba(0,0,0,0.5)';
    
    const radius = 6;
    canvasCtx.beginPath();
    canvasCtx.moveTo(textX + radius, textY);
    canvasCtx.lineTo(textX + textBgWidth - radius, textY);
    canvasCtx.quadraticCurveTo(textX + textBgWidth, textY, textX + textBgWidth, textY + radius);
    canvasCtx.lineTo(textX + textBgWidth, textY + textBgHeight - radius);
    canvasCtx.quadraticCurveTo(textX + textBgWidth, textY + textBgHeight, textX + textBgWidth - radius, textY + textBgHeight);
    canvasCtx.lineTo(textX + radius, textY + textBgHeight);
    canvasCtx.quadraticCurveTo(textX, textY + textBgHeight, textX, textY + textBgHeight - radius);
    canvasCtx.lineTo(textX, textY + radius);
    canvasCtx.quadraticCurveTo(textX, textY, textX + radius, textY);
    canvasCtx.closePath();
    canvasCtx.fill();
    canvasCtx.shadowBlur = 0;
    
    canvasCtx.fillStyle = 'white';
    canvasCtx.textBaseline = 'top';
    canvasCtx.fillText(text, textX + padding, textY + padding);
    
    canvasCtx.font = `${fontSize * 0.6}px Arial`;
    canvasCtx.fillStyle = 'rgba(255,255,255,0.4)';
    canvasCtx.fillText(`#${index + 1}`, x + padding, y + h + padding + 2);
  });
}

// === ЦИКЛ ===
function detectLoop() {
  if (!isRunning) return;
  
  if (objectDetector && video.readyState >= 2) {
    try {
      const detectStart = performance.now();
      const detections = objectDetector.detectForVideo(video, performance.now());
      const detectTime = (performance.now() - detectStart).toFixed(1);
      
      const count = detections.detections ? detections.detections.length : 0;
      frameCount++;
      
      if (count > 0) {
        const topLabel = detections.detections[0].categories[0]?.categoryName || 'объект';
        const topScore = Math.round((detections.detections[0].categories[0]?.score || 0) * 100);
        statusEl.textContent = `🎯 ${count} объектов | ${topLabel} (${topScore}%) | ${detectTime}ms`;
        
        if (frameCount % 30 === 0) {
          log.debug('detection', `Кадр ${frameCount}: ${count} объектов, ${detectTime}ms`);
        }
      } else {
        statusEl.textContent = `🔍 Сканирование... ${detectTime}ms`;
      }
      
      drawResults(detections);
      
    } catch (error) {
      log.error('detection', 'Ошибка: ' + error.message);
      statusEl.textContent = '⚠️ Ошибка детекции';
    }
  }
  
  requestAnimationFrame(detectLoop);
}

// === ЗАПУСК ===
async function start() {
  log.start('app', '🚀 Запуск приложения');
  log.info('app', 'MediaPipe: @mediapipe/tasks-vision (последняя версия)');
  log.info('app', 'Модель: EfficientDet Lite0');
  log.info('app', 'Платформа: ' + navigator.platform);
  
  isRunning = true;
  
  const cameraReady = await initCamera();
  if (!cameraReady) {
    log.error('app', 'Не удалось инициализировать камеру');
    isRunning = false;
    return;
  }
  
  const modelReady = await initMediaPipe();
  if (!modelReady) {
    log.error('app', 'Не удалось инициализировать модель');
    isRunning = false;
    return;
  }
  
  log.success('app', '✅ Все готово, запускаем детекцию');
  detectLoop();
}

// Обработчики ошибок
window.addEventListener('error', (event) => {
  log.error('global', 'Ошибка: ' + (event.error?.message || event.message));
});

window.addEventListener('unhandledrejection', (event) => {
  log.error('global', 'Unhandled rejection: ' + (event.reason?.message || event.reason));
});

// Запуск
