<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new Three.js + Troika + WebXR</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #canvas-container { width: 100vw; height: 100vh; }
        #hidden-frame {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 600px;
            height: 400px;
            border: 0;
        }
    </style>

    <!-- Import Map для правильной загрузки ES-модулей -->
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>
<iframe id="hidden-frame" src="about.html"></iframe>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // 1. Инициализация сцены, камеры и рендерера
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111118);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;

    container.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    // 2. Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1, 0);
    controls.update();

    // 3. Свет
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // 4. Куб в центре
    const cubeGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);
    const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0x44aa88, roughness: 0.3 });
    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
    cube.position.set(0, 0.5, 0);
    scene.add(cube);

    // 5. Создание 3D-панели сabout.html
    function createUiPanel(textureCanvas) {
        const texture = new THREE.CanvasTexture(textureCanvas);
        texture.minFilter = THREE.LinearFilter;

        const planeGeo = new THREE.PlaneGeometry(1.5, 1.0);
        const planeMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });

        const uiPlane = new THREE.Mesh(planeGeo, planeMat);
        uiPlane.position.set(0, 1.6, 0);
        scene.add(uiPlane);
    }

    // 6. Отрисовка iframe через html2canvas
    const iframe = document.getElementById('hidden-frame');
    iframe.onload = () => {
        setTimeout(() => {
            try {
                const iframeDocument = iframe.contentDocument || iframe.contentWindow.document;
                html2canvas(iframeDocument.body, { width: 600, height: 400 }).then(canvas => {
                    createUiPanel(canvas);
                });
            } catch (e) {
                console.error("Для загрузки iframe требуется локальный веб-сервер!", e);
            }
        }, 300);
    };

    // 7. Цикл анимации
    renderer.setAnimationLoop(() => {
        cube.rotation.y += 0.01;
        if (!renderer.xr.isPresenting) {
            controls.update();
        }
        renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
