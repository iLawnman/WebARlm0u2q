<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>import fix Troika 3D UI — WebXR AR Panel</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #webgl-container {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  #hint {
    position: absolute;
    z-index: 10;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #e2e8f0;
    font-size: 13px;
    background: rgba(11, 17, 32, 0.65);
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    pointer-events: none;
    text-align: center;
    max-width: 90%;
  }

  #unsupported {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #94a3b8;
    padding: 32px;
    background: #05070d;
  }

  #unsupported h2 { color: #f8fafc; margin-bottom: 12px; }

  /* Стилизация и принудительное отображение кнопки ARButton из Three.js */
  #ARButton {
    position: absolute !important;
    bottom: 30px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
    z-index: 9999 !important;
    padding: 12px 24px !important;
    border: 1px solid rgba(99, 102, 241, 0.5) !important;
    border-radius: 999px !important;
    background: rgba(15, 23, 42, 0.85) !important;
    color: #f8fafc !important;
    font-family: inherit !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5) !important;
    backdrop-filter: blur(8px) !important;
    transition: all 0.2s ease !important;
  }

  #ARButton:active {
    transform: translateX(-50%) scale(0.96) !important;
  }
</style>
</head>
<body>

<div id="webgl-container"></div>
<div id="hint">Наведите камеру на пол — появится маркер. Коснитесь экрана, чтобы поставить куб и 3D-панель.</div>

<div id="unsupported">
  <div>
    <h2>WebXR AR недоступен</h2>
    <p>Откройте страницу на Android-устройстве в Chrome (ARCore) по HTTPS,<br>
       или на устройстве с поддержкой WebXR immersive-ar.</p>
  </div>
</div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "troika-3d-ui": "https://esm.sh/troika-3d-ui@0.50.0?external=three",
        "troika-3d": "https://esm.sh/troika-3d@0.50.0?external=three",
        "troika-three-text": "https://esm.sh/troika-three-text@0.50.0?external=three"
      }
    }
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { Block, Text, Button } from 'troika-3d-ui';
import { initInteraction } from 'troika-3d';

const webglContainer = document.getElementById('webgl-container');
const hint = document.getElementById('hint');
const unsupportedEl = document.getElementById('unsupported');

// ---------- Scene Setup ----------
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
webglContainer.appendChild(renderer.domElement);

// Инициализация взаимодействия Troika
const raycastController = initInteraction(renderer, camera, scene);

// ---------- AR Button Restoration ----------
const arButton = ARButton.createButton(renderer, {
  requiredFeatures: ['hit-test'],
  optionalFeatures: ['local-floor']
});
arButton.id = 'ARButton';
document.body.appendChild(arButton);

// Проверка поддержки WebXR AR
if (!('xr' in navigator)) {
  unsupportedEl.style.display = 'flex';
} else {
  navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
    if (!supported) unsupportedEl.style.display = 'flex';
  }).catch(() => { unsupportedEl.style.display = 'flex'; });
}

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.2));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(2, 4, 2);
scene.add(dirLight);

// ---------- Floor Reticle ----------
const reticleGeometry = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ---------- 3D Cube ----------
const cubeSize = 0.18;
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize),
  new THREE.MeshStandardMaterial({
    color: 0x6366f1,
    metalness: 0.3,
    roughness: 0.35,
    emissive: 0x1e1b4b,
    emissiveIntensity: 0.4,
  })
);
cube.visible = false;
scene.add(cube);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(cube.geometry),
  new THREE.LineBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.7 })
);
edges.visible = false;
scene.add(edges);

// ---------- Troika 3D UI Panel ----------
let debugClickCount = 0;

const uiPanel = new Block({
  width: 0.6,
  height: 0.65,
  padding: 0.03,
  flexDirection: 'column',
  justifyContent: 'space-between',
  backgroundColor: 0x0b1120,
  backgroundOpacity: 0.9,
  borderRadius: 0.02,
  borderWidth: 0.002,
  borderColor: 0x3b82f6,
  fontSize: 0.03,
  color: 0xf8fafc,
  visible: false
});

const titleText = new Text({
  text: 'Troika 3D UI Panel',
  fontSize: 0.04,
  color: 0x67e8f9,
  marginBottom: 0.02
});

const contentBlock = new Block({
  width: '100%',
  flex: 1,
  padding: 0.02,
  backgroundColor: 0x0f172a,
  borderRadius: 0.01,
  flexDirection: 'column'
});

const bodyText = new Text({
  text: 'Панель отрендерена внутри 3D-сцены с помощью Troika UI.\n\nПоддерживает нативный Raycasting и клики через XR-контроллер.',
  fontSize: 0.024,
  color: 0x94a3b8,
  maxWidth: 0.5
});

contentBlock.add(bodyText);

const debugLogText = new Text({
  text: 'Лог кликов: ожидает клика…',
  fontSize: 0.02,
  color: 0x67e8f9,
  marginTop: 0.01
});

const testButton = new Button({
  width: '100%',
  height: 0.07,
  backgroundColor: 0x4f46e5,
  borderRadius: 0.01,
  justifyContent: 'center',
  alignItems: 'center',
  onClick: (evt) => {
    debugClickCount++;
    const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
    const logMsg = `[${time}] #${debugClickCount} Клик по 3D кнопке ✅`;
    debugLogText.text = logMsg;
    debugLogText.sync();
    console.log('[Troika 3D UI]', logMsg);
  }
});

const buttonText = new Text({
  text: '🧪 Тест клика (Troika Event)',
  fontSize: 0.024,
  color: 0xffffff
});
testButton.add(buttonText);

uiPanel.add(titleText);
uiPanel.add(contentBlock);
uiPanel.add(testButton);
uiPanel.add(debugLogText);

scene.add(uiPanel);

// ---------- AR Logic & Selection ----------
let hitTestSource = null;
let hitTestSourceRequested = false;
let placed = false;

renderer.xr.addEventListener('sessionstart', () => {
  placed = false;
  cube.visible = false;
  edges.visible = false;
  uiPanel.visible = false;
  reticle.visible = false;
  hitTestSourceRequested = false;
  hitTestSource = null;
});

function onSelect() {
  if (!reticle.visible || placed) return;

  cube.position.setFromMatrixPosition(reticle.matrix);
  cube.position.y += cubeSize / 2;
  edges.position.copy(cube.position);
  cube.visible = true;
  edges.visible = true;

  uiPanel.position.set(cube.position.x, cube.position.y + 0.45, cube.position.z);
  uiPanel.quaternion.copy(camera.quaternion);
  uiPanel.visible = true;
  uiPanel.afterUpdateMatrixWorld();

  placed = true;
}

const controller = renderer.xr.getController(0);
controller.addEventListener('select', () => {
  if (!placed) {
    onSelect();
  }
});
scene.add(controller);

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Animation / Render Loop ----------
const clock = new THREE.Clock();

renderer.setAnimationLoop((timestamp, frame) => {
  if (frame) {
    const session = renderer.xr.getSession();
    const referenceSpace = renderer.xr.getReferenceSpace();

    hint.style.display = 'none';

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource && !placed) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  if (placed) {
    const t = clock.getElapsedTime();
    cube.rotation.y = t * 0.6;
    edges.rotation.copy(cube.rotation);

    // Панель всегда смотрит на камеру
    uiPanel.quaternion.copy(camera.quaternion);
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
