<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>1 Troika WebAR & 3D Flex UI</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #101216; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ar-button-container {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }
  </style>

  <!-- Importmap для ES-модулей -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "troika-worker-utils": "https://unpkg.com/troika-worker-utils@0.51.0/dist/troika-worker-utils.esm.js",
        "troika-three-utils": "https://unpkg.com/troika-three-utils@0.51.0/dist/troika-three-utils.esm.js",
        "troika-three-text": "https://unpkg.com/troika-three-text@0.51.0/dist/troika-three-text.esm.js",
        "troika-3d": "https://unpkg.com/troika-3d@0.51.0/dist/troika-3d.esm.js",
        "troika-3d-ui": "https://unpkg.com/troika-3d-ui@0.51.0/dist/troika-3d-ui.esm.js"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="ar-button-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { SceneFacade, createContainerUIElement, createTextUIElement } from 'troika-3d-ui';

    // 1. Сцена и WebGL Рендерер с поддержкой AR
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
    camera.position.set(0, 1.2, 1.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.xr.enabled = true;
    container.appendChild(renderer.domElement);

    // Добавление кнопки запуска WebAR (Android Chrome / ARCore)
    const arBtnContainer = document.getElementById('ar-button-container');
    arBtnContainer.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

    // 2. Управление камерой на десктопе
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.8, 0);
    controls.update();

    // Свет
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    // 3. Центральный куб под панелью
    const cubeGeo = new THREE.BoxGeometry(0.35, 0.35, 0.35);
    const cubeMat = new THREE.MeshStandardMaterial({ color: 0x3fb950, roughness: 0.2 });
    const cube = new THREE.Mesh(cubeGeo, cubeMat);
    cube.position.set(0, 0.2, 0);
    scene.add(cube);

    // 4. Troika Flexbox 3D UI
    const Container = createContainerUIElement();
    const Text = createTextUIElement();
    const sceneFacade = new SceneFacade(scene, camera, renderer);

    // Параметры прокрутки панели
    let scrollTop = 0;
    const maxScroll = 0.5;

    function renderUI() {
      sceneFacade.update({
        children: [
          {
            key: 'main-card',
            facade: Container,
            x: 0,
            y: 0.95,
            z: 0,
            width: 1.2,
            height: 0.85,
            flexDirection: 'column',
            backgroundColor: 0x21262d,
            borderRadius: 0.03,
            padding: 0.04,
            clipRect: [0, 0, 1.2, 0.85], // Обрезка содержимого для скролла

            // Скроллинг через колесико или drag/touch-события Troika
            onWheel: (e) => {
              scrollTop = Math.max(0, Math.min(maxScroll, scrollTop + e.deltaY * 0.001));
              renderUI();
            },

            children: [
              // Шапка
              {
                facade: Container,
                padding: 0.01,
                backgroundColor: 0x30363d,
                borderRadius: 0.015,
                marginBottom: 0.03,
                children: [
                  {
                    facade: Text,
                    text: "WebAR & WebGL Платформа",
                    fontSize: 0.028,
                    color: 0x58a6ff
                  }
                ]
              },
              {
                facade: Text,
                text: "Интерактивные AR-квесты в браузере",
                fontSize: 0.045,
                color: 0xf0f6fc,
                marginBottom: 0.02
              },

              // Прокручиваемый контейнер
              {
                facade: Container,
                flexDirection: 'column',
                y: scrollTop, // Прокрутка смещением
                children: [
                  // Кнопки-теги
                  {
                    facade: Container,
                    flexDirection: 'row',
                    flexWrap: 'wrap',
                    marginBottom: 0.03,
                    children: ['WebGL', 'Three.js', 'WebAR', 'VFX', 'Анимации'].map((tag, i) => ({
                      key: `tag-${i}`,
                      facade: Container,
                      padding: 0.015,
                      marginRight: 0.015,
                      marginBottom: 0.015,
                      backgroundColor: 0x30363d,
                      borderRadius: 0.01,
                      
                      // Обработка кликов (меняет цвет куба)
                      onClick: () => {
                        cube.material.color.setHex(Math.random() * 0xffffff);
                      },
                      children: [
                        { facade: Text, text: tag, fontSize: 0.025, color: 0x7ee787 }
                      ]
                    }))
                  },
                  // Описание
                  {
                    facade: Text,
                    text: "Запуск дополненной реальности без установки сторонних приложений на Android Chrome через WebXR API.\n\n" +
                          "Поддерживает скроллинг, кликабельные интерактивные элементы и адаптивную верстку Flexbox.",
                    fontSize: 0.026,
                    color: 0x8b949e,
                    width: 1.1
                  }
                ]
              }
            ]
          }
        ]
      });
    }

    renderUI();

    // 5. Цикл рендеринга
    renderer.setAnimationLoop(() => {
      cube.rotation.y += 0.005;

      if (!renderer.xr.isPresenting) {
        controls.update();
      }

      sceneFacade.render();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
