<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js WebXR DOM Overlay</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: sans-serif;
    }

    /* Контейнер для 3D-графики */
    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Наш контейнер поверх сцены. По умолчанию скрыт. */
    #overlay-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      /* Важно: клики проходят сквозь пустые области оверлея в 3D сцену */
      pointer-events: none;
    }

    /* Кастомная кнопка внутри интерфейса */
    .ar-ui-button {
      /* Возвращаем кликабельность кнопке */
      pointer-events: auto;
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 32px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000;
      border: none;
      border-radius: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      font-weight: bold;
    }

    .ar-ui-button:active {
      background: #ffffff;
      transform: translateX(-50%) scale(0.95);
    }
  </style>

  <!-- Импортируем Three.js через ES Modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com",
        "three/addons/": "https://unpkg.com"
      }
    }
  </script>
</head>
<body>

<!-- Блок, куда Three.js вставит свой <canvas> -->
<div id="webgl-container"></div>

<!-- Контейнер для кнопок, который мы превратим в DOM Overlay -->
<div id="overlay-container">
  <button id="action-btn" class="ar-ui-button">Взаимодействие в AR</button>
</div>

<script type="module">
  import * as THREE from 'three';
  import { ARButton } from 'three/addons/webxr/ARButton.js';

  // Ссылки на элементы
  const webglContainer = document.getElementById('webgl-container');
  const overlayContainer = document.getElementById('overlay-container');
  const actionBtn = document.getElementById('action-btn');

  let scene, camera, renderer, mesh;

  init();

  function init() {
    // 1. Создаем сцену и камеру
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    // Добавим немного света
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 3);
    scene.add(light);

    // Создаем тестовый куб, чтобы увидеть его в AR
    const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
    const material = new THREE.MeshStandardMaterial({ color: 0x00ff00 });
    mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(0, 0, -0.5); // Ставим перед камерой
    scene.add(mesh);

    // 2. Настраиваем WebGLRenderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true; // Важно для WebXR

    // Добавляем canvas именно в webgl-container, а не в overlay!
    webglContainer.appendChild(renderer.domElement);

    // 3. Создаем кнопку ARButton и подключаем к ней DOM Overlay
    const arButtonOptions = {
      requiredFeatures: ['dom-overlay'],
      domOverlay: { root: overlayContainer } // Привязываем оверлей интерфейса
    };

    // Генерируем кнопку "START AR" на экране
    document.body.appendChild(ARButton.createButton(renderer, arButtonOptions));

    // 4. Управление видимостью интерфейса во время AR-сессии
    renderer.xr.addEventListener('sessionstart', () => {
      overlayContainer.style.display = 'block'; // Показываем интерфейс в AR
    });

    renderer.xr.addEventListener('sessionend', () => {
      overlayContainer.style.display = 'none';  // Прячем интерфейс при выходе
    });

    // 5. Предотвращаем "прокликивание" сквозь кнопку в WebXR-сцену
    actionBtn.addEventListener('beforexrselect', (event) => {
      event.preventDefault();
    });

    // Логика нажатия на кнопку
    actionBtn.addEventListener('click', () => {
      // Пример действия: меняем цвет куба при нажатии на HTML-кнопку
      mesh.material.color.setHex(Math.random() * 0xffffff);
      console.log('Цвет куба изменен с помощью DOM Overlay!');
    });

    // Обработка изменения размера экрана
    window.addEventListener('resize', onWindowResize);

    // Запуск цикла анимации через встроенный метод XR
    renderer.setAnimationLoop(render);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function render(timestamp, frame) {
    // Медленное вращение куба для теста
    if (mesh) {
      mesh.rotation.x += 0.01;
      mesh.rotation.y += 0.01;
    }
    renderer.render(scene, camera);
  }
</script>
</body>
</html>
