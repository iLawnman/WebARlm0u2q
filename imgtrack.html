<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WebXR Image Tracking</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      touch-action: none;
    }

    #container {
      position: fixed;
      inset: 0;
    }

    #info {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
      max-width: 90%;
    }

    #log-container {
      position: fixed;
      top: 100px;
      left: 200px;
      transform: translateX(-50%);
      z-index: 10;
      width: 90%;
      max-width: 600px;
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0,0,0,0.85);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(255,255,255,0.1);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #0f0;
      pointer-events: none;
    }

    #log-container::-webkit-scrollbar {
      width: 4px;
    }
    #log-container::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }

    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      word-break: break-word;
    }
    .log-entry .time {
      color: #666;
      margin-right: 8px;
    }
    .log-entry.error { color: #ff6b6b; }
    .log-entry.warn { color: #ffd93d; }
    .log-entry.success { color: #6bcb77; }

    #status {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #fff;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
      background: rgba(0,0,0,0.5);
      padding: 6px 16px;
      border-radius: 12px;
    }

    #ar-btn {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 16px 48px;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      background: #6366f1;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(99,102,241,0.4);
      transition: all 0.2s;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #ar-btn:active {
      transform: scale(0.95);
    }
    #ar-btn:disabled {
      opacity: 0.5;
      transform: none;
      cursor: not-allowed;
    }
    #ar-btn.hidden {
      display: none;
    }

    #unsupported {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: #05070d;
      color: #94a3b8;
      text-align: center;
      padding: 20px;
      flex-direction: column;
    }
    #unsupported h2 {
      color: #f8fafc;
      margin-bottom: 12px;
      font-size: 24px;
    }
    #unsupported .info {
      margin-top: 20px;
      font-size: 13px;
      background: rgba(255,255,255,0.05);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    #unsupported code {
      background: rgba(255,255,255,0.1);
      padding: 2px 8px;
      border-radius: 4px;
      color: #e2e8f0;
    }
  </style>
</head>
<body>

<div id="container"></div>

<div id="info">📷 Наведите камеру на изображение</div>

<div id="unsupported">
  <h2>⚠️ WebXR AR недоступен</h2>
  <p>Откройте страницу на Android в Chrome (ARCore) по HTTPS</p>
  <div class="info">
    Для image-tracking включите флаг:<br>
    <code>chrome://flags/#webxr-image-tracking</code>
  </div>
</div>

<div id="log-container">
  <div class="log-entry"><span class="time">[--:--:--]</span> Ожидание запуска...</div>
</div>

<div id="status">📌 Готов к запуску</div>

<button id="ar-btn">🚀 Start AR</button>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';

  // ---------- DOM ----------
  const container = document.getElementById('container');
  const logContainer = document.getElementById('log-container');
  const statusEl = document.getElementById('status');
  const arBtn = document.getElementById('ar-btn');
  const unsupportedEl = document.getElementById('unsupported');
  const infoEl = document.getElementById('info');

  // ---------- Лог ----------
  function log(msg, level = '') {
    const time = new Date().toISOString().substring(11, 23);
    const entry = document.createElement('div');
    entry.className = `log-entry${level ? ' ' + level : ''}`;
    entry.innerHTML = `<span class="time">[${time}]</span> ${msg}`;
    logContainer.appendChild(entry);
    logContainer.scrollTop = logContainer.scrollHeight;

    while (logContainer.children.length > 50) {
      logContainer.removeChild(logContainer.firstChild);
    }

    console.log('[AR]', msg);
  }

  function setStatus(msg) {
    statusEl.textContent = msg;
    log(msg);
  }

  // ---------- Проверка WebXR ----------
  if (!('xr' in navigator)) {
    unsupportedEl.style.display = 'flex';
    log('WebXR не поддерживается', 'error');
  } else {
    navigator.xr.isSessionSupported('immersive-ar').then(supported => {
      if (!supported) {
        unsupportedEl.style.display = 'flex';
        log('immersive-ar не поддерживается', 'error');
      } else {
        log('✅ immersive-ar поддерживается', 'success');
      }
    }).catch(() => {
      unsupportedEl.style.display = 'flex';
      log('Ошибка проверки', 'error');
    });
  }

  // ---------- Параметры ----------
  const IMAGE_URL = "./assets/recoimages/T1.jpg";
  const IMAGE_WIDTH = 0.1;

  let session = null;
  let referenceSpace = null;
  let trackedObject = null;
  let frameCount = 0;
  let isRunning = false;

  // ---------- THREE ----------
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  container.appendChild(renderer.domElement);

  // ---------- Освещение ----------
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.5));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(1, 3, 2);
  scene.add(dirLight);

  // ---------- Сетка ----------
  const grid = new THREE.GridHelper(0.5, 10);
  grid.position.y = -0.05;
  scene.add(grid);

  // ---------- Объект для трекинга ----------
  function createObject() {
    const size = IMAGE_WIDTH * 0.5;
    const geo = new THREE.BoxGeometry(size, size, size);
    const mat = new THREE.MeshStandardMaterial({
      color: 0xff4400,
      emissive: 0xff2200,
      emissiveIntensity: 0.3,
      metalness: 0.2,
      roughness: 0.5
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.visible = false;

    const edges = new THREE.EdgesGeometry(geo);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
    mesh.add(line);

    scene.add(mesh);
    return mesh;
  }

  // ---------- Загрузка изображения ----------
  async function loadImage(url) {
    log(`Загрузка: ${url}`);
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const blob = await resp.blob();
    log(`Размер: ${blob.size} байт`);
    const bitmap = await createImageBitmap(blob);
    log(`Декодировано: ${bitmap.width}x${bitmap.height}`, 'success');
    return bitmap;
  }

  // ---------- Запуск AR ----------
  async function startAR() {
    if (isRunning) return;
    isRunning = true;

    arBtn.disabled = true;
    arBtn.textContent = '⏳ Запуск...';

    try {
      // 1. Загружаем изображение
      const imageBitmap = await loadImage(IMAGE_URL);

      // 2. Создаем объект
      trackedObject = createObject();
      log('Объект создан');

      // 3. Создаем сессию
      log('Запрос сессии...');

      const sessionInit = {
        requiredFeatures: ['image-tracking'],
        trackedImages: [{
          image: imageBitmap,
          widthInMeters: IMAGE_WIDTH,
        }]
      };

      session = await navigator.xr.requestSession('immersive-ar', sessionInit);
      log('✅ Сессия создана', 'success');

      // 4. Настраиваем рендерер
      await renderer.xr.setSession(session);
      log('Рендерер настроен');

      // 5. Получаем reference space
      referenceSpace = await session.requestReferenceSpace('local-floor');
      log('Reference space получен', 'success');

      // 6. Проверяем API
      const hasTracking = 'getImageTrackingResults' in XRFrame.prototype;
      log(`Image tracking API: ${hasTracking ? '✅' : '❌'}`);

      if (!hasTracking) {
        log('⚠️ Image tracking не поддерживается', 'warn');
      }

      // 7. Скрываем кнопку
      arBtn.classList.add('hidden');
      infoEl.style.display = 'none';
      setStatus('🔍 Поиск изображения...');

      // 8. Основной цикл
      renderer.setAnimationLoop((timestamp, frame) => {
        frameCount++;

        if (!frame) {
          if (frameCount % 60 === 0) log('Нет кадра', 'warn');
          return;
        }

        let detected = false;

        if (hasTracking) {
          try {
            const results = frame.getImageTrackingResults();

            if (results && results.length > 0) {
              for (const result of results) {
                if (result.trackedImageIndex === 0) {
                  const state = result.trackingState;

                  if (state === 'tracked' || state === 'emulated') {
                    try {
                      const pose = frame.getPose(result.imageSpace, referenceSpace);
                      if (pose) {
                        detected = true;
                        trackedObject.visible = true;
                        trackedObject.matrix.fromArray(pose.transform.matrix);
                        trackedObject.matrix.decompose(
                                trackedObject.position,
                                trackedObject.quaternion,
                                trackedObject.scale
                        );

                        if (frameCount % 30 === 0) {
                          setStatus(`✅ ТРЕКИНГ! ${state}`);
                        }
                        break;
                      }
                    } catch (err) {
                      if (frameCount % 60 === 0) {
                        log(`Ошибка позы: ${err.message}`, 'error');
                      }
                    }
                  }
                }
              }
            }
          } catch (err) {
            if (frameCount % 60 === 0) {
              log(`Ошибка: ${err.message}`, 'error');
            }
          }
        }

        if (!detected) {
          trackedObject.visible = false;
          if (frameCount % 60 === 0) {
            setStatus('🔍 Поиск изображения...');
          }
        }

        renderer.render(scene, camera);
      });

      // 9. Обработчик завершения
      session.addEventListener('end', () => {
        log('Сессия завершена');
        renderer.setAnimationLoop(null);
        arBtn.classList.remove('hidden');
        arBtn.disabled = false;
        arBtn.textContent = '🚀 Start AR';
        infoEl.style.display = 'block';
        isRunning = false;
        setStatus('📌 Сессия завершена');
      });

    } catch (err) {
      setStatus(`❌ ${err.message}`);
      log(err.stack || String(err), 'error');
      arBtn.disabled = false;
      arBtn.textContent = '🚀 Start AR';
      arBtn.classList.remove('hidden');
      isRunning = false;
    }
  }

  // ---------- Обработчик кнопки ----------
  arBtn.addEventListener('click', (e) => {
    e.preventDefault();
    log('👆 Нажата кнопка');
    startAR();
  });

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Старт ----------
  log('📄 Страница загружена');
  setStatus('📌 Нажмите Start AR');

  console.log('AR Button:', arBtn);
</script>
</body>
</html>
