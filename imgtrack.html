<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>WebXR Image Tracking</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }

    body:xr-overlay {
      background: transparent;
    }

    #startButton {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
      z-index: 10; padding: 14px 22px; font: 16px sans-serif;
      border: none; border-radius: 8px; cursor: pointer;
    }

    #status {
      position: fixed; left: 0; right: 260px; bottom: 0;
      padding: 10px 14px; font: 13px/1.4 monospace; color: #fff;
      background: rgba(0,0,0,0.55); z-index: 10; pointer-events: none;
    }

    #logPanel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 260px;
      background: rgba(0,0,0,0.75); color: #0f0; z-index: 20;
      font: 11px/1.35 monospace; overflow-y: auto;
      padding: 8px; box-sizing: border-box;
      border-left: 1px solid rgba(255,255,255,0.2);
    }
    #logPanel .entry { white-space: pre-wrap; word-break: break-word; margin-bottom: 4px; }
    #logPanel .entry.warn { color: #ff0; }
    #logPanel .entry.error { color: #f55; }
    #logPanel .t { color: #888; }
  </style>
</head>
<body>
  <button id="startButton">Start AR</button>
  <div id="status"></div>
  <div id="logPanel"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";

    const statusEl = document.getElementById("status");
    const logPanel = document.getElementById("logPanel");
    const startButton = document.getElementById("startButton");

    // WebXR native image tracking is an experimental "image-tracking" feature.
    // As of now it only ships (behind a flag) in Chrome for Android.
    // The tracked image must be provided as a decoded ImageBitmap plus its
    // physical width in meters, so AR.js's .patt marker file is not used here.

    const TRACKED_IMAGE_URL = "assets/recoimages/";
    const TRACKED_IMAGE_WIDTH_METERS = 0.1; // measure your printed/screen image and set this correctly

    let renderer, scene, camera;
    let trackedImageBitmap;
    let placedNode = null;
    let frameCounter = 0;

    function logLine(msg, level) {
      const time = new Date().toISOString().substring(11, 23);
      const entry = document.createElement("div");
      entry.className = "entry" + (level ? " " + level : "");
      entry.innerHTML = '<span class="t">[' + time + "]</span> " + msg;
      logPanel.appendChild(entry);
      logPanel.scrollTop = logPanel.scrollHeight;

      const consoleFn =
        level === "error" ? console.error : level === "warn" ? console.warn : console.log;
      consoleFn("[webxr-image-tracking]", msg);
    }

    function setStatus(msg) {
      statusEl.textContent = msg;
      logLine(msg);
    }

    async function loadTrackedImage(url) {
      logLine("Fetching tracked image: " + url);
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(
          "Tracked image fetch failed: " + response.status + " " + response.statusText
        );
      }
      const blob = await response.blob();
      logLine("Tracked image blob loaded, size=" + blob.size + " bytes, type=" + blob.type);
      const bitmap = await createImageBitmap(blob);
      logLine(
        "Tracked image decoded: " + bitmap.width + "x" + bitmap.height + " px"
      );
      return bitmap;
    }

    function initThree() {
      logLine("Initializing THREE renderer/scene/camera");
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera();

      const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
      scene.add(light);

      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
      logLine("THREE renderer ready");
    }

    function buildContentNode() {
      const geometry = new THREE.PlaneGeometry(
        TRACKED_IMAGE_WIDTH_METERS,
        TRACKED_IMAGE_WIDTH_METERS
      );
      const material = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        transparent: true,
      });
      const mesh = new THREE.Mesh(geometry, material);
      mesh.rotation.x = -Math.PI / 2;
      mesh.visible = false;
      scene.add(mesh);
      logLine("Placeholder content node created (hidden until tracked)");
      return mesh;
    }

    async function startAR() {
      logLine("=== Start AR pressed ===");

      logLine("navigator.xr present: " + Boolean(navigator.xr));
      if (!navigator.xr) {
        setStatus("WebXR not available on this browser/device.");
        return;
      }

      let supported = false;
      try {
        supported = await navigator.xr.isSessionSupported("immersive-ar");
      } catch (err) {
        logLine("isSessionSupported threw: " + err.message, "error");
      }
      logLine("immersive-ar supported: " + supported);
      if (!supported) {
        setStatus("immersive-ar not supported on this device.");
        return;
      }

      try {
        trackedImageBitmap = await loadTrackedImage(TRACKED_IMAGE_URL);
      } catch (err) {
        setStatus("Failed to load tracked image: " + err.message);
        logLine(err.stack || String(err), "error");
        return;
      }

      initThree();
      placedNode = buildContentNode();

      logLine(
        "Requesting session with requiredFeatures=[image-tracking, local-floor], " +
          "trackedImages width=" + TRACKED_IMAGE_WIDTH_METERS + "m"
      );

      let session;
      try {
        session = await navigator.xr.requestSession("immersive-ar", {
          requiredFeatures: ["image-tracking", "local-floor"],
          optionalFeatures: ["dom-overlay"],
          domOverlay: { root: document.body },
          trackedImages: [
            {
              image: trackedImageBitmap,
              widthInMeters: TRACKED_IMAGE_WIDTH_METERS,
            },
          ],
        });
        logLine("requestSession resolved OK");
        if (session.domOverlayState) {
          logLine("domOverlayState: " + session.domOverlayState.type);
        } else {
          logLine(
            "dom-overlay unsupported on this device — the log panel will NOT be " +
              "visible during the session. Use `adb logcat` / chrome://inspect " +
              "remote debugging to read console.log output instead.",
            "warn"
          );
        }

        if (typeof session.getTrackedImageScores === "function") {
          try {
            const scores = await session.getTrackedImageScores();
            scores.forEach((score, i) => {
              logLine(
                "Tracked image[" + i + "] score: " + score,
                score === "untrackable" ? "error" : undefined
              );
            });
            if (scores.some((s) => s === "untrackable")) {
              logLine(
                "Image marked UNTRACKABLE by the browser at session start — " +
                  "this is why results are always empty. Use an image with more " +
                  "contrast/detail/asymmetry, higher resolution, and no repeating patterns.",
                "error"
              );
            }
          } catch (scoreErr) {
            logLine("getTrackedImageScores threw: " + scoreErr.message, "warn");
          }
        } else {
          logLine(
            "session.getTrackedImageScores not available in this browser build",
            "warn"
          );
        }
      } catch (err) {
        setStatus("Failed to start immersive-ar session: " + err.message);
        logLine(err.stack || String(err), "error");
        logLine(
          "Common causes: not HTTPS, image-tracking flag disabled, " +
            "browser other than Chrome Android, camera permission denied.",
          "warn"
        );
        return;
      }

      startButton.style.display = "none";
      renderer.xr.setReferenceSpaceType("local-floor");
      await renderer.xr.setSession(session);
      logLine("Session attached to renderer");

      const referenceSpace = renderer.xr.getReferenceSpace();
      logLine("Reference space acquired: " + (referenceSpace ? "ok" : "null"));

      if (!("getImageTrackingResults" in XRFrame.prototype)) {
        logLine(
          "XRFrame.getImageTrackingResults is not defined by this browser build — " +
            "image-tracking is unsupported even though the session started.",
          "error"
        );
      }

      renderer.setAnimationLoop((timestamp, frame) => {
        frameCounter++;
        if (!frame) {
          if (frameCounter % 60 === 0) logLine("Frame " + frameCounter + ": no XRFrame", "warn");
          return;
        }

        const results = frame.getImageTrackingResults
          ? frame.getImageTrackingResults()
          : null;

        if (results === null) {
          if (frameCounter % 60 === 0) {
            logLine(
              "Frame " + frameCounter + ": getImageTrackingResults unavailable on this frame",
              "warn"
            );
          }
          renderer.render(scene, camera);
          return;
        }

        if (frameCounter % 30 === 0) {
          logLine("Frame " + frameCounter + ": " + results.length + " tracking result(s)");
        }

        let matched = false;

        for (const result of results) {
          if (result.trackedImageIndex !== 0) continue;

          if (frameCounter % 30 === 0) {
            logLine(
              "  result idx=" + result.trackedImageIndex +
                " state=" + result.trackingState
            );
          }

          if (result.trackingState === "tracked") {
            const pose = frame.getPose(result.imageSpace, referenceSpace);
            if (pose) {
              matched = true;
              placedNode.visible = true;
              placedNode.matrix.fromArray(pose.transform.matrix);
              placedNode.matrix.decompose(
                placedNode.position,
                placedNode.quaternion,
                placedNode.scale
              );
              setStatus("Image detected: state=tracked");
            } else {
              logLine("trackingState=tracked but getPose returned null", "warn");
            }
          } else if (result.trackingState === "emulated") {
            matched = true;
            setStatus("Image detected: state=emulated (last known pose)");
          }
        }

        if (!matched) {
          placedNode.visible = false;
          if (frameCounter % 30 === 0) setStatus("Searching for image target...");
        }

        renderer.render(scene, camera);
      });

      session.addEventListener("end", () => {
        logLine("Session ended");
        renderer.setAnimationLoop(null);
        startButton.style.display = "block";
      });

      session.addEventListener("visibilitychange", () => {
        logLine("Session visibility: " + session.visibilityState);
      });
    }

    startButton.addEventListener("click", () => {
      startAR().catch((err) => {
        setStatus("Unexpected error: " + err.message);
        logLine(err.stack || String(err), "error");
      });
    });

    window.addEventListener("error", (e) => {
      logLine("window error: " + e.message, "error");
    });
    window.addEventListener("unhandledrejection", (e) => {
      logLine("unhandled rejection: " + (e.reason && e.reason.message ? e.reason.message : e.reason), "error");
    });

    logLine("Page loaded. Waiting for Start AR.");
  </script>
</body>
</html>
