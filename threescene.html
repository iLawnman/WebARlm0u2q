<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Х WebXR Android Touch Fix</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0e0f14;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="hint">Коснитесь пола, чтобы поставить объект</div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        // 1. Сцена и Камера
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0e0f14);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.8, 3.5);

        // 2. Рендерер
        const container = document.getElementById('canvas-container');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.xr.enabled = true;
        container.appendChild(renderer.domElement);

        document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 3. Свет
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 4. Пол
        const floorGrid = new THREE.GridHelper(10, 20, 0x444444, 0x222222);
        scene.add(floorGrid);

        const floorPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(30, 30),
            new THREE.MeshBasicMaterial({ visible: false })
        );
        floorPlane.rotation.x = -Math.PI / 2;
        scene.add(floorPlane);

        const placedObjects = [];

        // 5. Текстура UI
        function createUIPanelCanvas() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 800;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#4c5878';
            ctx.beginPath();
            ctx.roundRect(0, 0, 1024, 800, 24);
            ctx.fill();

            ctx.strokeStyle = '#8596bd';
            ctx.lineWidth = 3;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.beginPath();
            ctx.roundRect(40, 40, 360, 52, 26);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#c5d3f0';
            ctx.font = '600 22px system-ui';
            ctx.fillText('WebAR & WebGL Платформа', 65, 74);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px system-ui';
            ctx.fillText('Интерактивные AR-квесты в', 40, 160);
            ctx.fillText('браузере', 40, 215);

            ctx.fillStyle = '#40e0d0';
            ctx.font = '500 24px system-ui';
            ctx.fillText('Запуск дополненной реальности без установки сторонних', 40, 275);
            ctx.fillText('приложений', 40, 310);

            const tags = ['WebGL', 'Three.js', 'WebAR', 'VFX', 'Анимации'];
            let tagX = 40;
            ctx.font = '500 20px system-ui';

            tags.forEach(tag => {
                const textWidth = ctx.measureText(tag).width;
                const pillWidth = textWidth + 36;
                ctx.strokeStyle = '#6b7a9e';
                ctx.lineWidth = 2;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                ctx.beginPath();
                ctx.roundRect(tagX, 360, pillWidth, 44, 22);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#40e0d0';
                ctx.fillText(tag, tagX + 18, 389);
                tagX += pillWidth + 14;
            });

            ctx.strokeStyle = '#627297';
            ctx.lineWidth = 2;
            ctx.fillStyle = '#232b38';
            ctx.beginPath();
            ctx.roundRect(40, 440, 944, 320, 20);
            ctx.fill();
            ctx.stroke();

            const grad = ctx.createLinearGradient(40, 440, 984, 760);
            grad.addColorStop(0, '#2d5a3f');
            grad.addColorStop(1, '#1b3b28');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.roundRect(48, 448, 928, 304, 16);
            ctx.fill();

            return canvas;
        }

        const sharedCanvas = createUIPanelCanvas();
        const sharedUiTexture = new THREE.CanvasTexture(sharedCanvas);
        sharedUiTexture.minFilter = THREE.LinearFilter;
        sharedUiTexture.magFilter = THREE.LinearFilter;

        const cubeSize = 0.55;
        const cubeGeo = new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize);
        const cubeMat = new THREE.MeshStandardMaterial({ color: 0x338266, roughness: 0.3, metalness: 0.1 });

        const uiGeo = new THREE.PlaneGeometry(1.3, 1.015);
        const uiMat = new THREE.MeshBasicMaterial({ map: sharedUiTexture, transparent: true, side: THREE.DoubleSide });

        function createNewAnchorInstance(x, y, z) {
            const group = new THREE.Group();

            const cube = new THREE.Mesh(cubeGeo, cubeMat);
            cube.position.set(0, cubeSize / 2, 0);
            group.add(cube);

            const uiMesh = new THREE.Mesh(uiGeo, uiMat);
            uiMesh.position.set(0, cubeSize + 0.6, 0);
            group.add(uiMesh);

            group.position.set(x, y, z);
            scene.add(group);

            placedObjects.push({ group, cube });
            document.getElementById('hint').innerText = `Создано объектов: ${placedObjects.length}`;
        }

        // 6. Фикс сенсорного ввода на Android (Обычный 3D-режим)
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        function handleTouchOrClick(clientX, clientY) {
            if (renderer.xr.isPresenting) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(floorPlane);

            if (intersects.length > 0) {
                const pt = intersects[0].point;
                createNewAnchorInstance(pt.x, pt.y, pt.z);
            }
        }

        // Используем touchend / click с отслеживанием смещения пальца
        let touchStartX = 0;
        let touchStartY = 0;

        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }
        }, { passive: true });

        renderer.domElement.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) {
                const deltaX = Math.abs(e.changedTouches[0].clientX - touchStartX);
                const deltaY = Math.abs(e.changedTouches[0].clientY - touchStartY);
                // Проверяем, что это тап, а не свайп кадра (OrbitControls)
                if (deltaX < 10 && deltaY < 10) {
                    handleTouchOrClick(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                }
            }
        });

        renderer.domElement.addEventListener('click', (e) => {
            handleTouchOrClick(e.clientX, e.clientY);
        });

        // 7. AR сессия (WebXR)
        let xrHitTestSource = null;
        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', () => {
            if (reticle.visible) {
                createNewAnchorInstance(reticle.position.x, reticle.position.y, reticle.position.z);
            }
        });
        scene.add(controller);

        const reticle = new THREE.Mesh(
            new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0x40e0d0 })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // 8. Цикл рендеринга
        renderer.setAnimationLoop((timestamp, frame) => {
            placedObjects.forEach(item => {
                item.cube.rotation.y += 0.005;
            });

            if (frame && renderer.xr.isPresenting) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!xrHitTestSource) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            xrHitTestSource = source;
                        });
                    });
                }

                if (xrHitTestSource) {
                    const hitTestResults = frame.getHitTestResults(xrHitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);
                        reticle.visible = true;
                        reticle.matrix.fromArray(pose.transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            controls.update();
            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
