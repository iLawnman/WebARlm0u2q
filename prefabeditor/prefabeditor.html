<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактор — Квест Платформа</title>
  <link rel="stylesheet" href="./css/styles.css">

  <script src="./js/utils.js"></script>
  <script src="./js/panels.js"></script>
  <script src="./js/objects.js"></script>
  <script src="./js/scene.js"></script>
  <script src="./js/io.js"></script>
  <script src="./js/inspector.js"></script>
  <script src="./js/main.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>

  <style>
    :root {
      --bg: #0f0f12;
      --panel: #1a1a20;
      --border: #2a2a35;
      --text: #e8e8ef;
      --muted: #888;
      --accent: #c9a227;
      --success: #2d8a4e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #sidebar {
      width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #sidebar .section { margin-bottom: 18px; }
    #sidebar h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    #sidebar button {
      display: block;
      width: 100%;
      margin: 4px 0;
      padding: 8px 12px;
      background: #252530;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      text-align: left;
    }
    #sidebar button:hover { background: #2e2e3a; border-color: #444; }
    #sidebar button.btn-success {
      background: rgba(45, 138, 78, 0.25);
      border-color: var(--success);
      color: #7dcea0;
    }
    #sidebar button.btn-success:hover { background: rgba(45, 138, 78, 0.4); }
    #sidebar select {
      width: 100%;
      padding: 6px 8px;
      background: #252530;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
    }
    #viewport {
      flex: 1;
      position: relative;
      background: #0a0a0e;
    }
    #canvas3d { width: 100%; height: 100%; display: block; }
    #inspector {
      width: 300px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 12px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    #inspector h3 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin: 0 0 8px;
    }
    #design-preview-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 50;
      background: #111;
      overflow: auto;
    }
    #design-preview-overlay.active { display: block; }
    #design-preview-overlay .preview-toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #1a1a20;
      border-bottom: 1px solid #2a2a35;
    }
    #design-preview-overlay .preview-toolbar button {
      padding: 6px 14px;
      background: #252530;
      border: 1px solid #2a2a35;
      border-radius: 6px;
      color: #e8e8ef;
      cursor: pointer;
      font-size: 13px;
    }
    #design-preview-overlay .preview-toolbar button:hover { background: #2e2e3a; }
    #design-preview-frame {
      width: 100%;
      height: calc(100% - 48px);
      border: none;
      background: #111;
    }
    #json-status {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }
    #json-status.ok { color: #7dcea0; }
    #json-status.err { color: #e07070; }

    #sidebar button.btn-run {
      background: rgba(233, 14, 27, 0.25);
      border-color: #E90E1B;
      color: #ff8a8a;
      font-weight: 600;
    }
    #sidebar button.btn-run:hover { background: rgba(233, 14, 27, 0.4); }
    #sim-status { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
    #sim-status.ok { color: #7dcea0; }
    #sim-status.err { color: #e07070; }

    /* ===== SIMULATION ===== */
    #sim-overlay {
      display: none; position: absolute; inset: 0; z-index: 60;
      background: #050505; flex-direction: column;
    }
    #sim-overlay.active { display: flex; }
    #sim-overlay .sim-toolbar {
      position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; background: #1a1a20; border-bottom: 1px solid #2a2a35; flex-shrink: 0;
    }
    #sim-overlay .sim-toolbar button {
      padding: 6px 14px; background: #252530; border: 1px solid #2a2a35;
      border-radius: 6px; color: #e8e8ef; cursor: pointer; font-size: 13px;
    }
    #sim-overlay .sim-toolbar button:hover { background: #2e2e3a; }
    #sim-body { flex: 1; position: relative; overflow: hidden; }
    .sim-bg-img {
      position: absolute; inset: 0;
      background-size: cover; background-position: center;
      opacity: 0.3; pointer-events: none; z-index: 0;
    }
    #sim-timer-wrap {
      position: absolute; top: 0; left: 0; width: 100%; height: 4px; z-index: 5;
      background: rgba(255,255,255,0.05);
    }
    #sim-timer-bar {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #FFD700, #E90E1B);
      transition: width 1s linear;
    }

    #sim-root {
      position: absolute; inset: 0; display: grid;
      grid-template-areas:
        "header header header"
        "left   main   right"
        "footer footer footer";
      grid-template-columns: minmax(140px, 16%) 1fr minmax(140px, 16%);
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 14px 16px 12px;
      color: #f0e6d2;
      font-family: 'Segoe UI', Georgia, serif;
      z-index: 1;
    }
    @media (max-width: 900px) {
      #sim-root {
        grid-template-columns: 1fr;
        grid-template-areas: "header" "main" "footer";
      }
      #sim-root .side-panel { display: none !important; }
    }

    .sim-panel {
      position: relative;
      background: rgba(7,7,7,0.93);
      border: 2px solid #6A550E;
      border-radius: 12px;
      box-shadow: 0 0 14px rgba(255,215,0,0.18), inset 0 0 30px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .sim-panel-corner {
      position: absolute;
      width: 32px; height: 32px;
      background-size: contain;
      background-repeat: no-repeat;
      opacity: 0.85;
      pointer-events: none;
      z-index: 2;
    }
    .sim-panel-corner.tl { top: 4px; left: 4px; }
    .sim-panel-corner.tr { top: 4px; right: 4px; transform: scaleX(-1); }
    .sim-panel-corner.bl { bottom: 4px; left: 4px; transform: scaleY(-1); }
    .sim-panel-corner.br { bottom: 4px; right: 4px; transform: scale(-1); }

    #sim-title-bar {
      grid-area: header;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    #sim-title-text {
      font-size: clamp(1rem, 2vw, 1.35rem);
      color: #FFD700;
      text-align: center;
      font-weight: 600;
    }
    #sim-quest-badge {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      font-size: 0.65rem; color: #a09070; opacity: 0.7;
      border: 1px solid #6A550E; padding: 2px 8px; border-radius: 4px;
    }

    .side-panel { display: flex; flex-direction: column; gap: 10px; }
    #sim-left { grid-area: left; }
    #sim-right { grid-area: right; }

    .help-card {
      flex: 1;
      padding: 14px 12px;
      font-size: 0.82rem;
      line-height: 1.5;
      color: #FF69B4;
      position: relative;
    }
    .help-card h4 {
      color: #FFD700;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-bottom: 1px solid #6A550E;
      padding-bottom: 4px;
      margin: 0 0 8px;
    }
    .side-mandala {
      height: 56px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      opacity: 0.45;
      margin-bottom: 6px;
    }

    #sim-main {
      grid-area: main;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow-y: auto;
    }
    .deco-line {
      height: 10px;
      background-size: contain;
      background-repeat: repeat-x;
      background-position: center;
      opacity: 0.45;
      flex-shrink: 0;
    }
    .narrative {
      font-style: italic;
      color: #a09070;
      font-size: 0.92rem;
      border-left: 3px solid #B8860B;
      padding-left: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .main-text {
      font-size: clamp(0.95rem, 1.6vw, 1.15rem);
      line-height: 1.65;
      color: #f0e6d2;
      white-space: pre-wrap;
      flex: 1;
    }
    .main-text strong { color: #FFD700; }

    #sim-footer {
      grid-area: footer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #sim-buttons-area {
      width: 100%;
      max-width: 820px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #6A550E;
      background: rgba(7,7,7,0.93);
      box-shadow: 0 0 12px rgba(255,215,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .carousel-wrap {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; width: 100%; max-width: 700px;
    }
    .carousel-btn {
      width: 44px; height: 44px; border-radius: 50%;
      border: 2px solid #B8860B; background: rgba(0,0,0,0.5);
      color: #FFD700; font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .carousel-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .carousel-display {
      flex: 1; min-height: 90px;
      background: rgba(0,0,0,0.35);
      border: 1px solid #6A550E; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      padding: 16px; text-align: center; font-size: 1.1rem; color: #f0e6d2;
      cursor: pointer;
      white-space: pre-wrap;
    }
    .carousel-display.active-opt {
      border-color: #FFD700;
      box-shadow: 0 0 12px rgba(255,215,0,0.2);
    }
    .btn-grid {
      display: flex; flex-wrap: wrap; gap: 10px;
      justify-content: center; width: 100%;
    }
    .q-btn {
      background: linear-gradient(145deg, #141414, #0a0a0a);
      border: 2px solid #6A550E; color: #FFD700;
      padding: 12px 22px; border-radius: 8px; cursor: pointer;
      font-family: inherit; font-size: 1rem; min-width: 100px; text-align: center;
    }
    .q-btn:hover { border-color: #FFD700; }
    .input-wrap {
      display: flex; gap: 10px; align-items: center;
      justify-content: center; flex-wrap: wrap;
    }
    .q-input {
      background: #0a0a0a; border: 2px solid #6A550E; color: #FFD700;
      padding: 12px 18px; border-radius: 8px; font-size: 1.15rem;
      text-align: center; min-width: 220px; outline: none; font-family: inherit;
    }
    .q-input:focus { border-color: #FFD700; }
    .q-input::placeholder { color: #a09070; opacity: 0.6; }
    .action-btn {
      background: #E90E1B; color: #fff; border: none;
      padding: 14px 48px; border-radius: 8px;
      font-size: 1.15rem; font-weight: 700; cursor: pointer;
      text-transform: uppercase; letter-spacing: 2px;
    }
    .action-btn:hover { background: #ff1a2e; }
    .art-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; text-align: center;
    }
    .art-screen h2 { color: #FFD700; font-size: 2rem; margin: 0; }
    .art-screen p {
      font-size: 1.1rem; color: #a09070;
      max-width: 500px; line-height: 1.6; margin: 0;
    }
    #sim-reaction {
      position: absolute; inset: 0; z-index: 20;
      background: rgba(0,0,0,0.9);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; padding: 30px; text-align: center;
    }
    #sim-reaction.active { display: flex; }
    #sim-reaction-sign { font-size: 4.5rem; margin-bottom: 16px; }
    #sim-reaction-text {
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #f0e6d2; max-width: 620px; line-height: 1.7; white-space: pre-wrap;
    }
    #sim-ar-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(7,7,7,0.9); border: 1px solid #6A550E; color: #B8860B;
      padding: 6px 14px; border-radius: 20px; font-size: 0.72rem; z-index: 5;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div class="section">
    <h3>Локальные префабы</h3>
    <button onclick="window.__editor && window.__editor.loadLocalPrefab && window.__editor.loadLocalPrefab()">Загрузить дефолтный шаблон</button>
    <button onclick="document.getElementById('file-input').click()">Открыть HTML...</button>
    <button class="btn-success" onclick="document.getElementById('json-input').click()">Загрузить JSON дизайн</button>
    <button onclick="window.__editor && window.__editor.exportHTML && window.__editor.exportHTML()">Сохранить HTML</button>

    <input type="file" id="file-input" style="display:none" accept=".html,.template" onchange="window.__editor && window.__editor.handleFileSelect && window.__editor.handleFileSelect(event)">
    <input type="file" id="json-input" style="display:none" accept=".json" onchange="DesignBuilder.handleJsonFile(event)">
    <select id="json-row-selector" style="display:none; margin-top:6px;" onchange="DesignBuilder.handleRowChange(event)"></select>
    <div id="json-status"></div>
    <button class="btn-success" id="btn-show-design" style="display:none; margin-top:8px;" onclick="DesignBuilder.showPreview()">Показать дизайн-превью</button>
    <button id="btn-hide-design" style="display:none; margin-top:4px;" onclick="DesignBuilder.hidePreview()">Скрыть превью</button>
  </div>

  <div class="section">
    <h3>Симуляция квеста</h3>
    <button class="btn-run" onclick="document.getElementById('bundle-json-input').click()">▶ Загрузить JSON(ы)</button>
    <input type="file" id="bundle-json-input" style="display:none" accept=".json" multiple onchange="QuestSim.handleBundleFiles(event)">
    <div id="sim-status"></div>
  </div>

  <div class="section">
    <h3>Добавить 3D Элемент</h3>
    <button onclick="window.__editor && window.__editor.addObject3D && window.__editor.addObject3D()">+ 3D Объект (OBJ)</button>
    <button onclick="window.__editor && window.__editor.addPanel && window.__editor.addPanel()">+ UI Панель</button>
    <button onclick="window.__editor && window.__editor.addVideoObject3D && window.__editor.addVideoObject3D()">+ Video</button>
    <button onclick="window.__editor && window.__editor.addHtmlObject3D && window.__editor.addHtmlObject3D()">+ Other HTML</button>
  </div>

  <div class="section hierarchy">
    <h3>Иерархия сцены</h3>
    <div id="tree"></div>
  </div>
</div>

<div id="viewport">
  <canvas id="canvas3d"></canvas>
  <div id="design-preview-overlay">
    <div class="preview-toolbar">
      <button onclick="DesignBuilder.hidePreview()">✕ Закрыть</button>
      <button onclick="DesignBuilder.exportDesignHTML()">⬇ Скачать HTML</button>
      <span id="preview-title" style="margin-left:auto; font-size:13px; color:#aaa;"></span>
    </div>
    <iframe id="design-preview-frame" title="Design Preview"></iframe>
  </div>
</div>

<div id="sim-overlay">
  <div class="sim-toolbar">
    <button onclick="QuestSim.stop()">✕ Закрыть</button>
    <button onclick="QuestSim.restart()">↺ Сначала</button>
    <span id="sim-toolbar-title" style="margin-left:auto; font-size:13px; color:#aaa;">Симуляция квеста</span>
  </div>
  <div id="sim-body">
    <div class="sim-bg-img" id="sim-bg"></div>
    <div id="sim-timer-wrap"><div id="sim-timer-bar"></div></div>
    <div id="sim-root">
      <header id="sim-title-bar" class="sim-panel">
        <div class="sim-panel-corner tl" id="sim-title-c-tl"></div>
        <div class="sim-panel-corner tr" id="sim-title-c-tr"></div>
        <div class="sim-panel-corner bl" id="sim-title-c-bl"></div>
        <div class="sim-panel-corner br" id="sim-title-c-br"></div>
        <div id="sim-title-text"></div>
        <div id="sim-quest-badge"></div>
      </header>

      <aside class="side-panel" id="sim-left">
        <div class="help-card sim-panel" id="sim-help-up">
          <div class="sim-panel-corner tl" data-corner="left"></div>
          <div class="sim-panel-corner tr" data-corner="left"></div>
          <div class="sim-panel-corner bl" data-corner="left"></div>
          <div class="sim-panel-corner br" data-corner="left"></div>
          <div class="side-mandala" id="sim-left-mandala"></div>
          <h4>💡 Подсказка</h4>
          <div class="help-body"></div>
        </div>
        <div class="help-card sim-panel" id="sim-help-down">
          <div class="sim-panel-corner tl" data-corner="left"></div>
          <div class="sim-panel-corner tr" data-corner="left"></div>
          <div class="sim-panel-corner bl" data-corner="left"></div>
          <div class="sim-panel-corner br" data-corner="left"></div>
          <h4>🔍 Совет</h4>
          <div class="help-body"></div>
        </div>
      </aside>

      <main id="sim-main" class="sim-panel">
        <div class="sim-panel-corner tl" id="sim-main-c-tl"></div>
        <div class="sim-panel-corner tr" id="sim-main-c-tr"></div>
        <div class="sim-panel-corner bl" id="sim-main-c-bl"></div>
        <div class="sim-panel-corner br" id="sim-main-c-br"></div>
        <div class="deco-line" id="sim-decor-1"></div>
        <div id="sim-narrative" class="narrative"></div>
        <div class="deco-line" id="sim-decor-2"></div>
        <div id="sim-main-content"></div>
        <div class="deco-line" id="sim-decor-3"></div>
      </main>

      <aside class="side-panel" id="sim-right">
        <div class="help-card sim-panel" id="sim-right-help">
          <div class="sim-panel-corner tl" data-corner="right"></div>
          <div class="sim-panel-corner tr" data-corner="right"></div>
          <div class="sim-panel-corner bl" data-corner="right"></div>
          <div class="sim-panel-corner br" data-corner="right"></div>
          <div class="side-mandala" id="sim-right-mandala"></div>
          <h4>📜 Заметка</h4>
          <div class="help-body"></div>
        </div>
      </aside>

      <footer id="sim-footer">
        <div id="sim-buttons-area"></div>
      </footer>
    </div>
    <div id="sim-reaction">
      <div id="sim-reaction-sign"></div>
      <div id="sim-reaction-text"></div>
      <button class="action-btn" id="sim-reaction-btn" style="margin-top:28px;">Дальше</button>
    </div>
    <div id="sim-ar-hint"></div>
  </div>
</div>

<div id="inspector">
  <h3>Свойства объекта</h3>
  <div id="inspector-content">
    <p style="font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5;">Выберите элемент в сцене для редактирования.</p>
  </div>
</div>

<script>
  /* ========== DesignBuilder ========== */
  const DesignBuilder = (() => {
    let headers = [];
    let rows = [];
    let currentRowIndex = 0;
    let lastHTML = "";

    function getVal(row, key, fallback) {
      if (fallback === undefined) fallback = "";
      const idx = headers.indexOf(key);
      if (idx === -1) return fallback;
      return (row[idx] || fallback);
    }

    function parsePrefab(row) {
      return {
        id: getVal(row, "id"),
        name: getVal(row, "name"),
        back_image: getVal(row, "BackGradient_Image") || getVal(row, "BackImage_Image") || "Back3",
        title_font: getVal(row, "TitleText_Font") || "nk_vitez SDF",
        title_color: getVal(row, "TitleText_Color") || "#FFD700",
        title_bg_color: getVal(row, "TitleText_bg_Color") || "#070707EE",
        title_bg_image: getVal(row, "TitleText_bg_Image") || "ButtonPanelBG",
        title_corner_image: getVal(row, "TitleText_If_Title_Empty_Corner_Image") || "mandala",
        main_bg_color: getVal(row, "MainText_bg_Color") || "#070707EE",
        main_bg_image: getVal(row, "MainText_bg_Image") || "MainTextPanelDark",
        main_font: getVal(row, "MainText_MainTxt_Font") || getVal(row, "MainTxt_Font") || "RobotoSlab-Regular SDF",
        main_color: getVal(row, "MainText_MainTxt_Color") || getVal(row, "MainTxt_Color") || "#FFFFFF",
        main_decor1: getVal(row, "MainText_Decor_2lines_line1_Image") || "Line2S",
        main_decor2: getVal(row, "MainText_Decor_2lines_line2_Image") || "Line2S",
        main_corner: getVal(row, "MainText_4corner_decor_Corner_Image") || "RusStyleElement",
        left_bg_color: getVal(row, "LeftPanel_bgLeftPanel_Color") || "#070707EE",
        left_bg_image: getVal(row, "LeftPanel_bgLeftPanel_Image") || "MainTextPanelDark",

    function setStatus(msg, type) {
      const el = document.getElementById("json-status");
      if (!el) return;
      el.textContent = msg;
      el.className = type || "";
    }

    function rebuild() {
      if (!rows.length) return;
      const prefab = parsePrefab(rows[currentRowIndex]);
      lastHTML = buildScreenHTML(prefab);
      const btn = document.getElementById("btn-show-design");
      if (btn) btn.style.display = "block";
      const title = document.getElementById("preview-title");
      if (title) title.textContent = prefab.id || prefab.name || "";
    }

    function loadJSON(data) {
      if (!Array.isArray(data) || data.length < 2) {
        setStatus("Неверный формат JSON (ожидается [headers, ...rows])", "err");
        return;
      }
      headers = data[0];
      rows = data.slice(1);
      currentRowIndex = 0;

      const sel = document.getElementById("json-row-selector");
      if (sel) {
        sel.innerHTML = "";
        rows.forEach(function(r, i) {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = (r[0] || r[1] || ("Строка " + (i + 1)));
          sel.appendChild(opt);
        });
        sel.style.display = rows.length > 1 ? "block" : "none";
        sel.value = "0";
      }

      rebuild();
      setStatus("Загружено строк: " + rows.length, "ok");
    }

    return {
      handleJsonFile: function(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function() {
          try {
            loadJSON(JSON.parse(reader.result));
          } catch (e) {
            setStatus("Ошибка JSON: " + e.message, "err");
            console.error(e);
          }
        };
        reader.onerror = function() { setStatus("Не удалось прочитать файл", "err"); };
        reader.readAsText(file);
        event.target.value = "";
      },

      handleRowChange: function(event) {
        currentRowIndex = parseInt(event.target.value, 10) || 0;
        rebuild();
        setStatus("Выбран: " + (rows[currentRowIndex] && rows[currentRowIndex][0]), "ok");
        const overlay = document.getElementById("design-preview-overlay");
        if (overlay && overlay.classList.contains("active")) this.showPreview();
      },

      showPreview: function() {
        if (!lastHTML) {
          setStatus("Сначала загрузите JSON дизайн", "err");
          return;
        }
        const overlay = document.getElementById("design-preview-overlay");
        const frame = document.getElementById("design-preview-frame");
        if (!overlay || !frame) return;

        try {
          frame.removeAttribute("src");
          frame.srcdoc = "";
        } catch (e) {}

        frame.onload = null;
        frame.src = "about:blank";
        frame.onload = function() {
          frame.onload = null;
          try {
            const doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
            if (doc) {
              doc.open();
              doc.write(lastHTML);
              doc.close();
            } else {
              frame.srcdoc = lastHTML;
            }
          } catch (err) {
            console.warn("[DesignBuilder] fallback srcdoc", err);
            frame.srcdoc = lastHTML;
          }
        };
        frame.src = "about:blank";
        overlay.classList.add("active");
        const btnHide = document.getElementById("btn-hide-design");
        if (btnHide) btnHide.style.display = "block";
      },

      hidePreview: function() {
        const overlay = document.getElementById("design-preview-overlay");
        const frame = document.getElementById("design-preview-frame");
        if (overlay) overlay.classList.remove("active");
        if (frame) {
          try {
            frame.onload = null;
            frame.removeAttribute("src");
            frame.srcdoc = "";
            frame.src = "about:blank";
          } catch (e) {}
        }
        const btnHide = document.getElementById("btn-hide-design");
        if (btnHide) btnHide.style.display = "none";
      },

      exportDesignHTML: function() {
        if (!lastHTML) return;
        const blob = new Blob([lastHTML], { type: "text/html;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = ((rows[currentRowIndex] && rows[currentRowIndex][0]) || "design") + ".html";
        a.click();
        URL.revokeObjectURL(a.href);
      },

      getLastHTML: function() { return lastHTML; },
      getCurrentPrefab: function() {
        if (!rows.length) return null;
        return parsePrefab(rows[currentRowIndex]);
      },
      getHeaders: function() { return headers.slice(); },
      getRows: function() { return rows; },
      loadJSON: loadJSON
    };
  })();


  /* ========== QuestSim ========== */
  const QuestSim = (() => {
    const RES = "./assets/resources";

    let QUEST_DATA = [];
    let ANSWER_DATA = {};
    let currentQuest = null;
    let selectedOptionIdx = -1;
    let carouselIdx = 0;
    let timerId = null;
    let timeLeft = 0;
    let inputValue = "";

    function $(id) { return document.getElementById(id); }

    function setStatus(msg, type) {
      const el = $("sim-status");
      if (!el) return;
      el.textContent = msg;
      el.className = type || "";
    }

    function stripTags(t) {
      if (!t) return "";
      return String(t)
              .replace(/<size=[^>]+>/gi, "")
              .replace(/<\/size>/gi, "")
              .replace(/<color=["']?#?[^"'>]+["']?>/gi, '<span style="color:#E90E1B">')
              .replace(/<\/color>/gi, "</span>")
              .replace(/<b>/gi, "<strong>").replace(/<\/b>/gi, "</strong>")
              .replace(/<i>/gi, "<em>").replace(/<\/i>/gi, "</em>")
              .replace(/<align=["']?left["']?>/gi, '<div style="text-align:left">')
              .replace(/<\/align>/gi, "</div>")
              .replace(/\t/g, "  ");
    }

    function normalizeAsset(name) {
      if (!name) return "";
      const n = String(name).trim();
      if (!n) return "";
      if (n.startsWith("http://") || n.startsWith("https://") || n.startsWith("./") || n.startsWith("/")) return n;
      return RES + "/" + n + ".png";
    }

    function setCornerBg(el, imgName) {
      if (!el) return;
      const url = normalizeAsset(imgName || "RusStyleElement");
      el.style.backgroundImage = url ? "url('" + url + "')" : "";
    }

    function applyDesign() {
      const p = DesignBuilder.getCurrentPrefab && DesignBuilder.getCurrentPrefab();
      if (!p) return;

      const bg = $("sim-bg");
      if (bg && p.back_image) bg.style.backgroundImage = "url('" + normalizeAsset(p.back_image) + "')";

      const titleBar = $("sim-title-bar");
      if (titleBar) {
        if (p.title_bg_color) titleBar.style.backgroundColor = p.title_bg_color;
        if (p.title_bg_image) {
          titleBar.style.backgroundImage = "url('" + normalizeAsset(p.title_bg_image) + "')";
          titleBar.style.backgroundSize = "cover";
        }
      }
      if (p.title_color) $("sim-title-text").style.color = p.title_color;

      const titleCorner = p.title_corner_image || p.main_corner || "RusStyleElement";
      ["sim-title-c-tl","sim-title-c-tr","sim-title-c-bl","sim-title-c-br"].forEach(function(id) {
        setCornerBg($(id), titleCorner);
      });

      const main = $("sim-main");
      if (main) {
        if (p.main_bg_color) main.style.backgroundColor = p.main_bg_color;
        if (p.main_bg_image) {
          main.style.backgroundImage = "url('" + normalizeAsset(p.main_bg_image) + "')";
          main.style.backgroundSize = "cover";
        }
      }
      ["sim-main-c-tl","sim-main-c-tr","sim-main-c-bl","sim-main-c-br"].forEach(function(id) {
        setCornerBg($(id), p.main_corner || "RusStyleElement");
      });

      const d1 = $("sim-decor-1"), d2 = $("sim-decor-2"), d3 = $("sim-decor-3");
      if (d1) d1.style.backgroundImage = "url('" + normalizeAsset(p.main_decor1 || "Line2S") + "')";
      if (d2) d2.style.backgroundImage = "url('" + normalizeAsset(p.main_decor2 || "Line2S") + "')";
      if (d3) d3.style.backgroundImage = "url('" + normalizeAsset(p.main_decor1 || "Line2S") + "')";

      [$("sim-help-up"), $("sim-help-down")].forEach(function(card) {

        if (p.left_bg_color) card.style.backgroundColor = p.left_bg_color;

          card.style.backgroundImage = "url('" + normalizeAsset(p.left_bg_image) + "')";
          card.style.backgroundSize = "cover";
        }
        if (p.left_help_color) card.style.color = p.left_help_color;
        card.querySelectorAll(".sim-panel-corner").forEach(function(c) {
          setCornerBg(c, p.left_corner || "RusStyleElement");
        });
      });
      const leftMandala = $("sim-left-mandala");
      if (leftMandala) leftMandala.style.backgroundImage = "url('" + normalizeAsset("mandala") + "')";

      const rightCard = $("sim-right-help");
      if (rightCard) {
        if (p.right_bg_color) rightCard.style.backgroundColor = p.right_bg_color;
        if (p.right_bg_image) {
          rightCard.style.backgroundImage = "url('" + normalizeAsset(p.right_bg_image) + "')";
          rightCard.style.backgroundSize = "cover";
        }
        rightCard.querySelectorAll(".sim-panel-corner").forEach(function(c) {
          setCornerBg(c, p.right_corner || "RusStyleElement");
        });
      }
      const rightMandala = $("sim-right-mandala");
      if (rightMandala) {
        rightMandala.style.backgroundImage = "url('" + normalizeAsset("mandala") + "')";
        rightMandala.style.opacity = "0.4";
      }

      const btnArea = $("sim-buttons-area");
      if (btnArea) {
        if (p.buttons_bg_color) btnArea.style.backgroundColor = p.buttons_bg_color;
        if (p.buttons_bg_image) {
          btnArea.style.backgroundImage = "url('" + normalizeAsset(p.buttons_bg_image) + "')";
          btnArea.style.backgroundSize = "cover";
        }
      }
    }

    function normalizeQuests(quests) {
      if (Array.isArray(quests)) {
        if (quests.length > 0 && Array.isArray(quests[0]) && typeof quests[0][0] === "string") {
          const headers = quests[0];
          return quests.slice(1).map(function(row) {
            const o = {};
            headers.forEach(function(h, i) { o[h] = row[i]; });
            return {
              id: o.id || o.QuestID,
              question: o.Question,
              task: parseInt(o.Task, 10) || 1,
              answers: (o.AnswerList || "").split(",").map(function(s) { return s.trim(); }).filter(Boolean),
              timer: parseFloat(o.Timer) || 0,
              rightIndices: (o.RightWayIndx || "").split(",").map(function(s) { return parseInt(s.trim(), 10); }).filter(function(n) { return !isNaN(n); }),
              rightQuest: o.RightWayQuest,
              rightReactionSign: o.RightReactionSign,
              rightReaction: o.RightReaction,
              wrongQuest: o.WrongWayQuest,
              wrongReactionSign: o.WrongReactionSign,
              wrongReaction: o.WrongReaction,
              nextQuest: o.NextWayQuest,
              goalIndex: parseInt(o.GoalIndex, 10)
            };
          });
        }
        return quests;
      }
      if (quests && Array.isArray(quests.quests)) return quests.quests;
      if (quests && Array.isArray(quests.list)) return quests.list;
      if (quests && typeof quests === "object") {
        return Object.values(quests).filter(function(v) { return v && typeof v === "object" && v.id; });
      }
      return [];
    }

    function normalizeAnswers(answers) {
      if (answers && typeof answers === "object" && !Array.isArray(answers)) return answers;
      if (Array.isArray(answers)) {
        if (answers.length > 0 && Array.isArray(answers[0]) && typeof answers[0][0] === "string") {
          const headers = answers[0];
          const map = {};
          answers.slice(1).forEach(function(row) {
            const o = {};
            headers.forEach(function(h, i) { o[h] = row[i]; });
            const id = o.id || o.AnswerID;
            if (id) {
              map[id] = {
                id: id,
                type: o.AnswerType || "",
                title: o.TitleText_Text || "",
                mainText: o.MainTxt_Text || "",
                helpUp: o.HelpUpText_Text || "",
                helpDown: o.HelpDownText_Text || "",
                question: o.Question || ""
              };
            }
          });
          return map;
        }
        const map = {};
        answers.forEach(function(a) { if (a && a.id) map[a.id] = a; });
        return map;
      }
      return {};
    }

    function readFileAsJson(file) {
      return new Promise(function(resolve, reject) {
        var reader = new FileReader();
        reader.onload = function() {
          try { resolve(JSON.parse(reader.result)); }
          catch (e) { reject(e); }
        };
        reader.onerror = function() { reject(new Error("Не удалось прочитать " + file.name)); };
        reader.readAsText(file);
      });
    }

    async function tryFetchJson(path) {
      if (window.location.protocol === "file:") return null;
      try {
        var r = await fetch(path);
        if (r.ok) return await r.json();
      } catch (e) {}
      return null;
    }

    async function handleBundleFiles(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      try {
        let qData = null, aData = null, designData = null;

        for (const file of files) {
          const name = file.name.toLowerCase();
          if (name.indexOf("quest") !== -1) qData = await readFileAsJson(file);
          else if (name.indexOf("answer") !== -1) aData = await readFileAsJson(file);
          else if (name.indexOf("arprefab") !== -1 || name.indexOf("design") !== -1) designData = await readFileAsJson(file);
        }

        if (!qData && files.length === 1) qData = await readFileAsJson(files[0]);

        if (qData) QUEST_DATA = normalizeQuests(qData);

        if (!aData) aData = await tryFetchJson("./answers.json") || await tryFetchJson("./assets/answers.json");
        if (aData) ANSWER_DATA = normalizeAnswers(aData);

        if (!designData) designData = await tryFetchJson("./arprefabsdesign.json") || await tryFetchJson("./assets/arprefabsdesign.json");
        if (designData) DesignBuilder.loadJSON(designData);

        if (!QUEST_DATA.length) throw new Error("Не удалось загрузить квесты. Выберите questtable.json!");

        if (!Object.keys(ANSWER_DATA).length) {
          setStatus("Внимание: answers.json не загружен — варианты будут пустыми. Выберите оба файла.", "err");
        }

        start();
      } catch (e) {
        setStatus("Ошибка: " + e.message, "err");
        console.error(e);
      }
      event.target.value = "";
    }

    /* Timer — значение из JSON = МИНУТЫ */
    function startTimer(minutes) {
      clearInterval(timerId);
      var bar = $("sim-timer-bar");
      var totalSeconds = Math.max(0, Math.round((parseFloat(minutes) || 0) * 60));
      if (!totalSeconds) {
        if (bar) bar.style.width = "100%";
        return;
      }
      timeLeft = totalSeconds;
      var total = totalSeconds;
      if (bar) bar.style.width = "100%";
      timerId = setInterval(function() {
        timeLeft--;
        if (bar) bar.style.width = (timeLeft / total * 100) + "%";
        if (timeLeft <= 0) {
          clearInterval(timerId);
          showReaction("⏳", "Время вышло! Попробуйте снова.", "Закрыть", function() { stop(); });
        }
      }, 1000);
    }
    function stopTimer() { clearInterval(timerId); }

    function showReaction(sign, text, btnText, callback) {
      $("sim-reaction-sign").textContent = sign || "✦";
      $("sim-reaction-text").innerHTML = stripTags(text);
      $("sim-reaction-btn").textContent = btnText || "Дальше";
      $("sim-reaction").classList.add("active");
      $("sim-reaction-btn").onclick = function() {
        $("sim-reaction").classList.remove("active");
        if (callback) callback();
      };
    }

    function loadQuest(qid) {
      var quest = QUEST_DATA.find(function(q) { return q.id === qid; });
      if (!quest) { setStatus("Квест не найден: " + qid, "err"); return; }
      currentQuest = quest;
      selectedOptionIdx = -1;
      carouselIdx = 0;
      inputValue = "";
      var masterAns = quest.answers && quest.answers[0] ? ANSWER_DATA[quest.answers[0]] : null;

      $("sim-title-text").innerHTML = stripTags(
              (masterAns && masterAns.title) || ((quest.question || "").substring(0, 70) + "...")
      );
      $("sim-quest-badge").textContent = quest.id;

      var helpUpBody = $("sim-help-up") && $("sim-help-up").querySelector(".help-body");
      var helpDownBody = $("sim-help-down") && $("sim-help-down").querySelector(".help-body");
      var rightBody = $("sim-right-help") && $("sim-right-help").querySelector(".help-body");

      if (helpUpBody) helpUpBody.innerHTML = stripTags((masterAns && masterAns.helpUp) || "Когда найдено испытание, здесь отображается задание.");
      if (helpDownBody) helpDownBody.innerHTML = stripTags((masterAns && masterAns.helpDown) || "Перед наведением на AR-цель осмотрись камерой вокруг.");
      if (rightBody) rightBody.innerHTML = stripTags((masterAns && masterAns.question) || "");

      $("sim-narrative").innerHTML = stripTags(quest.question || "");
      $("sim-ar-hint").textContent = "Наведи камеру на AR-метку • " + quest.id +
              (quest.goalIndex != null ? " • " + (quest.goalIndex + 1) + " / " + QUEST_DATA.length : "");

      renderTask();
      startTimer(quest.timer || 0);
      applyDesign();
    }

    function renderTask() {
      var task = currentQuest.task;
      var ansIds = currentQuest.answers || [];
      var master = ansIds[0] ? ANSWER_DATA[ansIds[0]] : null;
      var mainContent = $("sim-main-content");
      var btnArea = $("sim-buttons-area");
      mainContent.innerHTML = "";
      btnArea.innerHTML = "";

      if (master && master.mainText) {
        var div = document.createElement("div");
        div.className = "main-text";
        div.innerHTML = stripTags(master.mainText);
        mainContent.appendChild(div);
      }

      var p = DesignBuilder.getCurrentPrefab && DesignBuilder.getCurrentPrefab();
      var nextLabel = (p && p.btn_next_text) || "Дальше";
      var ph = (p && p.input_ph_text) || "ВВЕДИТЕ ОТВЕТ";

      if (task === 1) {
        var options = ansIds.slice(1);
        var masterType = (master && master.type) || "Slide";

        if (masterType === "Slide" && options.length > 0) {
          if (selectedOptionIdx < 0) selectedOptionIdx = 0;
          carouselIdx = Math.max(0, Math.min(carouselIdx, options.length - 1));

          var wrap = document.createElement("div");
          wrap.className = "carousel-wrap";
          var leftBtn = document.createElement("button");
          leftBtn.className = "carousel-btn"; leftBtn.innerHTML = "◀";
          var display = document.createElement("div");
          display.className = "carousel-display";
          var rightBtn = document.createElement("button");
          rightBtn.className = "carousel-btn"; rightBtn.innerHTML = "▶";

          function updateCarousel() {
            var oid = options[carouselIdx];
            var opt = oid ? ANSWER_DATA[oid] : null;
            var text = (opt && opt.mainText) ? opt.mainText : (oid ? ("[" + oid + "]") : "…");
            display.innerHTML = stripTags(text);
            display.classList.toggle("active-opt", carouselIdx === selectedOptionIdx);
            leftBtn.disabled = carouselIdx === 0;
            rightBtn.disabled = carouselIdx >= options.length - 1;
          }

          leftBtn.onclick = function() {
            if (carouselIdx > 0) { carouselIdx--; updateCarousel(); }
          };
          rightBtn.onclick = function() {
            if (carouselIdx < options.length - 1) { carouselIdx++; updateCarousel(); }
          };
          display.onclick = function() {
            selectedOptionIdx = carouselIdx;
            updateCarousel();
          };
          updateCarousel();

          wrap.appendChild(leftBtn);
          wrap.appendChild(display);
          wrap.appendChild(rightBtn);
          btnArea.appendChild(wrap);

          var ok = document.createElement("button");
          ok.className = "action-btn";
          ok.textContent = "ОК";
          ok.onclick = function() {
            var idx = selectedOptionIdx >= 0 ? selectedOptionIdx : carouselIdx;
            var oid = options[idx];
            if (!oid) {
              setStatus("Нет варианта ответа (проверьте answers.json)", "err");
              return;
            }
            checkAnswer(oid, idx + 1);
          };
          btnArea.appendChild(ok);

          if (!ANSWER_DATA[options[0]]) {
            setStatus("Варианты пустые: загрузите answers.json вместе с questtable.json", "err");
          }
        } else if (masterType === "InputField" && options.length > 0) {
          var iwrap = document.createElement("div");
          iwrap.className = "input-wrap";
          var inp = document.createElement("input");
          inp.className = "q-input"; inp.placeholder = ph; inp.type = "text";
          inp.oninput = function(e) { inputValue = e.target.value; };
          inp.onkeydown = function(e) { if (e.key === "Enter") checkInput(); };
          var ok2 = document.createElement("button");
          ok2.className = "action-btn"; ok2.textContent = "ОК"; ok2.onclick = checkInput;
          iwrap.appendChild(inp); iwrap.appendChild(ok2);
          btnArea.appendChild(iwrap);
        } else {
          var grid = document.createElement("div");
          grid.className = "btn-grid";
          options.forEach(function(oid, idx) {
            var opt = ANSWER_DATA[oid];
            var btn = document.createElement("button");
            btn.className = "q-btn";
            btn.innerHTML = stripTags((opt && opt.mainText) || oid);
            btn.onclick = function() { checkAnswer(oid, idx + 1); };
            grid.appendChild(btn);
          });
          btnArea.appendChild(grid);
        }
      } else if (task === 2) {
        var art = document.createElement("div");
        art.className = "art-screen";
        art.innerHTML = "<h2>✦ Артефакт</h2><p>" + stripTags((master && master.mainText) || "Продолжай путь...") + "</p>";
        mainContent.appendChild(art);
        var next = document.createElement("button");
        next.className = "action-btn"; next.textContent = nextLabel;
        next.onclick = function() { goTo(currentQuest.rightQuest || currentQuest.nextQuest); };
        btnArea.appendChild(next);
      } else if (task === 3) {
        var art3 = document.createElement("div");
        art3.className = "art-screen";
        art3.innerHTML = "<h2>⚠️ Тупик</h2><p>" + stripTags((master && master.mainText) || "Ах, пусто...") + "</p>";
        mainContent.appendChild(art3);
        var next3 = document.createElement("button");
        next3.className = "action-btn"; next3.textContent = "Вернуться";
        next3.onclick = function() { goTo(currentQuest.wrongQuest || currentQuest.nextQuest); };
        btnArea.appendChild(next3);
      }
    }

    function checkAnswer(answerId, optionIndex) {
      if (!answerId || optionIndex < 1) {
        setStatus("Выберите вариант ответа", "err");
        return;
      }
      var rightIndices = currentQuest.rightIndices || [];
      var isCorrect = rightIndices.length === 0 || rightIndices.indexOf(optionIndex) !== -1;
      if (isCorrect) {
        showReaction(
                currentQuest.rightReactionSign || "✦",
                currentQuest.rightReaction || "Верно!",
                "Дальше",
                function() { goTo(currentQuest.rightQuest); }
        );
      } else {
        showReaction(
                currentQuest.wrongReactionSign || "✖",
                currentQuest.wrongReaction || "Неправильно.",
                "Повторить",
                function() {}
        );
      }
    }

    function checkInput() {
      var options = (currentQuest.answers || []).slice(1);
      var val = inputValue.trim().toLowerCase();
      var isCorrect = false;
      options.forEach(function(oid) {
        var opt = ANSWER_DATA[oid];
        var optText = ((opt && opt.mainText) || "").trim().toLowerCase();
        if (optText && (optText === val || val.indexOf(optText) !== -1 || optText.indexOf(val) !== -1)) isCorrect = true;
      });
      if (isCorrect) {
        showReaction(
                currentQuest.rightReactionSign || "✦",
                currentQuest.rightReaction || "Верно!",
                "Дальше",
                function() { goTo(currentQuest.rightQuest); }
        );
      } else {
        showReaction(
                currentQuest.wrongReactionSign || "✖",
                currentQuest.wrongReaction || "Неправильно.",
                "Повторить",
                function() {}
        );
      }
    }

    function goTo(qid) {
      if (!qid) { setStatus("Нет следующего квеста", "err"); return; }
      stopTimer();
      loadQuest(qid);
    }

    function start() {
      if (DesignBuilder.hidePreview) DesignBuilder.hidePreview();
      $("sim-overlay").classList.add("active");
      var startId = (QUEST_DATA[0] && QUEST_DATA[0].id) || "Start";
      loadQuest(startId);
      setStatus("Симуляция: " + QUEST_DATA.length + " квестов" +
              (Object.keys(ANSWER_DATA).length ? "" : " (без answers.json)"), "ok");
      $("sim-toolbar-title").textContent = "Симуляция • " + QUEST_DATA.length + " квестов";
    }

    function stop() {
      stopTimer();
      $("sim-overlay").classList.remove("active");
      $("sim-reaction").classList.remove("active");
      setStatus("", "");
    }

    function restart() {
      stopTimer();
      $("sim-reaction").classList.remove("active");
      if (QUEST_DATA.length) loadQuest((QUEST_DATA[0] && QUEST_DATA[0].id) || "Start");
    }

    return {
      start: start,
      stop: stop,
      restart: restart,
      handleBundleFiles: handleBundleFiles
    };
  })();

  window.addEventListener("DOMContentLoaded", function() {
    if (!window.__editor) window.__editor = {};
    window.__editor.handleJsonDesignSelect = function(e) { DesignBuilder.handleJsonFile(e); };
    window.__editor.handleJsonRowChange = function(e) { DesignBuilder.handleRowChange(e); };
  });
</script>

</body>
