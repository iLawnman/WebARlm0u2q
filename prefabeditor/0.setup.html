<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Красивый интерфейс с закладками</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b1a33;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      max-width: 1000px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(2px);
      border-radius: 28px;
      padding: 30px 30px 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    /* Меню табов */
    .tabs-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 6px;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #a8b5d9;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 10px 22px;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.01em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      font-family: inherit;
      line-height: 1.4;
      white-space: nowrap;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #d6e0ff;
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-1px);
    }

    .tab-btn.active {
      background: #2f6ef0;
      color: #ffffff;
      border-color: #2f6ef0;
      box-shadow: 0 8px 18px rgba(47, 110, 240, 0.35);
      font-weight: 600;
      transform: scale(1.02);
    }

    .tab-btn.active:hover {
      background: #3f7eff;
      border-color: #3f7eff;
    }

    .tab-content { display: block; margin-top: 8px; }

    .tab-pane {
      display: none;
      animation: fadeUp 0.25s ease forwards;
      padding: 20px 10px;
    }

    .tab-pane.active { display: block; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .pane-title {
      font-size: 1.6rem;
      font-weight: 500;
      color: #eef4ff;
      letter-spacing: -0.02em;
      border-left: 4px solid #2f6ef0;
      padding-left: 16px;
      background: linear-gradient(90deg, rgba(47, 110, 240, 0.08), transparent);
      border-radius: 0 12px 12px 0;
      margin-bottom: 0;
    }

    @media (max-width: 600px) {
      .card { padding: 20px 16px; }
      .tab-btn { padding: 8px 16px; font-size: 0.85rem; white-space: nowrap; }
    }
  </style>
</head>
<body>

<div class="card">
  <!-- Навигация вкладок -->
  <nav class="tabs-nav" role="tablist">
    <button class="tab-btn active" data-tab="tab0" role="tab">Настройки</button>
    <button class="tab-btn" data-tab="tab1" role="tab">Тексты</button>
    <button class="tab-btn" data-tab="tab2" role="tab">Дизайн</button>
    <button class="tab-btn" data-tab="tab3" role="tab">HTML</button>
    <button class="tab-btn" data-tab="tab4" role="tab">Сцена</button>
    <button class="tab-btn" data-tab="tab5" role="tab">3D</button>
    <button class="tab-btn" data-tab="tab6" role="tab">Сборка</button>
  </nav>

  <!-- Контент -->
  <div class="tab-content">

    <!-- ===== PANE 0 ===== -->
    <div id="tab0" class="tab-pane active" role="tabpanel">
      <h2 class="pane-title">Настройки</h2>
    </div>

    <!-- ===== PANE 1 ===== -->
    <div id="tab1" class="tab-pane" role="tabpanel">
      <h2 class="pane-title">Тексты</h2>
    </div>

    <!-- ===== PANE 2 ===== -->
    <div id="tab2" class="tab-pane" role="tabpanel">
      <h2 class="pane-title">Дизайн</h2>
    </div>

    <!-- ===== PANE 3 ===== -->
    <div id="tab3" class="tab-pane" role="tabpanel">
      <h2 class="pane-title">HTML</h2>
    </div>

    <!-- ===== PANE 4 ===== -->
    <div id="tab4" class="tab-pane" role="tabpanel">
      <h2 class="pane-title">Сцена</h2>
    </div>

    <!-- ===== PANE 5 ===== -->
    <div id="tab5" class="tab-pane" role="tabpanel">
      <h2 class="pane-title">3D</h2>
    </div>

    <!-- ===== PANE 6 ===== -->
    <div id="tab6" class="tab-pane" role="tabpanel">
      <h2 class="pane-title">Сборка</h2>
    </div>

  </div><!-- /tab-content -->
</div><!-- /card -->

<script>
  (function() {
    const tabs = document.querySelectorAll('.tab-btn');
    const panes = document.querySelectorAll('.tab-pane');

    function activateTab(tabId) {
      tabs.forEach(btn => btn.classList.remove('active'));
      panes.forEach(pane => pane.classList.remove('active'));

      const targetBtn = Array.from(tabs).find(btn => btn.dataset.tab === tabId);
      if (targetBtn) targetBtn.classList.add('active');

      const targetPane = document.getElementById(tabId);
      if (targetPane) targetPane.classList.add('active');
    }

    tabs.forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        const tabId = this.dataset.tab;
        if (tabId) activateTab(tabId);
      });
    });

    // синхронизация при загрузке
    const activeTab = document.querySelector('.tab-btn.active');
    if (activeTab) {
      const id = activeTab.dataset.tab;
      if (id) {
        panes.forEach(p => p.classList.remove('active'));
        const pane = document.getElementById(id);
        if (pane) pane.classList.add('active');
      }
    } else {
      const firstTab = document.querySelector('.tab-btn');
      if (firstTab) {
        firstTab.classList.add('active');
        const firstId = firstTab.dataset.tab;
        const firstPane = document.getElementById(firstId);
        if (firstPane) firstPane.classList.add('active');
      }
    }
  })();
</script>

</body>
</html>
