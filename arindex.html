<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WebXR AR — Куб на полу + DOM Overlay панель</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070d;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #webgl-container {
    position: absolute;
    inset: 0;
  }

  #hint {
    position: absolute;
    z-index: 3;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: #e2e8f0;
    font-size: 13px;
    background: rgba(11, 17, 32, 0.65);
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(148, 163, 184, 0.25);
    pointer-events: none;
    text-align: center;
    max-width: 90%;
  }

  #unsupported {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #94a3b8;
    padding: 32px;
  }

  #unsupported h2 { color: #f8fafc; margin-bottom: 12px; }

  /* ---------- WebXR DOM Overlay root ----------
     Everything the browser composites on top of the AR camera feed during
     the immersive session lives here. #anchor-panel is NOT centered by
     CSS — its position/scale are recalculated every frame in JS by
     projecting a 3D world point (above the cube) into screen space, so it
     visually tracks the object as the camera moves, while still being a
     real, clickable/scrollable DOM element (unlike a baked 3D texture). */
  #ar-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: none;
  }

  #place-hint {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    color: #f8fafc;
    background: rgba(11, 17, 32, 0.65);
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px;
    border: 1px solid rgba(148, 163, 184, 0.25);
  }

  #anchor-panel {
    position: absolute;
    top: 0;
    left: 0;
    width: 460px;
    transform-origin: 50% 100%; /* bottom-center = the 3D anchor point */
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.3);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    background: #0b1120;
    transition: opacity 0.15s linear;
    will-change: transform, opacity;
  }

  #anchor-panel.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  /* Scrollable window onto about.html — sized big enough that the bottom
     CTA button is reachable with a short scroll instead of being cut off. */
  #anchor-panel .panel-frame {
    width: 100%;
    height: 560px;
    background: #0b1120;
  }

  #anchor-panel iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  /* Debug row: real page DOM (not inside the iframe), sits right under the
     about.html panel, part of the same anchored element. Used to verify
     that taps on the WebXR DOM Overlay are actually reaching the page. */
  #anchor-panel .panel-debug {
    flex-shrink: 0;
    padding: 10px 12px;
    background: #0f172a;
    border-top: 1px solid rgba(148, 163, 184, 0.2);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #debug-btn {
    pointer-events: auto;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(129, 140, 248, 0.4);
    background: rgba(99, 102, 241, 0.18);
    color: #e0e7ff;
    font-size: 13px;
    font-weight: 600;
  }

  #debug-btn:active {
    background: rgba(99, 102, 241, 0.35);
  }

  #debug-log {
    max-height: 96px;
    overflow-y: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    line-height: 1.5;
    color: #94a3b8;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 8px;
    padding: 6px 8px;
  }

  #debug-log .log-empty { color: #475569; }
  #debug-log .log-line { color: #67e8f9; }

  /* ---------- convertor.js: assets-check trigger + result panels ---------- */
  .convertor-trigger {
    position: absolute;
    top: 16px;
    right: 16px;
    pointer-events: auto;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid rgba(6, 182, 212, 0.4);
    background: rgba(6, 182, 212, 0.15);
    color: #cffafe;
    font-size: 13px;
    font-weight: 600;
  }

  .convertor-trigger:disabled { opacity: 0.6; }
  .convertor-trigger:active { background: rgba(6, 182, 212, 0.3); }

  .convertor-panel {
    position: absolute;
    top: calc(64px + var(--stack-offset, 0px));
    right: calc(16px + var(--stack-offset, 0px));
    width: min(88vw, 320px);
    pointer-events: auto;
    background: #0b1120;
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    font-size: 13px;
    color: #e2e8f0;
  }

  .convertor-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: rgba(99, 102, 241, 0.18);
    font-weight: 600;
  }

  .convertor-panel-close {
    background: none;
    border: 0;
    color: #94a3b8;
    font-size: 18px;
    line-height: 1;
    padding: 0 4px;
  }

  .convertor-panel-body {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .convertor-row {
    display: flex;
    gap: 8px;
    align-items: center;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }

  .convertor-row.ok { color: #86efac; }
  .convertor-row.missing { color: #fca5a5; }
</style>
</head>
<body>

<div id="webgl-container"></div>
<div id="hint">Наведите камеру на пол — появится маркер. Коснитесь экрана, чтобы поставить куб и панель.</div>

<div id="unsupported">
  <div>
    <h2>WebXR AR недоступен</h2>
    <p>Откройте страницу на Android-устройстве в Chrome (ARCore) по HTTPS,<br>
       или на устройстве с поддержкой WebXR immersive-ar.</p>
  </div>
</div>

<!-- WebXR DOM Overlay root: passed to ARButton as domOverlay.root -->
<div id="ar-overlay">
  <div id="place-hint">Коснитесь пола, чтобы поставить куб и панель</div>
  <div id="anchor-panel">
    <div class="panel-frame">
      <iframe src="about.html" scrolling="yes"></iframe>
    </div>
    <div class="panel-debug">
      <button id="debug-btn" type="button">🧪 Тест клика — вывести в лог</button>
      <div id="debug-log"><span class="log-empty">лог пуст…</span></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { attachConvertorButton } from './convertor.js';

const webglContainer = document.getElementById('webgl-container');
const hint = document.getElementById('hint');
const unsupportedEl = document.getElementById('unsupported');
const arOverlay = document.getElementById('ar-overlay');
const placeHint = document.getElementById('place-hint');

// convertor.js: "📦 Проверить assets" -> проверяет ./assets/arTargetDesign.json,
// questTable.json, answers.json и, если все найдены, открывает отдельную
// WebXR DOM Overlay панель с текстом (по умолчанию — отчёт по файлам).
attachConvertorButton(arOverlay);
const anchorPanel = document.getElementById('anchor-panel');
const debugBtn = document.getElementById('debug-btn');
const debugLog = document.getElementById('debug-log');

let debugClickCount = 0;
function logToOverlay(message) {
  debugClickCount += 1;
  const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
  const line = document.createElement('div');
  line.className = 'log-line';
  line.textContent = `[${time}] #${debugClickCount} ${message}`;
  if (debugLog.querySelector('.log-empty')) debugLog.innerHTML = '';
  debugLog.prepend(line);
  console.log('[AR DOM Overlay]', message);
}

debugBtn.addEventListener('click', () => {
  logToOverlay('Клик по кнопке в WebXR DOM Overlay сработал ✅');
});

// ---------- Freeze panel tracking while the user is actively touching it ----------
// The panel's screen position is recalculated every XR frame to follow the
// 3D anchor. That's fine while idle, but if we keep rewriting
// anchorPanel.style.transform WHILE a finger is down (scrolling the iframe,
// or tapping the debug button), the target keeps moving under the touch and
// both native scroll and click/tap synthesis break. So: freeze position
// updates for the duration of any touch/pointer interaction on the panel.
let interacting = false;

anchorPanel.addEventListener('pointerdown', () => { interacting = true; });
anchorPanel.addEventListener('touchstart', () => { interacting = true; }, { passive: true });
window.addEventListener('pointerup', () => { interacting = false; });
window.addEventListener('pointercancel', () => { interacting = false; });
window.addEventListener('touchend', () => { interacting = false; }, { passive: true });
window.addEventListener('touchcancel', () => { interacting = false; }, { passive: true });

// Touches inside the <iframe> happen in a separate document and never bubble
// out to the parent page, so the listeners above alone won't see them.
// about.html is same-origin, so we can reach into its document directly.
const panelIframe = anchorPanel.querySelector('iframe');
panelIframe.addEventListener('load', () => {
  try {
    const doc = panelIframe.contentDocument;
    doc.addEventListener('touchstart', () => { interacting = true; }, { passive: true });
    doc.addEventListener('touchend', () => { interacting = false; }, { passive: true });
    doc.addEventListener('touchcancel', () => { interacting = false; }, { passive: true });
    doc.addEventListener('pointerdown', () => { interacting = true; });
    doc.addEventListener('pointerup', () => { interacting = false; });
  } catch (err) {
    console.warn('Could not attach listeners inside iframe (cross-origin?)', err);
  }
});

// ---------- Basic WebXR support check ----------
if (!('xr' in navigator)) {
  unsupportedEl.style.display = 'flex';
} else {
  navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
    if (!supported) unsupportedEl.style.display = 'flex';
  }).catch(() => { unsupportedEl.style.display = 'flex'; });
}

// ---------- Scene / Camera ----------
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  20
);

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
webglContainer.appendChild(renderer.domElement);

// ---------- AR entry button: hit-test + DOM Overlay ----------
const arButton = ARButton.createButton(renderer, {
  requiredFeatures: ['hit-test'],
  optionalFeatures: ['local-floor', 'dom-overlay'],
  domOverlay: { root: arOverlay }
});
document.body.appendChild(arButton);

// ---------- Lights ----------
scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 1.2));

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(2, 4, 2);
scene.add(dirLight);

// ---------- Reticle (floor marker) ----------
const reticleGeometry = new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2);
const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
const reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

// ---------- Cube (placed on the real floor) ----------
const cubeSize = 0.18;
const cube = new THREE.Mesh(
  new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize),
  new THREE.MeshStandardMaterial({
    color: 0x6366f1,
    metalness: 0.3,
    roughness: 0.35,
    emissive: 0x1e1b4b,
    emissiveIntensity: 0.4,
  })
);
cube.visible = false;
scene.add(cube);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(cube.geometry),
  new THREE.LineBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.7 })
);
edges.visible = false;
scene.add(edges);

// World-space anchor the panel is locked to: fixed offset above the cube.
const panelAnchor = new THREE.Vector3();
const PANEL_HEIGHT_OFFSET = 0.28; // meters above the cube center

// ---------- Hit-test state ----------
let hitTestSource = null;
let hitTestSourceRequested = false;
let placed = false;

renderer.xr.addEventListener('sessionstart', () => {
  placed = false;
  cube.visible = false;
  edges.visible = false;
  anchorPanel.classList.remove('visible');
  reticle.visible = false;
  hitTestSourceRequested = false;
  hitTestSource = null;
  placeHint.style.display = 'block';
});

renderer.xr.addEventListener('sessionend', () => {
  hitTestSource = null;
  hitTestSourceRequested = false;
});

// Tap on screen (XR "select" event) -> place cube on the reticle, anchor panel above it
function onSelect() {
  if (!reticle.visible) return;

  cube.position.setFromMatrixPosition(reticle.matrix);
  cube.position.y += cubeSize / 2;
  edges.position.copy(cube.position);
  cube.visible = true;
  edges.visible = true;

  panelAnchor.set(cube.position.x, cube.position.y + PANEL_HEIGHT_OFFSET, cube.position.z);

  placed = true;
  placeHint.style.display = 'none';
}

const controller = renderer.xr.getController(0);
controller.addEventListener('select', onSelect);
scene.add(controller);

// ---------- Resize ----------
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------- Project the 3D anchor to screen space and position the DOM overlay panel ----------
const projected = new THREE.Vector3();
const camWorldPos = new THREE.Vector3();

function updateAnchoredPanel() {
  if (!placed) return;
  if (interacting) return; // don't fight the user's finger mid-scroll/tap

  camera.getWorldPosition(camWorldPos);
  const distance = camWorldPos.distanceTo(panelAnchor);

  projected.copy(panelAnchor).project(camera);

  // Behind the camera or far outside view: hide instead of drawing garbage.
  if (projected.z > 1 || distance > 8) {
    anchorPanel.classList.remove('visible');
    return;
  }

  const w = window.innerWidth;
  const h = window.innerHeight;
  const screenX = (projected.x * 0.5 + 0.5) * w;
  const screenY = (1 - (projected.y * 0.5 + 0.5)) * h;

  // Off-screen margin check so we don't render a clickable panel the user can't see.
  const margin = 40;
  if (screenX < -margin || screenX > w + margin || screenY < -margin || screenY > h + margin) {
    anchorPanel.classList.remove('visible');
    return;
  }

  // Pseudo-3D depth: scale down as the anchor gets farther away.
  const scale = THREE.MathUtils.clamp(0.9 / distance, 0.35, 1.15);

  anchorPanel.style.transform =
    `translate(${screenX}px, ${screenY}px) translate(-50%, -100%) scale(${scale})`;
  anchorPanel.classList.add('visible');
}

// ---------- Animation / render loop ----------
const clock = new THREE.Clock();

renderer.setAnimationLoop((timestamp, frame) => {
  if (frame) {
    const session = renderer.xr.getSession();
    const referenceSpace = renderer.xr.getReferenceSpace();

    hint.style.display = 'none';
    arOverlay.style.display = 'block';

    if (!hitTestSourceRequested) {
      session.requestReferenceSpace('viewer').then((viewerSpace) => {
        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
          hitTestSource = source;
        });
      });
      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
      });
      hitTestSourceRequested = true;
    }

    if (hitTestSource) {
      const hitTestResults = frame.getHitTestResults(hitTestSource);
      if (hitTestResults.length > 0 && !placed) {
        const hit = hitTestResults[0];
        const pose = hit.getPose(referenceSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else if (!placed) {
        reticle.visible = false;
      } else {
        reticle.visible = false;
      }
    }
  } else {
    arOverlay.style.display = 'none';
  }

  if (placed) {
    const t = clock.getElapsedTime();
    cube.rotation.y = t * 0.6;
    edges.rotation.copy(cube.rotation);
    updateAnchoredPanel();
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
