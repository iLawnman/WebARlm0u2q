<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>threeUI WebXR AR + three-mesh-ui</title>
  <link rel="stylesheet" href="arindex.css">
  
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "three-mesh-ui": "https://unpkg.com/three-mesh-ui@6.5.2/build/index.module.js"
    }
  }
  </script>
</head>
<body>

  <div id="webgl-container"></div>
  
  <div id="hint">Наведите камеру на пол. Коснитесь экрана, чтобы поставить куб и UI-панели.</div>

  <div id="unsupported">
    <div>
      <h2>WebXR AR недоступен</h2>
      <p>Откройте страницу на Android-устройстве в Chrome (ARCore) по HTTPS.</p>
    </div>
  </div>

  <div id="ar-button-container"></div>

  <script type="module" src="arindex.js"></script>
</body>
</html>
