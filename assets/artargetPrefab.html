<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>AR Target Prefab</title>
  <style>

    .ar-css3d-panel {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e8f0ff;
      background: rgba(8, 12, 24, 0.92);
      border: 2px solid rgba(0, 255, 170, 0.55);
      border-radius: 14px;
      padding: 12px 14px;
      pointer-events: auto;
      touch-action: manipulation;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .ar-left-help-block,
    .ar-right-block {
      width: 170px;
      min-height: 150px;
      max-height: 220px;
    }
    .ar-main-block {
      width: 240px;
      min-height: 180px;
      max-height: 280px;
      overflow-y: auto;
    }
    .ar-buttons-block {
      width: 220px;
      min-height: 70px;
      max-height: 160px;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    .ar-panel-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #00ffaa;
      line-height: 1.25;
      word-break: break-word;
    }
    .ar-panel-question,
    .ar-panel-maintext,
    .ar-panel-help {
      font-size: 12.5px;
      line-height: 1.4;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .ar-panel-help { color: #a8b8d0; flex: 1; }
    .ar-panel-image {
      display: block;
      width: 100%;
      height: auto;
      max-height: 170px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(0,0,0,0.3);
    }
    .ar-panel-image:not([src]),
    .ar-panel-image[src=""] { display: none; }
    .ar-quest-body {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .ar-quest-options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }
    .ar-quest-btn,
    .ar-quest-submit-btn,
    .ar-slide-nav {
      appearance: none;
      border: 1px solid rgba(0, 255, 170, 0.65);
      background: rgba(0, 45, 35, 0.9);
      color: #e8fff6;
      border-radius: 9px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      line-height: 1.2;
      pointer-events: auto;
      touch-action: manipulation;
      min-width: 48px;
      min-height: 40px;
    }
    .ar-quest-btn:hover,
    .ar-quest-submit-btn:hover,
    .ar-slide-nav:hover {
      background: rgba(0, 70, 50, 0.98);
      border-color: #00ffaa;
    }
    .ar-quest-ok-btn {
      background: linear-gradient(180deg, #00c878 0%, #00995a 100%);
      border-color: #00ffaa;
      color: #fff;
      font-weight: 700;
      min-width: 100px;
    }
    .ar-quest-input-block {
      display: flex;
      gap: 6px;
      width: 100%;
      align-items: center;
    }
    .ar-quest-input {
      flex: 1;
      min-width: 0;
      padding: 7px 10px;
      border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.28);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 13px;
    }
    .ar-quest-slider {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .ar-slide-content {
      flex: 1;
      text-align: center;
      font-size: 12px;
      line-height: 1.35;
      min-height: 32px;
      word-break: break-word;
    }
    .ar-slide-nav {
      flex-shrink: 0;
      width: 36px;
      padding: 6px 0;
    }
    .ar-panel-empty .ar-panel-help,
    .ar-panel-empty .ar-panel-title,
    .ar-panel-empty .ar-panel-question {
      opacity: 0.35;
    }
  
  </style>
</head>
<body>
<template id="ar-target">
  <!-- LeftHelpBlock -->
  <div class="ar-css3d-panel ar-left-help-block"
       data-name="LeftHelpBlock"
       data-position="-0.12000, 0.03000, 0.02500"
       data-rotation="-90.0, 18.0, 0.0"
       data-scale="1.00000">
    <div class="ar-panel-help" data-field="help"></div>
  </div>

  <!-- MainBlock -->
  <div class="ar-css3d-panel ar-main-block"
       data-name="MainBlock"
       data-position="0.00000, 0.05000, 0.00000"
       data-rotation="-90.0, 0.0, 0.0"
       data-scale="1.00000">
    <div class="ar-panel-title" data-field="title"></div>
    <div class="ar-panel-question" data-field="question"></div>
    <div class="ar-panel-maintext" data-field="mainText"></div>
  </div>

  <!-- RightBlock -->
  <div class="ar-css3d-panel ar-right-block"
       data-name="RightBlock"
       data-position="0.12000, 0.03000, 0.02500"
       data-rotation="-90.0, -18.0, 0.0"
       data-scale="1.00000">
    <img class="ar-panel-image" data-field="imageSrc" alt="">
    <div class="ar-panel-help" data-field="imageCaption"></div>
  </div>

  <!-- ButtonsBlock -->
  <div class="ar-css3d-panel ar-buttons-block"
       data-name="ButtonsBlock"
       data-position="0.00000, 0.09000, 0.05500"
       data-rotation="-90.0, 0.0, 0.0"
       data-scale="1.00000">
    <div class="ar-quest-body" data-field="buttons"></div>
  </div>

</template>
</body>
</html>
