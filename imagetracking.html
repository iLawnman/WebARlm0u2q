<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>10 WebXR Image Tracking</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
        #startButton {
            position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
            z-index: 10; padding: 14px 22px; font: 16px sans-serif;
            border: none; border-radius: 8px; cursor: pointer;
            background: #4CAF50; color: white;
            font-weight: bold;
        }
        #status {
            position: fixed; left: 0; right: 260px; bottom: 0;
            padding: 10px 14px; font: 13px/1.4 monospace; color: #fff;
            background: rgba(0,0,0,0.55); z-index: 10; pointer-events: none;
        }
        #logPanel {
            position: fixed; top: 0; right: 0; bottom: 0; width: 260px;
            background: rgba(0,0,0,0.75); color: #0f0; z-index: 20;
            font: 11px/1.35 monospace; overflow-y: auto;
            padding: 8px; box-sizing: border-box;
            border-left: 1px solid rgba(255,255,255,0.2);
        }
        #logPanel .entry { white-space: pre-wrap; word-break: break-word; margin-bottom: 4px; }
        #logPanel .entry.warn { color: #ff0; }
        #logPanel .entry.error { color: #f55; }
        #logPanel .t { color: #888; }
    </style>
</head>
<body>
<button id="startButton">Start AR</button>
<div id="status"></div>
<div id="logPanel"></div>

<script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
</script>

<script type="module">
    import * as THREE from "three";

    const statusEl = document.getElementById("status");
    const logPanel = document.getElementById("logPanel");
    const startButton = document.getElementById("startButton");

    // Используем известное рабочее изображение для теста
    const TRACKED_IMAGE_URL = "./assets/recoimages/T1.jpg";
    const TRACKED_IMAGE_WIDTH_METERS = 0.1; // 20 см

    let renderer, scene, camera;
    let placedNode = null;
    let frameCounter = 0;
    let session = null;
    let referenceSpace = null;
    let imageBitmap = null;

    function logLine(msg, level) {
        const time = new Date().toISOString().substring(11, 23);
        const entry = document.createElement("div");
        entry.className = "entry" + (level ? " " + level : "");
        entry.textContent = `[${time}] ${msg}`;
        logPanel.appendChild(entry);
        logPanel.scrollTop = logPanel.scrollHeight;

        const consoleFn = level === "error" ? console.error : level === "warn" ? console.warn : console.log;
        consoleFn("[webxr-image-tracking]", msg);
    }

    function setStatus(msg) {
        statusEl.textContent = msg;
        logLine(msg);
    }

    async function loadTrackedImage(url) {
        logLine(`Loading image: ${url}`);
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        const blob = await response.blob();
        logLine(`Image loaded: ${blob.size} bytes`);
        const bitmap = await createImageBitmap(blob);
        logLine(`Image decoded: ${bitmap.width}x${bitmap.height}px`);
        return bitmap;
    }

    function initThree() {
        logLine("Initializing THREE");
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera();

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
        scene.add(light);

        const gridHelper = new THREE.GridHelper(1, 10);
        gridHelper.position.y = -0.05;
        scene.add(gridHelper);

        window.addEventListener("resize", () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        logLine("THREE initialized");
    }

    function buildContentNode() {
        const size = TRACKED_IMAGE_WIDTH_METERS * 0.5;
        // Создаем яркий объект
        const geometry = new THREE.BoxGeometry(size, size, size);
        const material = new THREE.MeshStandardMaterial({
            color: 0xff4400,
            emissive: 0xff2200,
            emissiveIntensity: 0.5,
            metalness: 0.3,
            roughness: 0.4
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.visible = false;

        // Добавляем рамку
        const edges = new THREE.EdgesGeometry(geometry);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xffffff }));
        mesh.add(line);

        scene.add(mesh);
        logLine(`Content node created`);
        return mesh;
    }

    async function startAR() {
        logLine("=== START AR ===");

        if (!navigator.xr) {
            throw new Error("WebXR not available");
        }

        // Проверяем поддержку
        let supported = false;
        try {
            supported = await navigator.xr.isSessionSupported("immersive-ar");
        } catch (err) {
            throw new Error(`isSessionSupported failed: ${err.message}`);
        }

        if (!supported) {
            throw new Error("Immersive AR not supported");
        }
        logLine("Immersive AR supported");

        // Загружаем изображение для трекинга
        try {
            imageBitmap = await loadTrackedImage(TRACKED_IMAGE_URL);
        } catch (err) {
            throw new Error(`Image load failed: ${err.message}`);
        }

        initThree();
        placedNode = buildContentNode();

        // ВАЖНО: Правильный способ передачи изображения для трекинга
        logLine("Creating session with image-tracking...");

        const sessionInit = {
            requiredFeatures: ["local-floor", "image-tracking"],
            trackedImages: [{
                image: imageBitmap,
                widthInMeters: TRACKED_IMAGE_WIDTH_METERS,
            }]
        };

        logLine(`Session options: ${JSON.stringify({
            features: sessionInit.requiredFeatures,
            imageWidth: TRACKED_IMAGE_WIDTH_METERS
        })}`);

        try {
            session = await navigator.xr.requestSession("immersive-ar", sessionInit);
            logLine("✅ Session created successfully");
        } catch (err) {
            logLine(`Session creation failed: ${err.message}`, "error");
            throw new Error(`Failed to create session: ${err.message}`);
        }

        startButton.style.display = "none";

        // Настраиваем сессию
        await renderer.xr.setSession(session);
        logLine("Session attached to renderer");

        referenceSpace = await session.requestReferenceSpace("local-floor");
        if (!referenceSpace) {
            throw new Error("Failed to get reference space");
        }
        logLine("Reference space acquired");

        // Проверяем API
        const hasTracking = 'getImageTrackingResults' in XRFrame.prototype;
        logLine(`Image tracking API: ${hasTracking ? '✅' : '❌'}`);

        if (!hasTracking) {
            throw new Error("Image tracking API not available");
        }

        // Пробуем получить tracked images через session
        try {
            // В некоторых реализациях изображения доступны через session
            if (session.trackedImages) {
                logLine(`Session has ${session.trackedImages.length} tracked images`);
            } else {
                logLine("Session.trackedImages not available (normal for some browsers)");
            }
        } catch (e) {
            logLine(`Cannot access trackedImages: ${e.message}`);
        }

        logLine("🚀 Starting tracking loop");

        // Основной цикл
        renderer.setAnimationLoop((timestamp, frame) => {
            frameCounter++;

            if (!frame) {
                if (frameCounter % 30 === 0) logLine("No frame", "warn");
                return;
            }

            let imageDetected = false;

            try {
                // Получаем результаты трекинга
                const results = frame.getImageTrackingResults();

                // Логируем каждые 60 кадров
                if (frameCounter % 60 === 0) {
                    logLine(`Frame ${frameCounter}: ${results.length} result(s)`);
                }

                // Обрабатываем результаты
                for (const result of results) {
                    // Проверяем состояние
                    const state = result.trackingState;

                    if (frameCounter % 60 === 0) {
                        logLine(`  Result: idx=${result.trackedImageIndex}, state=${state}`);
                    }

                    // Если изображение отслеживается
                    if (state === "tracked" || state === "emulated") {
                        try {
                            const pose = frame.getPose(result.imageSpace, referenceSpace);
                            if (pose) {
                                imageDetected = true;
                                placedNode.visible = true;

                                // Применяем матрицу
                                const matrix = pose.transform.matrix;
                                placedNode.matrix.fromArray(matrix);
                                placedNode.matrix.decompose(
                                    placedNode.position,
                                    placedNode.quaternion,
                                    placedNode.scale
                                );

                                if (frameCounter % 30 === 0) {
                                    setStatus(`✅ TRACKED! State: ${state}`);
                                    logLine(`  Position: ${placedNode.position.x.toFixed(3)}, ${placedNode.position.y.toFixed(3)}, ${placedNode.position.z.toFixed(3)}`);
                                }
                                break;
                            } else {
                                if (frameCounter % 60 === 0) {
                                    logLine(`  Pose is null for tracked image`, "warn");
                                }
                            }
                        } catch (err) {
                            if (frameCounter % 60 === 0) {
                                logLine(`  Pose error: ${err.message}`, "error");
                            }
                        }
                    }
                }
            } catch (err) {
                if (frameCounter % 60 === 0) {
                    logLine(`getImageTrackingResults error: ${err.message}`, "error");
                }
            }

            if (!imageDetected) {
                placedNode.visible = false;
                if (frameCounter % 60 === 0) {
                    setStatus("🔍 Searching for image...");
                }
            }

            renderer.render(scene, camera);
        });

        // Обработчики сессии
        session.addEventListener("end", () => {
            logLine("Session ended");
            renderer.setAnimationLoop(null);
            startButton.style.display = "block";
            startButton.disabled = false;
            startButton.textContent = "Start AR";
            setStatus("Session ended");
        });

        session.addEventListener("visibilitychange", () => {
            logLine(`Visibility: ${session.visibilityState}`);
        });
    }

    startButton.addEventListener("click", async () => {
        try {
            startButton.disabled = true;
            startButton.textContent = "Starting...";
            await startAR();
        } catch (err) {
            setStatus(`❌ ${err.message}`);
            logLine(err.stack || String(err), "error");
            startButton.disabled = false;
            startButton.textContent = "Start AR";
            startButton.style.display = "block";
        }
    });

    logLine("Page loaded. Click Start AR.");

    // Диагностика
    if (navigator.xr) {
        logLine("WebXR available");

        try {
            const supported = await navigator.xr.isSessionSupported("immersive-ar");
            logLine(`Immersive AR support: ${supported}`);
        } catch (err) {
            logLine(`Support check error: ${err.message}`, "error");
        }
    } else {
        logLine("WebXR NOT available", "error");
    }
</script>
</body>
</html>
