<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>WebXR AR — Куб на полу + UI панель</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      pointer-events: none; z-index: 10;
    }
    #status {
      color: white; background: rgba(0,0,0,0.6); padding: 12px 20px;
      border-radius: 8px; margin-bottom: 20px; text-align: center; max-width: 80%;
    }
    #start-ar {
      pointer-events: auto; padding: 15px 30px; font-size: 18px; font-weight: bold;
      background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    #start-ar:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>
<div id="overlay">
  <div id="status">Наведите камеру на пол — появится маркер.<br>Коснитесь экрана, чтобы поставить куб.</div>
  <button id="start-ar" disabled>▶ Start AR</button>
</div>

<script type="importmap">
  {
      "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
  }
</script>

<script type="module">
  import * as THREE from 'three';

  let camera, scene, renderer;
  let reticle;
  let hitTestSource = null;
  let hitTestSourceRequested = false;
  let controller;

  init();

  function init() {
    // 1. Базовая настройка сцены
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

    // Освещение (чтобы куб и панель были видны)
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
    light.position.set(0.5, 1, 0.25);
    scene.add(light);

    // 2. Настройка Renderer и WebXR
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 3. Создание Ретикла (Маркера)
    // ВАЖНО: RingGeometry нужно повернуть, чтобы лежал на полу
    const reticleGeometry = new THREE.RingGeometry(0.12, 0.15, 32).rotateX(-Math.PI / 2);
    const reticleMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
    reticle = new THREE.Mesh(reticleGeometry, reticleMaterial);

    // КРИТИЧЕСКИ ВАЖНО: Отключаем автообновление матрицы, 
    // иначе Three.js будет сбрасывать позицию, полученную от Hit Test
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // 4. Настройка контроллера для отслеживания касаний (Select)
    controller = renderer.xr.getController(0);
    controller.addEventListener('select', onSelect);
    scene.add(controller);

    // 5. Кнопка старта
    const startBtn = document.getElementById('start-ar');
    checkXRSupport(startBtn);
    startBtn.addEventListener('click', startAR);

    // Запуск цикла рендеринга
    renderer.setAnimationLoop(render);
    window.addEventListener('resize', onWindowResize);
  }

  async function checkXRSupport(btn) {
    if (navigator.xr) {
      const supported = await navigator.xr.isSessionSupported('immersive-ar');
      if (supported) {
        btn.disabled = false;
        btn.textContent = '▶ Start AR';
      } else {
        btn.textContent = 'AR не поддерживается';
      }
    } else {
      btn.textContent = 'WebXR недоступен';
    }
  }

  async function startAR() {
    try {
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'], // Запрашиваем Hit Test
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.getElementById('overlay') }
      });

      renderer.xr.setReferenceSpaceType('local-floor');
      await renderer.xr.setSession(session);

      document.getElementById('start-ar').style.display = 'none';
      document.getElementById('status').textContent = 'Ищите ровную поверхность...';

      session.addEventListener('end', () => {
        hitTestSourceRequested = false;
        hitTestSource = null;
        document.getElementById('start-ar').style.display = 'block';
        document.getElementById('status').textContent = 'Сессия завершена.';
      });
    } catch (err) {
      console.error("Ошибка запуска AR:", err);
      alert("Не удалось запустить AR. Убедитесь, что вы на HTTPS и используете ARCore.");
    }
  }

  // Обработчик касания экрана
  function onSelect() {
    if (reticle.visible) {
      // Получаем позицию из матрицы ретикла
      const position = new THREE.Vector3();
      const quaternion = new THREE.Quaternion();
      reticle.matrix.decompose(position, quaternion, new THREE.Vector3());

      // Ставим Куб
      const cubeGeo = new THREE.BoxGeometry(0.15, 0.15, 0.15);
      const cubeMat = new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.5 });
      const cube = new THREE.Mesh(cubeGeo, cubeMat);
      cube.position.copy(position);
      cube.position.y += 0.075; // Поднимаем на половину высоты, чтобы стоял на полу
      cube.quaternion.copy(quaternion);
      scene.add(cube);

      // Ставим UI Панель (Пример простого Plane с текстурой)
      const panelGeo = new THREE.PlaneGeometry(0.4, 0.2);
      const canvas = document.createElement('canvas');
      canvas.width = 400; canvas.height = 200;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(0, 0, 400, 200);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText('UI Панель', 120, 110);

      const panelTex = new THREE.CanvasTexture(canvas);
      const panelMat = new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, side: THREE.DoubleSide });
      const panel = new THREE.Mesh(panelGeo, panelMat);

      panel.position.copy(position);
      panel.position.y += 0.3; // Панель над кубом
      panel.lookAt(camera.position); // Поворачиваем панель к камере
      scene.add(panel);

      document.getElementById('status').textContent = 'Объект установлен! Коснитесь снова.';
    }
  }

  // Цикл рендеринга и Hit Test
  function render(timestamp, frame) {
    if (frame) {
      const referenceSpace = renderer.xr.getReferenceSpace();
      const session = renderer.xr.getSession();

      // Запрашиваем Hit Test Source один раз при старте
      if (hitTestSourceRequested === false) {
        session.requestReferenceSpace('viewer').then((viewerSpace) => {
          session.requestHitTestSource({ space: viewerSpace }).then((source) => {
            hitTestSource = source;
          });
        });
        hitTestSourceRequested = true;
      }

      // Обновляем позицию ретикла
      if (hitTestSource) {
        const hitTestResults = frame.getHitTestResults(hitTestSource);
        if (hitTestResults.length > 0) {
          const hit = hitTestResults[0];
          const pose = hit.getPose(referenceSpace);

          reticle.visible = true;
          // Применяем матрицу трансформации от Hit Test
          reticle.matrix.fromArray(pose.transform.matrix);
        } else {
          reticle.visible = false;
        }
      }
    }

    renderer.render(scene, camera);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
</script>
</body>
</html>
