<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MediaPipe Object Detection</title>
  
  <style>
    /* --- Стили как в примере Google --- */
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }
    
    #container {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }
    
    #webcam {
      width: 100%;
      display: block;
      border-radius: 8px;
    }
    
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 8px;
    }
    
    /* Статус и загрузка */
    #status {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      text-align: center;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.15);
      z-index: 10;
      white-space: nowrap;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0,0,0,0.8);
      padding: 20px 30px;
      border-radius: 12px;
      z-index: 20;
      display: none;
      text-align: center;
    }
    
    .loader {
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #007f8b;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    #error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff6b6b;
      background: rgba(0,0,0,0.9);
      padding: 20px 25px;
      border-radius: 12px;
      z-index: 30;
      display: none;
      max-width: 85%;
      border: 1px solid #ff6b6b;
      text-align: center;
    }
    
    /* --- Стили для WebLog (оставляем как есть) --- */
    #weblog-container {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 320px;
      max-height: 70vh;
      z-index: 9999;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      pointer-events: none;
    }
    
    #weblog-toggle {
      position: absolute;
      top: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #007f8b;
      font-size: 18px;
      cursor: pointer;
      pointer-events: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10001;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      user-select: none;
    }
    
    #weblog-toggle .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #ff4444;
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }
    
    #weblog-panel {
      position: absolute;
      top: 45px;
      right: 0;
      width: 100%;
      max-height: calc(70vh - 55px);
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(12px);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      overflow: hidden;
      display: none;
      pointer-events: auto;
    }
    
    #weblog-panel.open {
      display: block;
      animation: slideIn 0.3s ease;
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    #weblog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(0,0,0,0.3);
    }
    
    #weblog-header span {
      color: #aaa;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    #weblog-clear {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 8px;
      border-radius: 4px;
      transition: color 0.3s;
      pointer-events: auto;
    }
    
    #weblog-clear:hover {
      color: #ff6b6b;
    }
    
    #weblog-content {
      padding: 6px 10px;
      overflow-y: auto;
      max-height: calc(70vh - 100px);
    }
    
    #weblog-content::-webkit-scrollbar {
      width: 4px;
    }
    
    #weblog-content::-webkit-scrollbar-track {
      background: transparent;
    }
    
    #weblog-content::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }
    
    .log-entry {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      line-height: 1.4;
      word-break: break-all;
    }
    
    .log-entry .time {
      color: #666;
      margin-right: 8px;
      font-size: 9px;
    }
    
    .log-entry .level {
      display: inline-block;
      width: 14px;
      text-align: center;
      margin-right: 6px;
      font-weight: bold;
    }
    
    .log-entry .level.info { color: #4CAF50; }
    .log-entry .level.warn { color: #ffa726; }
    .log-entry .level.error { color: #ff6b6b; }
    .log-entry .level.debug { color: #42a5f5; }
    .log-entry .level.success { color: #66bb6a; }
    .log-entry .level.start { color: #ffd54f; }
    .log-entry .level.done { color: #81c784; }
    
    .log-entry .msg {
      color: #e0e0e0;
    }
    
    @media (max-width: 480px) {
      #status { font-size: 12px; padding: 8px 16px; bottom: 10px; }
      #weblog-container { width: 260px; top: 6px; right: 6px; }
      #weblog-toggle { width: 30px; height: 30px; font-size: 14px; }
      #weblog-content { font-size: 10px; max-height: calc(60vh - 90px); }
      #weblog-panel { max-height: calc(60vh - 45px); }
    }
  </style>
</head>
<body>

<div id="container">
  <!-- Видео (без зеркалирования, как в примере Google) -->
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  
  <div id="status">⏳ Инициализация...</div>
  <div id="loading">
    <div class="loader"></div>
    Загрузка модели...
  </div>
  <div id="error"></div>
</div>

<!-- WebLog -->
<div id="weblog-container">
  <div id="weblog-toggle" title="Показать/скрыть лог">
    📋
    <span class="badge" id="log-badge">0</span>
  </div>
  <div id="weblog-panel">
    <div id="weblog-header">
      <span>📋 Лог событий</span>
      <button id="weblog-clear" title="Очистить лог">✕</button>
    </div>
    <div id="weblog-content"></div>
  </div>
</div>

<!-- Используем import map как в примере Google -->
<script type="importmap">
{
  "imports": {
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs"
  }
}
</script>

<script type="module">
// Импортируем как в официальном примере
import { 
  ObjectDetector, 
  FilesetResolver, 
  DrawingUtils 
} from '@mediapipe/tasks-vision';

// ==========================================
// WEBLOG (упрощенная версия)
// ==========================================
class WebLog {
  constructor() {
    this.entries = [];
    this.maxEntries = 500;
    this.container = document.getElementById('weblog-content');
    this.badge = document.getElementById('log-badge');
    this.toggleBtn = document.getElementById('weblog-toggle');
    this.panel = document.getElementById('weblog-panel');
    this.clearBtn = document.getElementById('weblog-clear');
    this.isOpen = false;
    this.levelIcons = {
      info: 'ℹ️', warn: '⚠️', error: '❌', debug: '🔍',
      success: '✅', start: '🚀', done: '✔️'
    };
    this.initEvents();
    this.log('system', '📋 WebLog инициализирован', 'info');
  }
  
  initEvents() {
    this.toggleBtn.addEventListener('click', (e) => { e.stopPropagation(); this.toggle(); });
    this.clearBtn.addEventListener('click', (e) => { e.stopPropagation(); this.clear(); });
    document.addEventListener('click', (e) => {
      if (this.isOpen && !this.container.closest('#weblog-container').contains(e.target)) {
        this.close();
      }
    });
  }
  
  toggle() { this.isOpen ? this.close() : this.open(); }
  open() { 
    this.isOpen = true; 
    this.panel.classList.add('open'); 
    this.toggleBtn.textContent = '✕';
    this.toggleBtn.style.color = '#ff6b6b';
  }
  close() { 
    this.isOpen = false; 
    this.panel.classList.remove('open');
    this.toggleBtn.textContent = '📋';
    this.toggleBtn.style.color = '#007f8b';
  }
  clear() { this.entries = []; this.container.innerHTML = ''; this.updateBadge(); }
  
  log(category, message, level = 'info', data = null) {
    const timeStr = new Date().toLocaleTimeString('ru-RU', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const entry = { id: Date.now() + '_' + Math.random().toString(36).substr(2, 4), timeStr, category, message, level, data };
    this.entries.push(entry);
    if (this.entries.length > this.maxEntries) this.entries.shift();
    this.renderEntry(entry);
    this.updateBadge();
    const consoleMethod = level === 'error' ? 'error' : level === 'warn' ? 'warn' : level === 'debug' ? 'debug' : 'log';
    console[consoleMethod](`[${timeStr}] [${category}] ${message}`, data || '');
    this.container.scrollTop = this.container.scrollHeight;
  }
  
  renderEntry(entry) {
    const div = document.createElement('div');
    div.className = 'log-entry';
    div.dataset.id = entry.id;
    const icon = this.levelIcons[entry.level] || '📌';
    div.innerHTML = `<span class="time">${entry.timeStr}</span><span class="level ${entry.level}">${icon}</span><span class="msg">${this.escapeHtml(entry.message)}</span>`;
    this.container.appendChild(div);
  }
  
  escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
  updateBadge() { const count = this.entries.length; this.badge.textContent = count; this.badge.style.display = count > 0 ? 'flex' : 'none'; }
  info(category, message, data) { this.log(category, message, 'info', data); }
  warn(category, message, data) { this.log(category, message, 'warn', data); }
  error(category, message, data) { this.log(category, message, 'error', data); }
  debug(category, message, data) { this.log(category, message, 'debug', data); }
  success(category, message, data) { this.log(category, message, 'success', data); }
  start(category, message, data) { this.log(category, message, 'start', data); }
  done(category, message, data) { this.log(category, message, 'done', data); }
}

const log = new WebLog();

// ==========================================
// ОСНОВНОЙ КЛАСС (как в примере Google)
// ==========================================

class ObjectDetectorTask {
  // Настройки как в примере Google
  scoreThreshold = 0.5;
  maxResults = 3;
  
  // Модели как в примере Google
  models = {
    efficientdet_lite0: 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float32/1/efficientdet_lite0.tflite',
    efficientdet_lite2: 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float32/1/efficientdet_lite2.tflite',
    ssd_mobilenet_v2: 'https://storage.googleapis.com/mediapipe-models/object_detector/ssd_mobilenet_v2/float32/1/ssd_mobilenet_v2.tflite',
  };
  
  currentModel = this.models.efficientdet_lite0;
  
  constructor() {
    this.video = document.getElementById('webcam');
    this.canvas = document.getElementById('canvas');
    this.canvasCtx = this.canvas.getContext('2d');
    this.statusEl = document.getElementById('status');
    this.loadingEl = document.getElementById('loading');
    this.errorEl = document.getElementById('error');
    
    this.detector = null;
    this.isRunning = false;
    this.frameCount = 0;
    
    log.info('app', 'ObjectDetectorTask создан');
  }
  
  // === ИНИЦИАЛИЗАЦИЯ КАК В ПРИМЕРЕ GOOGLE ===
  async initialize() {
    log.start('app', 'Инициализация ObjectDetectorTask...');
    
    try {
      // 1. Загружаем WASM
      log.info('mediapipe', 'Загрузка WASM...');
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );
      log.success('mediapipe', 'WASM загружен');
      
      // 2. Создаем детектор с опциями как в примере
      log.info('mediapipe', `Загрузка модели: ${this.currentModel}`);
      this.detector = await ObjectDetector.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: this.currentModel,
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        maxResults: this.maxResults,
        scoreThreshold: this.scoreThreshold
      });
      log.success('mediapipe', 'Детектор создан');
      
      // 3. Запускаем камеру
      await this.setupCamera();
      
      // 4. Запускаем цикл детекции
      this.isRunning = true;
      this.detectLoop();
      
      log.success('app', '✅ Все готово!');
      this.statusEl.textContent = '✅ Готово! Детекция запущена';
      
    } catch (error) {
      log.error('app', 'Ошибка инициализации: ' + error.message);
      this.showError('Ошибка: ' + error.message);
    }
  }
  
  // === КАМЕРА ===
  async setupCamera() {
    log.start('camera', 'Запрос доступа к камере...');
    this.statusEl.textContent = '📷 Запрос доступа к камере...';
    
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: false
      });
      
      this.video.srcObject = stream;
      await this.video.play();
      
      this.canvas.width = this.video.videoWidth || 640;
      this.canvas.height = this.video.videoHeight || 480;
      
      log.success('camera', `Камера запущена: ${this.canvas.width}x${this.canvas.height}`);
      this.statusEl.textContent = '📷 Камера готова';
      return true;
    } catch (error) {
      log.error('camera', 'Ошибка: ' + error.message);
      this.showError('Доступ к камере: ' + error.message);
      return false;
    }
  }
  
  // === ОТРИСОВКА КАК В ПРИМЕРЕ GOOGLE ===
  drawDetection(ctx, detection, mirror = false) {
    const drawingUtils = new DrawingUtils(ctx);
    
    // Рисуем bounding box как в примере Google
    drawingUtils.drawBoundingBox(detection.boundingBox, {
      color: '#007f8b',
      lineWidth: 4,
      fillColor: 'transparent',
    });
    
    // Текст с названием и процентом
    const { originX, originY } = detection.boundingBox;
    let x = originX;
    
    ctx.fillStyle = '#007f8b';
    ctx.font = '16px sans-serif';
    
    const category = detection.categories[0];
    const score = category.score ? Math.round(category.score * 100) : 0;
    const labelText = `${category.categoryName} - ${score}%`;
    const textWidth = ctx.measureText(labelText).width;
    
    // Зеркалирование для видео (как в примере Google)
    if (mirror) {
      ctx.save();
      const centerX = x + (textWidth + 10) / 2;
      const centerY = originY + 12.5;
      
      ctx.translate(centerX, centerY);
      ctx.scale(-1, 1);
      ctx.translate(-centerX, -centerY);
      
      ctx.fillRect(x, originY, textWidth + 10, 25);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(labelText, x + 5, originY + 18);
      ctx.restore();
    } else {
      ctx.fillRect(x, originY, textWidth + 10, 25);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(labelText, x + 5, originY + 18);
    }
  }
  
  displayVideoResult(result) {
    // Очищаем canvas
    this.canvasCtx.clearRect(0, 0, this.canvas.width, this.canvas.height);
    
    // Рисуем видео на canvas (без зеркалирования, как в примере Google)
    this.canvasCtx.drawImage(this.video, 0, 0, this.canvas.width, this.canvas.height);
    
    // Рисуем детекции
    if (result.detections) {
      for (let detection of result.detections) {
        this.drawDetection(this.canvasCtx, detection, true); // mirror = true для видео
      }
    }
  }
  
  // === ЦИКЛ ДЕТЕКЦИИ ===
  detectLoop() {
    if (!this.isRunning) return;
    
    if (this.detector && this.video.readyState >= 2) {
      try {
        const startTime = performance.now();
        const detections = this.detector.detectForVideo(this.video, performance.now());
        const processTime = (performance.now() - startTime).toFixed(1);
        
        this.frameCount++;
        const count = detections.detections ? detections.detections.length : 0;
        
        // Обновляем статус
        if (count > 0) {
          const top = detections.detections[0];
          const label = top.categories[0]?.categoryName || 'объект';
          const score = Math.round((top.categories[0]?.score || 0) * 100);
          this.statusEl.textContent = `🎯 ${count} объектов | ${label} (${score}%) | ${processTime}ms`;
        } else {
          this.statusEl.textContent = `🔍 Сканирование... ${processTime}ms`;
        }
        
        // Отрисовываем результат
        this.displayVideoResult(detections);
        
        // Логируем каждый 30-й кадр
        if (this.frameCount % 30 === 0 && count > 0) {
          log.debug('detection', `Кадр ${this.frameCount}: ${count} объектов, ${processTime}ms`);
        }
        
      } catch (error) {
        log.error('detection', 'Ошибка: ' + error.message);
        this.statusEl.textContent = '⚠️ Ошибка детекции';
      }
    }
    
    requestAnimationFrame(() => this.detectLoop());
  }
  
  // === ОШИБКИ ===
  showError(message) {
    this.errorEl.textContent = '❌ ' + message;
    this.errorEl.style.display = 'block';
    this.loadingEl.style.display = 'none';
    this.statusEl.textContent = '❌ Ошибка';
  }
  
  // === ОЧИСТКА ===
  cleanup() {
    this.isRunning = false;
    if (this.detector) {
      this.detector.close();
      this.detector = null;
    }
    log.info('app', 'Очистка ресурсов');
  }
}

// ==========================================
// ЗАПУСК
// ==========================================

// Создаем экземпляр
const task = new ObjectDetectorTask();

// Обработчики ошибок
window.addEventListener('error', (event) => {
  log.error('global', 'Ошибка: ' + (event.error?.message || event.message));
});

window.addEventListener('unhandledrejection', (event) => {
  log.error('global', 'Unhandled rejection: ' + (event.reason?.message || event.reason));
});

// Запускаем
task.initialize().catch(error => {
  log.error('app', 'Критическая ошибка: ' + error.message);
  task.showError('Запуск: ' + error.message);
});

// Для очистки при закрытии страницы
window.addEventListener('beforeunload', () => {
  task.cleanup();
});

</script>
</body>
</html>
