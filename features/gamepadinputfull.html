<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>🎮 Gamepad Input Tester</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 100%);
    color: #e2e8f0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #a5b4fc;
    text-shadow: 0 0 20px rgba(129, 140, 248, 0.5);
    font-size: 24px;
  }

  .hint {
    text-align: center;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 20px;
    padding: 10px;
    background: rgba(30, 41, 59, 0.5);
    border-radius: 8px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }

  .hint strong { color: #fbbf24; }

  .container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  @media (max-width: 800px) {
    .container { grid-template-columns: 1fr; }
  }

  .panel {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px;
    padding: 16px;
    backdrop-filter: blur(10px);
  }

  .panel h2 {
    color: #a5b4fc;
    font-size: 14px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(148, 163, 184, 0.2);
  }

  .buttons-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .gamepad-btn {
    aspect-ratio: 1;
    background: rgba(30, 41, 59, 0.8);
    border: 2px solid rgba(99, 102, 241, 0.3);
    border-radius: 8px;
    color: #94a3b8;
    font-size: 11px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: all 0.1s ease;
    cursor: pointer;
    position: relative;
  }

  .gamepad-btn .idx {
    font-size: 9px;
    color: #64748b;
    margin-top: 2px;
  }

  .gamepad-btn.pressed {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-color: #c7d2fe;
    color: white;
    box-shadow: 0 0 20px rgba(129, 140, 248, 0.8);
    transform: scale(0.95);
  }

  .axis-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding: 8px;
    background: rgba(30, 41, 59, 0.5);
    border-radius: 6px;
  }

  .axis-label {
    font-size: 11px;
    color: #94a3b8;
    min-width: 50px;
  }

  .axis-bar {
    flex: 1;
    height: 20px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 10px;
    position: relative;
    overflow: hidden;
  }

  .axis-fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 0;
    background: linear-gradient(90deg, #10b981, #34d399);
    transition: left 0.05s, width 0.05s;
    border-radius: 10px;
  }

  .axis-fill.negative {
    left: auto;
    right: 50%;
    background: linear-gradient(90deg, #f59e0b, #fbbf24);
  }

  .axis-value {
    font-size: 11px;
    color: #e2e8f0;
    min-width: 60px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .status {
    padding: 10px;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 8px;
    color: #fca5a5;
    font-size: 12px;
    text-align: center;
    margin-bottom: 16px;
  }

  .status.connected {
    background: rgba(16, 185, 129, 0.1);
    border-color: rgba(16, 185, 129, 0.3);
    color: #6ee7b7;
  }

  .gamepad-id {
    font-size: 10px;
    color: #64748b;
    margin-top: 4px;
    word-break: break-all;
  }
</style>
</head>
<body>

<h1>🎮 Gamepad Input Tester</h1>

<div class="hint">
  Подключите геймпад или USB-джойстик и нажмите любую кнопку для активации.<br>
  Логи всех событий отображаются в <strong>перетаскиваемом оверлее</strong> слева.
</div>

<div class="container">
  <div class="panel">
    <h2>📡 Статус и кнопки</h2>
    <div id="status" class="status">⏳ Ожидание подключения геймпада...</div>
    
    <h2 style="margin-top: 16px;">🔘 Кнопки</h2>
    <div id="buttons-grid" class="buttons-grid"></div>
  </div>

  <div class="panel">
    <h2>🕹️ Оси (стики / триггеры)</h2>
    <div id="axes-container">
      <div style="color: #64748b; font-size: 12px; text-align: center; padding: 20px;">
        Оси появятся после подключения устройства
      </div>
    </div>
  </div>
</div>

<!-- Overlay Log (подключается как обычный скрипт — работает и локально) -->
<script src="overlaylog.js"></script>

<!-- Gamepad Manager встроен прямо в HTML (не требует ES6 модулей) -->
<script>
(function() {
'use strict';

/**
 * GamepadManager — модуль управления геймпадами.
 * Поддерживает стандартные геймпады и старые USB-устройства (DirectInput).
 */
class GamepadManager {
    constructor(options = {}) {
        this.deadzone = options.deadzone ?? 0.15;
        this.pollingInterval = options.pollingInterval ?? 16;
        
        this.gamepads = new Map();
        this.previousStates = new Map();
        this.listeners = {
            connect: [],
            disconnect: [],
            buttondown: [],
            buttonup: [],
            axis: [],
            rawupdate: []
        };

        this._isPolling = false;
        this._rafId = null;

        this._bindEvents();
        this._checkInitialConnections();
    }

    on(event, callback) {
        if (this.listeners[event]) this.listeners[event].push(callback);
        return this;
    }

    off(event, callback) {
        if (this.listeners[event]) {
            this.listeners[event] = this.listeners[event].filter(cb => cb !== callback);
        }
        return this;
    }

    getRawState(index) {
        const gp = navigator.getGamepads()[index];
        return gp ? {
            id: gp.id,
            index: gp.index,
            mapping: gp.mapping,
            buttons: gp.buttons.map(b => ({ pressed: b.pressed, value: b.value })),
            axes: [...gp.axes]
        } : null;
    }

    start() {
        if (this._isPolling) return;
        this._isPolling = true;
        this._loop();
    }

    stop() {
        this._isPolling = false;
        if (this._rafId) cancelAnimationFrame(this._rafId);
    }

    destroy() {
        this.stop();
        window.removeEventListener("gamepadconnected", this._onConnect);
        window.removeEventListener("gamepaddisconnected", this._onDisconnect);
        this.gamepads.clear();
        this.previousStates.clear();
    }

    _bindEvents() {
        this._onConnect = (e) => this._handleConnect(e.gamepad);
        this._onDisconnect = (e) => this._handleDisconnect(e.gamepad);
        window.addEventListener("gamepadconnected", this._onConnect);
        window.addEventListener("gamepaddisconnected", this._onDisconnect);
    }

    _checkInitialConnections() {
        const gamepads = navigator.getGamepads();
        for (let gp of gamepads) {
            if (gp) this._handleConnect(gp);
        }
    }

    _handleConnect(gp) {
        this.gamepads.set(gp.index, gp);
        this.previousStates.set(gp.index, this._getBlankState(gp));
        this._emit('connect', { index: gp.index, id: gp.id, mapping: gp.mapping });
        if (!this._isPolling) this.start();
        console.log(`[Gamepad] Подключен: ${gp.id} (Mapping: ${gp.mapping || 'custom/old'})`);
    }

    _handleDisconnect(gp) {
        this.gamepads.delete(gp.index);
        this.previousStates.delete(gp.index);
        this._emit('disconnect', { index: gp.index, id: gp.id });
        if (this.gamepads.size === 0) this.stop();
        console.log(`[Gamepad] Отключен: ${gp.id}`);
    }

    _loop() {
        if (!this._isPolling) return;
        const currentGamepads = navigator.getGamepads();
        
        for (let i = 0; i < currentGamepads.length; i++) {
            const gp = currentGamepads[i];
            if (!gp || !this.previousStates.has(i)) continue;

            const prevState = this.previousStates.get(i);
            
            for (let b = 0; b < gp.buttons.length; b++) {
                const currBtn = gp.buttons[b];
                const prevBtn = prevState.buttons[b];
                if (currBtn.pressed && !prevBtn.pressed) {
                    this._emit('buttondown', { index: i, button: b, value: currBtn.value });
                } else if (!currBtn.pressed && prevBtn.pressed) {
                    this._emit('buttonup', { index: i, button: b });
                }
            }

            for (let a = 0; a < gp.axes.length; a++) {
                const rawValue = gp.axes[a];
                const value = Math.abs(rawValue) < this.deadzone ? 0 : rawValue;
                if (Math.abs(value - prevState.axes[a]) > 0.01) {
                    this._emit('axis', { index: i, axis: a, value: value, raw: rawValue });
                }
            }

            this._emit('rawupdate', { index: i, gamepad: gp });

            this.previousStates.set(i, {
                buttons: gp.buttons.map(b => ({ pressed: b.pressed, value: b.value })),
                axes: [...gp.axes]
            });
        }

        this._rafId = requestAnimationFrame(() => this._loop());
    }

    _getBlankState(gp) {
        return {
            buttons: gp.buttons.map(() => ({ pressed: false, value: 0 })),
            axes: gp.axes.map(() => 0)
        };
    }

    _emit(event, data) {
        this.listeners[event].forEach(cb => cb(data));
    }
}

// Делаем класс глобально доступным
window.GamepadManager = GamepadManager;

// --- Логика UI ---
const BUTTON_NAMES = ['A', 'B', 'X', 'Y', 'LB', 'RB', 'LT', 'RT', 
                      'Back', 'Start', 'L3', 'R3', '↑', '↓', '←', '→', 'Home'];

const statusEl = document.getElementById('status');
const buttonsGrid = document.getElementById('buttons-grid');
const axesContainer = document.getElementById('axes-container');

let activeGamepadIndex = null;
let buttonElements = [];
let axisElements = [];

const gpManager = new GamepadManager({ deadzone: 0.15 });

gpManager.on('connect', (e) => {
    activeGamepadIndex = e.index;
    statusEl.classList.add('connected');
    statusEl.innerHTML = `✅ Геймпад подключен (Index: ${e.index})
        <div class="gamepad-id">${e.id}</div>
        <div class="gamepad-id">Mapping: ${e.mapping || 'custom/old (DirectInput)'}</div>`;
    console.log(`🎮 Подключен: ${e.id}`);
    console.log(`📊 Mapping: ${e.mapping || 'нестандартный'}`);
    buildUI(e.index);
});

gpManager.on('disconnect', (e) => {
    if (e.index === activeGamepadIndex) {
        activeGamepadIndex = null;
        statusEl.classList.remove('connected');
        statusEl.innerHTML = '⏳ Ожидание подключения геймпада...';
        buttonsGrid.innerHTML = '';
        axesContainer.innerHTML = '<div style="color: #64748b; font-size: 12px; text-align: center; padding: 20px;">Оси появятся после подключения устройства</div>';
        console.warn(`🔌 Отключен: ${e.id}`);
    }
});

gpManager.on('buttondown', (e) => {
    if (e.index !== activeGamepadIndex) return;
    const name = BUTTON_NAMES[e.button] || `Btn ${e.button}`;
    const value = e.value !== undefined ? ` (value: ${e.value.toFixed(2)})` : '';
    console.log(`👇 Кнопка [${e.button}] "${name}" НАЖАТА${value}`);
    if (buttonElements[e.button]) buttonElements[e.button].classList.add('pressed');
});

gpManager.on('buttonup', (e) => {
    if (e.index !== activeGamepadIndex) return;
    const name = BUTTON_NAMES[e.button] || `Btn ${e.button}`;
    console.log(`👆 Кнопка [${e.button}] "${name}" ОТПУЩЕНА`);
    if (buttonElements[e.button]) buttonElements[e.button].classList.remove('pressed');
});

gpManager.on('axis', (e) => {
    if (e.index !== activeGamepadIndex) return;
    if (axisElements[e.axis]) {
        const { fill, valueEl } = axisElements[e.axis];
        const v = e.value;
        valueEl.textContent = v.toFixed(3);
        if (v >= 0) {
            fill.classList.remove('negative');
            fill.style.left = '50%';
            fill.style.width = (v * 50) + '%';
            fill.style.right = 'auto';
        } else {
            fill.classList.add('negative');
            fill.style.right = '50%';
            fill.style.left = 'auto';
            fill.style.width = (Math.abs(v) * 50) + '%';
        }
    }
    if (Math.abs(e.value) > 0.5) {
        console.log(`🕹️ Ось [${e.axis}]: ${e.value.toFixed(3)}`);
    }
});

function buildUI(gamepadIndex) {
    const raw = gpManager.getRawState(gamepadIndex);
    if (!raw) return;

    buttonsGrid.innerHTML = '';
    buttonElements = [];
    for (let i = 0; i < raw.buttons.length; i++) {
        const btn = document.createElement('div');
        btn.className = 'gamepad-btn';
        const name = BUTTON_NAMES[i] || `Btn`;
        btn.innerHTML = `<span>${name}</span><span class="idx">#${i}</span>`;
        buttonsGrid.appendChild(btn);
        buttonElements[i] = btn;
    }

    axesContainer.innerHTML = '';
    axisElements = [];
    for (let i = 0; i < raw.axes.length; i++) {
        const row = document.createElement('div');
        row.className = 'axis-row';
        row.innerHTML = `
            <div class="axis-label">Axis ${i}</div>
            <div class="axis-bar"><div class="axis-fill"></div></div>
            <div class="axis-value">0.000</div>
        `;
        axesContainer.appendChild(row);
        axisElements[i] = {
            fill: row.querySelector('.axis-fill'),
            valueEl: row.querySelector('.axis-value')
        };
    }
    console.log(`🎛️ UI построен: ${raw.buttons.length} кнопок, ${raw.axes.length} осей`);
}

})();
</script>

</body>
</html>
