<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaPipe Object Detection</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Видео и канвас на весь экран */
    #video, #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    /* Зеркалим ТОЛЬКО видео (селфи-режим). Канвас НЕ зеркалируем! */
    #video {
      transform: scaleX(-1);
    }

    /* Канвас поверх видео */
    #canvas {
      z-index: 1;
      pointer-events: none;
    }

    /* Стартовое сообщение */
    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      font-size: 22px;
      text-align: center;
      z-index: 5;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    #overlay.hidden { display: none; }

    /* Панель лога */
    #logPanel {
      position: absolute;
      bottom: 15px;
      left: 15px;
      width: 360px;
      max-height: 45vh;
      background: rgba(20, 20, 20, 0.85);
      color: #e0e0e0;
      border-radius: 10px;
      z-index: 10;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      font-size: 13px;
      overflow: hidden;
    }
    #logHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    #logHeader .title { font-weight: 600; }
    #logHeader .close {
      cursor: pointer;
      opacity: 0.7;
      padding: 0 4px;
    }
    #logHeader .close:hover { opacity: 1; }
    #logContent {
      padding: 8px 12px;
      overflow-y: auto;
      flex: 1;
      font-family: "SF Mono", Consolas, monospace;
      line-height: 1.5;
    }
    #logContent.collapsed { display: none; }
    .log-entry { margin: 2px 0; word-break: break-word; }
    .log-entry.info    { color: #7ec8ff; }
    .log-entry.success { color: #7eff9e; }
    .log-entry.warn    { color: #ffd57e; }
    .log-entry.error   { color: #ff7e7e; }
    .log-entry.detect  { color: #c8a0ff; }

    /* Счётчик детекций */
    #detectCount {
      display: inline-block;
      background: #4a90e2;
      color: #fff;
      border-radius: 10px;
      padding: 0 6px;
      font-size: 11px;
      margin-left: 6px;
      min-width: 18px;
      text-align: center;
    }

    /* Кнопка полноэкранного режима */
    #fsBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 10;
      background: rgba(20,20,20,0.7);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      backdrop-filter: blur(8px);
    }
    #fsBtn:hover { background: rgba(40,40,40,0.9); }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="overlay">
  <div>⏳ Инициализация...</div>
  <div style="font-size:16px;opacity:0.8;margin-top:8px;">Загрузка модели...</div>
</div>

<button id="fsBtn" title="Полный экран">⛶ Полный экран</button>

<div id="logPanel">
  <div id="logHeader">
    <span><span id="detectCount">0</span>📋 Лог событий</span>
    <span class="close" id="logClose" title="Свернуть">✕</span>
  </div>
  <div id="logContent"></div>
</div>

<!-- MediaPipe Tasks Vision -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js"
        crossorigin="anonymous"></script>

<script>
  (function () {
    'use strict';

    const video      = document.getElementById('video');
    const canvas     = document.getElementById('canvas');
    const ctx        = canvas.getContext('2d');
    const overlay    = document.getElementById('overlay');
    const logContent = document.getElementById('logContent');
    const logHeader  = document.getElementById('logHeader');
    const logClose   = document.getElementById('logClose');
    const detectCount= document.getElementById('detectCount');
    const fsBtn      = document.getElementById('fsBtn');

    let objectDetector = null;
    let running = false;
    let detectionCounter = 0;

    // ---------- Логгер ----------
    function log(msg, type = 'info') {
      const t = new Date().toLocaleTimeString('ru-RU');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = `[${t}] ${msg}`;
      logContent.appendChild(entry);
      logContent.scrollTop = logContent.scrollHeight;
      console.log(`[${type}] ${msg}`);
    }

    logHeader.addEventListener('click', (e) => {
      if (e.target === logClose) {
        document.getElementById('logPanel').style.display = 'none';
      } else {
        logContent.classList.toggle('collapsed');
      }
    });

    // ---------- Полный экран ----------
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          log('Не удалось войти в полноэкранный режим: ' + err.message, 'warn');
        });
      } else {
        document.exitFullscreen();
      }
    });

    // Подгоняем canvas под реальные размеры видео (для точных координат)
    function resizeCanvasToVideo() {
      const w = video.videoWidth  || window.innerWidth;
      const h = video.videoHeight || window.innerHeight;
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width  = w;
        canvas.height = h;
        log(`Canvas: ${w}×${h}`, 'info');
      }
    }

    // ---------- Инициализация камеры ----------
    async function startCamera() {
      log('Запрос доступа к камере...', 'info');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        await new Promise(resolve => {
          if (video.readyState >= 2) resolve();
          else video.onloadedmetadata = () => resolve();
        });
        await video.play();
        resizeCanvasToVideo();
        log('Камера активна: ' + video.videoWidth + '×' + video.videoHeight, 'success');
        return true;
      } catch (err) {
        log('Ошибка камеры: ' + err.message, 'error');
        overlay.innerHTML = '<div style="color:#ff7e7e">❌ Ошибка камеры</div><div style="font-size:14px">' + err.message + '</div>';
        return false;
      }
    }

    // ---------- Инициализация MediaPipe ----------
    async function initDetector() {
      log('Загрузка модели EfficientDet Lite0...', 'info');
      try {
        const { ObjectDetector, FilesetResolver } = await self.createMediaPipeTasks();
        const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        objectDetector = await ObjectDetector.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
            delegate: "GPU"
          },
          scoreThreshold: 0.5,
          maxResults: 10,
          runningMode: "VIDEO"
        });
        log('Модель загружена ✓', 'success');
        return true;
      } catch (err) {
        log('Ошибка загрузки модели: ' + err.message, 'error');
        overlay.innerHTML = '<div style="color:#ff7e7e">❌ Ошибка модели</div><div style="font-size:14px">' + err.message + '</div>';
        return false;
      }
    }

    // ---------- Отрисовка ----------
    // Цвета для разных категорий
    const COLORS = ['#00ff88', '#ffcc00', '#ff66cc', '#66ccff', '#ff9933', '#cc66ff'];
    function colorFor(label) {
      let h = 0;
      for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) & 0xffffffff;
      return COLORS[Math.abs(h) % COLORS.length];
    }

    function drawDetections(results) {
      const W = canvas.width;
      const H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      if (!results || !results.detections || results.detections.length === 0) return;

      let frameDetected = 0;

      results.detections.forEach(det => {
        const bbox = det.boundingBox;
        // Нормализованные координаты -> пиксели (в системе координат видео)
        const originX = bbox.originX * W;
        const originY = bbox.originY * H;
        const bw      = bbox.width   * W;
        const bh      = bbox.height  * H;

        // Ключевой момент: видео отзеркалено через CSS (scaleX(-1)),
        // поэтому инвертируем X для рамок и текста, чтобы они совпадали с объектами.
        // Текст при этом рисуется обычным шрифтом и читается правильно.
        const mirroredX = W - originX - bw;

        const topCategory = det.categories[0];
        const label = topCategory.categoryName || 'object';
        const score = (topCategory.score * 100).toFixed(0);
        const color = colorFor(label);

        // Рамка
        ctx.strokeStyle = color;
        ctx.lineWidth   = Math.max(2, Math.round(W / 500));
        ctx.strokeRect(mirroredX, originY, bw, bh);

        // Подпись (фон + текст)
        const text = `${label} ${score}%`;
        ctx.font = `${Math.max(14, Math.round(W / 70))}px Arial`;
        const textMetrics = ctx.measureText(text);
        const textHeight  = parseInt(ctx.font, 10) + 6;
        const textWidth   = textMetrics.width + 10;

        // Фон подписи — чуть выше рамки
        const labelY = originY - textHeight - 2;
        ctx.fillStyle = color;
        ctx.fillRect(mirroredX, labelY, textWidth, textHeight);

        // Сам текст — обычным (не зеркальным) начертанием
        ctx.fillStyle = '#000';
        ctx.fillText(text, mirroredX + 5, labelY + textHeight - 6);

        frameDetected++;
      });

      if (frameDetected > 0) {
        detectionCounter += frameDetected;
        detectCount.textContent = detectionCounter;
      }
    }

    // ---------- Главный цикл ----------
    let lastVideoTime = -1;
    async function loop() {
      if (!running) return;
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        resizeCanvasToVideo();
        try {
          const results = objectDetector.detectForVideo(video, performance.now());
          drawDetections(results);
        } catch (err) {
          log('Ошибка детекции: ' + err.message, 'error');
        }
      }
      requestAnimationFrame(loop);
    }

    // ---------- Старт ----------
    async function start() {
      log('Запуск приложения...', 'info');
      const camOk = await startCamera();
      if (!camOk) return;

      const modelOk = await initDetector();
      if (!modelOk) return;

      overlay.classList.add('hidden');
      running = true;
      log('Детекция запущена ▶', 'success');
      requestAnimationFrame(loop);
    }

    start();
  })();
</script>

</body>
</html>
